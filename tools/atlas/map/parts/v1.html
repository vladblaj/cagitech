<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Shape of Romania — Interactive Atlas</title>
<style>/*LEAFLET_CSS*/</style>
<style>
:root{
  --bg:#0a0c13; --bg2:#0f1220; --panel:#12162a; --panel2:#171c33;
  --line:#242c4a; --line2:#2f3a5f;
  --text:#e8eaf2; --dim:#98a0bd; --dimmer:#69708c; --gold:#f0c04a;
  --voronet:#4a90d0; --voronet-deep:#2c6ba8; --voronet-pale:#8fbee4;
  --ochre:#d2a03f; --oxide:#b34c33;
  --rail:392px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--text);overflow:hidden;
  font:14.5px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
#app{display:flex;height:100vh;height:100dvh}

/* ------------------------------------------------------------ left rail */
#rail{
  width:var(--rail);flex:none;background:var(--bg2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.rail-head{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.eyebrow{
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);
  margin-bottom:9px;display:flex;align-items:center;gap:9px;
}
.eyebrow:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent);opacity:.4}
.rail-head h1{margin:0 0 6px;font-size:20px;font-weight:660;letter-spacing:-.015em;line-height:1.2}
.rail-head p{margin:0;color:var(--dim);font-size:12.5px;line-height:1.55}

/* era strip */
#eraStrip{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;padding:1px;flex:none;
  background:var(--line);border-bottom:1px solid var(--line)}
#eraStrip button{
  background:var(--bg);border:0;cursor:pointer;padding:7px 2px 6px;color:var(--dimmer);
  font:inherit;font-size:9.5px;letter-spacing:.03em;white-space:nowrap;transition:.16s;
  text-align:center;line-height:1.35;box-shadow:inset 0 -2px 0 transparent;
}
#eraStrip button b{display:block;font-size:12px;letter-spacing:.08em;font-weight:660;color:inherit}
#eraStrip button:hover{color:var(--text);background:var(--panel2)}
#eraStrip button[aria-selected="true"]{color:var(--gold);background:var(--panel);
  box-shadow:inset 0 -2px 0 var(--gold)}

#eraBody{flex:1;overflow-y:auto;padding:20px 22px 30px;min-height:0;scrollbar-width:thin}
#eraBody h2{margin:0 0 4px;font-size:19px;font-weight:660;letter-spacing:-.01em;line-height:1.22}
.era-years{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.era-lead{color:var(--dim);font-size:13px;line-height:1.6;margin:0 0 20px}
.era-lead b{color:var(--text);font-weight:600}
.ev{padding:14px 0;border-top:1px solid var(--line)}
.ev-d{font-size:11px;letter-spacing:.06em;color:var(--ochre);margin-bottom:3px;font-variant-numeric:tabular-nums}
.ev h3{margin:0 0 5px;font-size:14px;font-weight:640;line-height:1.35}
.ev p{margin:0;font-size:12.8px;line-height:1.62;color:var(--dim)}
.ev p b{color:var(--text);font-weight:600}
.ev.odd .ev-d{color:var(--voronet)}
.tagodd{font-size:9px;letter-spacing:.16em;color:var(--bg);background:var(--voronet);
  padding:2px 5px;border-radius:2px;margin-left:7px;vertical-align:1.5px;font-weight:700}

/* ------------------------------------------------------------ map + hud */
#mapWrap{flex:1;position:relative;min-width:0}
#map{position:absolute;inset:0;background:#070a11}
.hud{
  position:absolute;z-index:600;background:rgba(12,16,32,.93);border:1px solid var(--line);
  border-radius:10px;backdrop-filter:blur(8px);padding:12px 13px;
}
#hudLayers{top:12px;right:12px;width:198px}
.hud h4{margin:0 0 8px;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dimmer);font-weight:700}
.hud h4+h4{margin-top:14px}
.opt{display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:6px;cursor:pointer;
  color:var(--dim);font-size:12.5px;transition:.15s;user-select:none}
.opt:hover{background:var(--panel2);color:var(--text)}
.opt input{accent-color:var(--gold);margin:0;width:13px;height:13px;flex:none}
.opt[data-on="1"]{color:var(--text)}

#legend{bottom:44px;left:12px;max-width:250px}
#legend .row{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--dim);padding:2.5px 0}
#legend .row i{width:19px;height:11px;flex:none;border-radius:2px;border:1px solid rgba(255,255,255,.16)}

#credit{
  position:absolute;z-index:600;bottom:0;right:0;background:rgba(10,12,19,.86);
  color:var(--dimmer);font-size:10.5px;padding:4px 9px;border-top-left-radius:7px;
  border-top:1px solid var(--line);border-left:1px solid var(--line);max-width:min(560px,80vw);
}
#credit a{color:var(--dim)}

/* leaflet skin */
.leaflet-container{background:#070a11;font:inherit;outline:none}
.leaflet-control-zoom a{background:rgba(12,16,32,.94)!important;color:var(--text)!important;
  border-color:var(--line)!important}
.leaflet-control-zoom a:hover{background:var(--panel2)!important}
.leaflet-control-scale-line{background:rgba(12,16,32,.8);color:var(--dim);border-color:var(--line2)}
.leaflet-control-attribution{display:none}
.leaflet-overlay-pane path{transition:fill .55s ease,fill-opacity .55s ease,stroke-opacity .55s ease,stroke .55s ease}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--text);
  border:1px solid var(--line2);box-shadow:0 12px 34px -14px #000}
.leaflet-popup-content{margin:11px 14px;font-size:12.8px;line-height:1.55}
.leaflet-popup-content b{color:var(--gold)}
.leaflet-popup-close-button{color:var(--dimmer)!important}

.lbl-region,.lbl-foreign,.lbl-site{
  background:none;border:0;box-shadow:none;white-space:nowrap;pointer-events:none;
}
.lbl-region span{
  color:#f6f2e8;font-size:12.5px;letter-spacing:.19em;text-transform:uppercase;font-weight:600;
  text-shadow:0 0 4px #060c14,0 0 9px #060c14,0 1px 2px #000;
}
.lbl-foreign span{
  color:#9aa6b8;font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;
  text-shadow:0 0 4px #060c14,0 0 8px #060c14;
}
.lbl-site span{
  color:#e9e2d3;font-size:11.5px;letter-spacing:.03em;font-weight:500;
  text-shadow:0 0 3px #060c14,0 0 7px #060c14,0 1px 2px #000;
}
.lbl-county span{color:#8f9ab0;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  text-shadow:0 0 4px #060c14,0 0 8px #060c14}

#hudToggle{
  display:none;position:absolute;z-index:601;top:12px;right:12px;
  background:rgba(12,16,32,.94);border:1px solid var(--line);border-radius:8px;
  color:var(--text);font:inherit;font-size:12px;padding:7px 11px;cursor:pointer;
}
.rail-credit{display:none;padding:14px 22px 22px;color:var(--dimmer);font-size:10.5px;
  line-height:1.55;border-top:1px solid var(--line)}
@media (max-width:1000px){
  #app{flex-direction:column-reverse}
  #rail{width:100%;height:48vh;border-right:0;border-top:1px solid var(--line)}
  #mapWrap{height:52vh;flex:none}
  #hudToggle{display:block}
  #hudLayers{display:none;top:52px;width:190px}
  #hudLayers.open{display:block}
  #legend,#credit{display:none}
  .rail-credit{display:block}
  #eraStrip button{font-size:9px;padding:6px 1px 5px}
  #eraStrip button b{font-size:11px}
  :root{--rail:100%}
}
</style>
</head>
<body>
