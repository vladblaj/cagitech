const MAP = /*MAPDATA*/;
const W = MAP.w, H = MAP.h, C = MAP.cities, A = MAP.anchors;

/* painting order: broad aggregates first, fine regions last, overlays on top */
const ORDER = ['dacia_bureb','moesia','dacia_romana','transnistria_ww2',
  'hungary','serbia','vojvodina','bulgaria','ua_rest','transcarpathia',
  'dobrogea_s','basarabia','hotin','budjak','bucovina_n',
  'banat','crisana','maramures','ardeal','bucovina_s','moldova','muntenia','oltenia','dobrogea',
  'sud_transilvania','nord_transilvania','basarabia_sud'];
const RIVERS = ['danube','tisza','prut','dniester','mures','olt','bug'];
const RELIEF = ['carp_east','carp_south','carp_west'];

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function shell(mini){
  let s = `<svg class="mp${mini?' mini':''}" viewBox="0 0 ${W} ${H}" role="img" preserveAspectRatio="xMidYMid meet">`;
  s += `<rect class="sea" width="${W}" height="${H}"/>`;
  s += `<rect width="${W}" height="${H}" fill="url(#seaRule)"/>`;
  s += `<use href="#p-land" class="land"/>`;
  s += ORDER.map(r=>`<use href="#p-${r}" class="reg" data-r="${r}"/>`).join('');
  s += ORDER.map(r=>`<use href="#p-${r}" class="reg hx" data-h="${r}"/>`).join('');
  s += `<g class="relief">`
     + RELIEF.map(r=>`<path class="relief-case" d="${MAP.paths[r]}"/>`).join('')
     + RELIEF.map(r=>`<path class="relief" d="${MAP.paths[r]}"/>`).join('') + `</g>`;
  s += `<g class="rivers">`
     + RIVERS.map(r=>`<path class="riv-case ${r}" d="${MAP.paths['riv_'+r]}"/>`).join('')
     + RIVERS.map(r=>`<path class="riv ${r}" d="${MAP.paths['riv_'+r]}"/>`).join('') + `</g>`;
  s += `<g class="ghostL"><use href="#p-romania_mod" class="ghost"/></g>`;
  s += `<g class="marks"></g>`;
  s += `<rect class="neat" x="4" y="4" width="${W-8}" height="${H-8}"/>`;
  s += `<rect class="neat" x="9" y="9" width="${W-18}" height="${H-18}" opacity=".5"/>`;
  s += `</svg>`;
  return s;
}

function arrow(a,b,bow,label){
  const p=A[a],q=A[b]; if(!p||!q) return '';
  const mx=(p[0]+q[0])/2, my=(p[1]+q[1])/2;
  const dx=q[0]-p[0], dy=q[1]-p[1], L=Math.hypot(dx,dy)||1;
  const cx=mx - dy/L*(bow||0), cy=my + dx/L*(bow||0);
  let s = `<path class="mig" d="M${p[0]} ${p[1]} Q${cx} ${cy} ${q[0]} ${q[1]}"/>`;
  if(label){
    const t=0.80, u=1-t;
    const lx=u*u*p[0]+2*u*t*cx+t*t*q[0], ly=u*u*p[1]+2*u*t*cy+t*t*q[1];
    const right = q[0] >= p[0];
    s += `<text class="mig-l" x="${lx+(right?9:-9)}" y="${ly-9}"
      text-anchor="${right?'start':'end'}">${esc(label)}</text>`;
  }
  return s;
}

function paint(svg, era, mini){
  svg.querySelectorAll('.reg[data-r]').forEach(u=>{
    const f = era.fills[u.dataset.r];
    u.setAttribute('class', f ? `reg on ${f}` : 'reg');
  });
  svg.querySelectorAll('.reg[data-h]').forEach(u=>{
    const h = (era.hatch||{})[u.dataset.h];
    u.setAttribute('class', h ? 'reg hx on' : 'reg hx');
    u.style.fill = h ? `url(#hatch${h})` : '';
    u.style.stroke = 'none';
  });
  const g = svg.querySelector('.marks');
  let m = '';
  (era.arrows||[]).forEach(a=> m += arrow(a[0],a[1],a[2], mini?null:a[3]));
  (era.outline||[]).forEach(r=> m += `<use href="#p-${r}" class="sphere"/>`);
  (era.border||[]).forEach(r=> m += `<use href="#p-${r}" class="bord"/>`);
  if(mini){
    (era.marks||[]).forEach(mk=>{ const p=C[mk.k]; if(!p) return;
      m += `<circle cx="${p[0]}" cy="${p[1]}" r="${mk.hi?4.5:3}" class="${mk.hi?'dot-hi':'dot'}"/>`; });
    g.innerHTML = m; return;
  }
  (era.areas||[]).forEach(a=>{
    const p=A[a.k]; if(!p) return;
    m += `<text class="rgn" x="${p[0]}" y="${p[1]}" text-anchor="middle"
      ${a.fill?`style="fill:${a.fill}"`:''}>${esc(a.l)}</text>`;
  });
  (era.foreign||[]).forEach(a=>{
    const p=A[a.k]; if(!p) return;
    m += `<text class="foreign" x="${p[0]}" y="${p[1]}" text-anchor="middle">${esc(a.l)}</text>`;
  });
  (era.marks||[]).forEach(mk=>{
    const p=C[mk.k]; if(!p) return;
    const r = mk.hi?4:3;
    m += `<circle cx="${p[0]}" cy="${p[1]}" r="${r}" class="${mk.hi?'dot-hi':'dot'}"/>`;
    m += `<text x="${p[0]+(mk.a==='e'?-7:7)}" y="${p[1]+(mk.dy||4)}"
      text-anchor="${mk.a==='e'?'end':'start'}">${esc(mk.l||mk.k)}</text>`;
  });
  if(era.sea!==false){ const p=A.SEA;
    m += `<text class="sea-l" x="${p[0]}" y="${p[1]}" text-anchor="middle">Marea Neagră</text>`; }
  g.innerHTML = m;
}

 {d:'1711–1821',h:'The Phanariot century',odd:true,
  b:'Constantinople stopped trusting native princes and began appointing Greeks from the Phanar quarter. The thrones were effectively auctioned, and the buyer had to recoup the price. <b>Average reign: about two and a half years.</b> Some men bought the same throne three or four times; one dynasty supplied rulers to both principalities simultaneously.'},
 {d:'1784',h:'Horea, Cloșca and Crișan',
  b:'A Transylvanian peasant rising put down with deliberate theatre: Horea and Cloșca were <b>broken on the wheel</b> at Alba Iulia in front of an audience of peasants compelled to attend. Crișan strangled himself in his cell first. Serfdom in Transylvania was formally abolished the following year — the connection was not coincidental.'},
 {d:'1791',h:'A petition that lost and won',
  b:'The <i>Supplex Libellus Valachorum</i> asked Vienna to recognise Romanians as a fourth Transylvanian nation, arguing from Roman descent and demographic weight. It was rejected. The argument it made became the spine of Romanian nationalism for the next 130 years — and, eventually, the case presented in Paris in 1919.'}]},

{n:'IX', y:'1821 – 1878', t:'A country is assembled',
 lead:'In fifty-seven years: the end of Phanariot rule, the abolition of slavery, a union achieved by exploiting a loophole in a treaty, an imported prince travelling under a false name, and independence won in the field and then billed for.',

        {k:'Constanța',l:'Dobruja, 1878',hi:true},{k:'Turnu Severin',l:'Turnu Severin — 1866',a:'e'},
        {k:'Ismail',l:'S. Bessarabia, back to Russia 1878'}],

 ev:[
 {d:'1821',h:'Tudor Vladimirescu',b:'A rising in Oltenia that ended the Phanariot system. Native princes returned in 1822 for the first time in 111 years.'},
 {d:'Dec 1855 · Feb 1856',h:'The abolition of slavery',odd:true,
  b:'Roma had been held as <b>hereditary chattel slaves</b> in Moldavia and Wallachia since the fourteenth century — princely, monastic and boyar slaves, bought, sold, mortgaged and inherited. Moldavia abolished it in December 1855, Wallachia in February 1856. Roughly <b>five hundred years of slavery, ended three years before the country was founded</b> — and left almost entirely out of the national story until the last two decades.'},
 {d:'Jan 1859',h:'The loophole',odd:true,
  b:'The 1858 Paris Convention said Moldavia and Wallachia would each elect their own prince. It did not say the two princes had to be <b>different people</b>. Both assemblies elected Alexandru Ioan Cuza — Moldavia on 5/17 January, Wallachia on 24 January. The powers, presented with a fait accompli, accepted it.'},
 {d:'1866',h:'The prince who arrived under a false name',odd:true,
  b:'Karl of Hohenzollern-Sigmaringen travelled to his new throne on a <b>Swiss passport in the name of "Karl Hettingen"</b>, by rail across an Austria then at war with Prussia, then by Danube steamer from Baziaș to Turnu Severin because no railway reached the country. He reigned 48 years, the longest in Romanian history.'},
 {d:'1877–78',h:'Independence, and the bill',
  b:'Romania fought alongside Russia at Plevna and declared independence. At the Congress of Berlin the ally took back <b>southern Bessarabia</b> and compensated Romania with <b>Dobruja</b> — a province it had not asked for, containing few Romanians, which happened to come with a Black Sea coast. On this map that is the single ochre patch.'}]},

        {k:'Iași',l:'Iași — capital 1916–18',hi:true},{k:'Silistra',l:'Cadrilater, 1913'}],

 {d:'1907',h:'The revolt the state erased',odd:true,
  b:'A peasant rising put down by the army with artillery. Estimates of the dead run from a few hundred to <b>11,000 and beyond</b> — Austrian diplomats said 3,000–5,000, the French embassy said 10,000–20,000, the official figure was 419. We will never know, because <b>the government ordered the documents destroyed</b>.'},
 {d:'1913',h:'The Cadrilater',b:'Romania entered the Second Balkan War late, marched on Sofia, and took Southern Dobruja from Bulgaria without a significant battle. It is the one 1940 loss the country never subsequently contested.'},
 {d:'3–6 Dec 1916',h:'"Empire Jack" burns the oil',odd:true,
  b:'With the front collapsing, British Lt-Col John Norton-Griffiths — a Member of Parliament and tunnelling engineer — spent four days wrecking Ploiești: refinery machinery smashed with sledgehammers, drill stems dropped down the wells, and roughly <b>800,000 tonnes of crude pumped into pits and set alight</b>. Output in 1917 was under a third of peacetime. Ludendorff later blamed him, by name, for German shortages.'},
 {d:'16 Dec 1916',h:'Seventeen wagons to Moscow',odd:true,
  b:'The government sent the national reserve to its Russian ally for safekeeping: <b>91.5 tonnes of fine gold in 1,738 lead-sealed crates</b>. A second shipment in 1917 carried the Academy\'s archives, the crown jewels and the Pietroasele hoard. Lenin\'s government repudiated the deposit in January 1918. Some artefacts came back in 1935 and 1956. <b>Not one gram of the gold has ever been returned</b> — it remains an open bilateral question a century later.'},
 {d:'1918',h:'Nine months, three unions',
  b:'Bessarabia votes to join on <b>27 March</b>; Bukovina on <b>28 November</b>; Transylvania at Alba Iulia on <b>1 December</b>, before a crowd of some 100,000. The country roughly doubles in territory and population.'},
 {d:'1919–20',h:'The queen who lobbied Paris',odd:true,
  b:'Queen Marie — a granddaughter of Queen Victoria and of Alexander II — went to the peace conference <b>in person</b> and worked Clemenceau, Wilson and the press directly, at a time when monarchs did not do this. Contemporaries credited her personally with a meaningful share of the resulting map.'}]},

{n:'XI', y:'1920 – 1940', t:'Twenty years, then four months',
 lead:'The interwar state at its widest — and then, between June and September 1940, the loss of about a third of its territory and population without a battle being fought for any of it.',
 fills:Object.assign(fillAll(ALL_RO,'f-core'),
   {basarabia:'f-loss',hotin:'f-loss',budjak:'f-loss',bucovina_n:'f-loss',

        {k:'Silistra',l:'to Bulgaria — 7 Sept',hi:true},{k:'București',l:'București'},
        {k:'Brașov',l:'Brașov — stayed'}],
 areas:[{k:'VALAHIA',l:'România'}],
 foreign:[{k:'UNGARIA',l:'Hungary'},{k:'IMP_RUS',l:'USSR'},{k:'BULGARIA',l:'Bulgaria'}],

 {d:'1920–38',h:'Little Paris, and its shadow',
  b:'Bucharest built an Arch of Triumph and an Athenaeum; Enescu, Brâncuși, Eliade and Ionesco all belong to this window. So does the <b>Legion of the Archangel Michael</b> — a fascist movement organised as a mystical death cult, with its own liturgy, oaths sworn over soil, and a genuine enthusiasm for martyrdom that puzzled even other European fascists.'},
 {d:'26–28 June 1940',h:'Forty-eight hours to leave',
  b:'A Soviet ultimatum demanded Bessarabia and Northern Bukovina. Romania was given two days to decide and four to withdraw from roughly <b>50,000 km²</b>. The Hertsa district, not named in the ultimatum, was taken as well.'},
 {d:'30 Aug 1940',h:'The foreign minister faints',odd:true,
  b:'At the Belvedere Palace in Vienna, Ribbentrop and Ciano handed <b>43,104 km²</b> of Northern Transylvania to Hungary. When the map was unrolled and Romanian Foreign Minister <b>Mihail Manoilescu saw the line, he collapsed across the table</b> and had to be revived with camphor. The line on this plate is that map: Oradea, Cluj, Târgu Mureș and the Székely Land go; Arad, Turda, Alba Iulia, Sighișoara, Sibiu and Brașov stay.'},
 {d:'7 Sept · 10 Nov 1940',h:'And then the ground moved',
  b:'The Treaty of Craiova returned Southern Dobruja to Bulgaria with a population exchange. Two months later a <b>magnitude 7.7 earthquake</b> brought down Bucharest\'s tallest building and killed around a thousand people. The kingdom lost a third of itself, and its king, in a single season.'}]},

{n:'XII', y:'1941 – 1947', t:'On both sides',
 lead:'Romania fielded the largest Axis army after Germany\'s, administered occupied Soviet territory, participated in the Holocaust, then changed sides overnight in August 1944 and finished the war with the fourth-largest Allied army in Europe.',

 {d:'1941–44',h:'The governorate between two rivers',odd:true,
  b:'Romania administered roughly <b>40,000 km² between the Dniester and the Southern Bug</b>, including Odesa — the only occupied Soviet territory ever governed by a German ally as a civil administration rather than by the Wehrmacht or the SS. It issued its own currency and postage.'},
 {d:'2004 finding',h:'The Holocaust in Romania',
  b:'The international commission chaired by <b>Elie Wiesel</b> concluded that <b>280,000 to 380,000 Jews</b> were murdered or died under the authority of the Romanian state, along with some 11,000 Roma. The <b>Iași pogrom</b> of June 1941 killed around 15,000, thousands of them sealed into freight wagons and shunted back and forth until they suffocated — the "death trains." Romania officially denied all of this until the report was accepted in 2004.'},
 {d:'1 Aug 1943',h:'Black Sunday over Ploiești',
  b:'Operation Tidal Wave sent 178 B-24s from Libya to bomb the refineries from rooftop height. <b>53 aircraft and 660 airmen were lost</b> — the costliest American air mission of the war. Five Medals of Honor were awarded, three of them posthumously. Production recovered within weeks.'},
 {d:'23 Aug 1944',h:'A 22-year-old arrests a marshal',odd:true,
  b:'King Michael summoned Marshal Antonescu to the palace, had him <b>arrested and locked in a safe built for the royal stamp collection</b>, and announced an armistice that night. The entire southern front folded; the coup is commonly estimated to have <b>shortened the war by up to six months</b>. Stalin gave him the Order of Victory. In 1947 Romania\'s communists forced him to abdicate at gunpoint.'},
 {d:'10 Feb 1947',h:'The line that stayed',
  b:'The Paris peace treaties returned Northern Transylvania. Bessarabia, Northern Bukovina and Southern Dobruja were not returned. <b>The border agreed in 1947 is the border today</b> — the longest period of frontier stability in the country\'s recorded history.'}]},

{n:'XIII', y:'1947 – 1989', t:'The closed country',
 lead:'The borders stop moving and everything else is done to the inside: a prison experiment designed to turn victims into torturers, a canal dug to consume a class, half the villages marked for demolition, and a foreign debt repaid by exporting the food.',
 fills:fillAll(ALL_RO,'f-core'),
 hatch:{},
 marks:[{k:'Pitești',l:'Pitești — 1949–51',hi:true,a:'e'},{k:'Poarta Albă',l:'the Canal',hi:true},
        {k:'Sighet',l:'Sighet prison',hi:true,a:'e'},{k:'București',l:'Casa Poporului',hi:true},
        {k:'Timișoara',l:'Timișoara — 16 Dec 1989',hi:true,a:'e'},{k:'Târgoviște',l:'Târgoviște — 25 Dec 1989',hi:true}],
 areas:[{k:'CENTRU',l:'R.S. România'}],
 ev:[
 {d:'1949–51',h:'Pitești: making victims into perpetrators',odd:true,
  b:'In one prison the Securitate ran a "re-education" scheme through a prisoner, Eugen Țurcanu, in which inmates were forced to <b>torture each other</b> — and then to denounce, and then to become torturers themselves, which was the actual objective. Mock baptisms in sewage, forced blasphemy, beatings by yesterday\'s victims. Around 600 people went through it. It is widely regarded as the most extreme programme of its kind anywhere in the Eastern Bloc.'},
 {d:'1949–53',h:'Canalul Morții',
  b:'The Danube–Black Sea Canal was dug by political prisoners with hand tools. Detainee numbers rose from ~5,000 to ~20,000; the death toll is unknown and commonly given as tens of thousands. Historians generally read the project as <b>less an engineering scheme than a method of consuming the interwar elite</b>. It was abandoned when Stalin died, restarted in 1976, and finished in 1984.'},
 {d:'18 June 1951',h:'The Bărăgan deportations',
  b:'In a single night, around <b>44,000 people</b> were removed from a 25 km strip along the Yugoslav border and dumped on the empty Bărăgan plain with stakes marking their plots. They built their own villages out of mud and reeds. Several of those villages still exist.'},
 {d:'1968',h:'The speech that bought fifteen years',odd:true,
  b:'Ceaușescu publicly condemned the Warsaw Pact invasion of Czechoslovakia from a balcony in Bucharest. The West was delighted; <b>Nixon visited in 1969</b>, the first US president ever to visit a communist country, and Romania got most-favoured-nation status and loans. That credit is what he later spent, and then repaid.'},
 {d:'1982–89',h:'Repaying $10.5bn by exporting the food',
  b:'Having borrowed heavily in the 1970s, Ceaușescu decided to repay every dollar ahead of schedule. Meat, grain and fuel were exported; at home there was rationing, unheated flats, two hours of television a day. <b>The debt was declared cleared in April 1989.</b> He was dead by Christmas.'},
 {d:'1974–89',h:'Systematization',
  b:'Roughly <b>half of Romania\'s 13,000 villages</b> were slated for demolition and replacement with agro-industrial blocks. In Bucharest about a fifth of the historic centre — churches included, some of them physically moved on rails to hide them behind blocks — came down for the <b>House of the People</b>, still among the largest and heaviest administrative buildings on earth.'},
 {d:'16–25 Dec 1989',h:'The only violent one',odd:true,
  b:'It began in Timișoara over the eviction of a Hungarian pastor and ended with the Ceaușescus shot on Christmas Day after a <b>55-minute trial</b>. Around 1,104 people died — and <b>the great majority died after the regime had already fallen</b>, shot in confused firefights attributed to "terrorists" who were never identified, tried, or convincingly explained. It was the only revolution of 1989 that was violent, and the only one that executed its leader.'}]},

 lead:'Thirty-six years without a territorial change — which, on the evidence of the previous thirteen plates, is the genuinely unusual condition.',

 {d:'2004 · 2007 · 2025',h:'NATO, the EU, Schengen',
  b:'NATO in March 2004, the European Union in January 2007, and full Schengen membership completed on <b>1 January 2025</b> — air and sea borders had opened in March 2024, land borders followed.'},
 {d:'1995–2024',h:'The mountain that was not mined',odd:true,
  b:'A plan to reopen Roșia Montană as Europe\'s largest open-cast cyanide gold mine would have removed four peaks and relocated a village on top of the Roman galleries. It produced the <b>largest sustained street protests since 1989</b>, was rejected by parliament in 2013, and triggered a $4.4bn arbitration claim that Romania won in 2024. UNESCO listed the site in 2021.'},
 {d:'1947–2026',h:'Seventy-nine years',
  b:'Read the fourteen plates in sequence and the pattern is not decline or rise but <b>oscillation</b> — assembled in 1859–1918, cut apart in 1940, half-restored in 1947. The current frontier has now held longer than any other arrangement on this map. That is the anomaly worth noticing.'}]}
