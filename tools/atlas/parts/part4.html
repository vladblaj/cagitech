
<script>
/* ------------------------------------------------------------- hero plate */
const HERO = {
  fills:{banat:'f-core',crisana:'f-core',maramures:'f-core',ardeal:'f-core',
         moldova:'f-core2',bucovina_s:'f-core2',muntenia:'f-core3',oltenia:'f-core3',
         dobrogea:'f-gold'},
  greater:{basarabia:'f-loss',hotin:'f-loss',budjak:'f-loss',bucovina_n:'f-loss',dobrogea_s:'f-loss'},
  border:['romania_mod'],
  areas:[{k:'TRANSILVANIA',l:'Transilvania'},{k:'BANAT',l:'Banat'},{k:'CRIȘANA',l:'Crișana'},
         {k:'MARAMUREȘ',l:'Maramureș'},{k:'MOLDOVA',l:'Moldova'},{k:'BUCOVINA',l:'Bucovina'},
         {k:'MUNTENIA',l:'Muntenia'},{k:'OLTENIA',l:'Oltenia'},{k:'DOBROGEA',l:'Dobrogea'}],
  foreign:[{k:'UNGARIA',l:'Ungaria'},{k:'SERBIA',l:'Serbia'},{k:'BULGARIA',l:'Bulgaria'},
           {k:'UCRAINA',l:'Ucraina'},{k:'BASARABIA',l:'Moldova / Ucraina'}],
  marks:[{k:'București',l:'București',hi:true},{k:'Cluj',l:'Cluj-Napoca',a:'e'},
         {k:'Timișoara',l:'Timișoara',a:'e'},{k:'Iași',l:'Iași'},{k:'Constanța',l:'Constanța'},
         {k:'Brașov',l:'Brașov'},{k:'Craiova',l:'Craiova',a:'e'},{k:'Galați',l:'Galați'},
         {k:'Sibiu',l:'Sibiu',a:'e'},{k:'Oradea',l:'Oradea',a:'e'},{k:'Suceava',l:'Suceava'},
         {k:'Alba Iulia',l:'Alba Iulia',a:'e'},{k:'Tulcea',l:'Tulcea'}]
};

const heroBox = document.getElementById('heroMap');
heroBox.innerHTML = shell(false);
const heroSvg = heroBox.querySelector('svg');
heroSvg.setAttribute('aria-label','Map of Romania showing its nine historical regions, the Carpathian arc, major rivers and cities');
const heroState = {regions:true, relief:true, rivers:true, cities:true, greater:false};

function drawHero(){
  const era = {
    fills: heroState.regions
      ? Object.assign({}, HERO.fills, heroState.greater?HERO.greater:{})
      : (heroState.greater?Object.assign({},HERO.greater):{}),
    border: HERO.border,
    areas: heroState.regions?HERO.areas:[],
    foreign: HERO.foreign,
    marks: heroState.cities?HERO.marks:[]
  };
  if(!heroState.regions && !heroState.greater) era.fills = {};
  paint(heroSvg, era, false);
  heroSvg.querySelector('.relief').style.display = heroState.relief?'':'none';
  heroSvg.querySelector('.rivers').style.display = heroState.rivers?'':'none';
  heroSvg.querySelector('.ghostL').style.display = 'none';
}
drawHero();

document.getElementById('heroControls').addEventListener('click', e=>{
  const b = e.target.closest('.tg'); if(!b) return;
  const k = b.dataset.layer;
  heroState[k] = !heroState[k];
  b.setAttribute('aria-pressed', String(heroState[k]));
  drawHero();
});

/* ------------------------------------------------------------ era sections */
const erasEl = document.getElementById('eras');
const scrubEl = document.getElementById('scrub');

ERAS.forEach((era, i)=>{
  const id = 'era-'+i;
  const sec = document.createElement('section');
  sec.className = 'era'; sec.id = id;
  sec.innerHTML = `
    <div class="wrap"><div class="era-grid">
      <div class="era-map"><figure class="plate" style="margin:0">
        <div class="mapslot"></div>
        <figcaption class="plate-cap">
          <span class="lab">${esc(era.y)}</span><span class="n">PLATE ${esc(era.n)}</span>
        </figcaption>
      </figure></div>
      <div class="era-body">
        <div class="era-head">
          <span class="lab">Plate ${esc(era.n)} &middot; ${esc(era.y)}</span>
          <h3>${esc(era.t)}</h3>
        </div>
        <p class="era-lead">${era.lead}</p>
        <div class="events">${era.ev.map(e=>`
          <div class="ev${e.odd?' odd':''}">
            <div class="ev-d">${esc(e.d)}</div>
            <div><h4>${esc(e.h)}</h4><p>${e.b}</p></div>
          </div>`).join('')}</div>
      </div>
    </div></div>`;
  erasEl.appendChild(sec);

  const slot = sec.querySelector('.mapslot');
  slot.innerHTML = shell(false);
  const svg = slot.querySelector('svg');
  svg.setAttribute('aria-label', `Map plate ${era.n}: ${era.t}, ${era.y}`);
  paint(svg, era, false);

  const b = document.createElement('button');
  b.type='button'; b.setAttribute('role','tab'); b.setAttribute('aria-selected', i===0?'true':'false');
  b.dataset.i = i;
  b.innerHTML = `<span>${esc(era.n)}</span>${esc(era.y)}`;
  b.addEventListener('click', ()=> document.getElementById(id).scrollIntoView({behavior:'smooth', block:'start'}));
  scrubEl.appendChild(b);
});

/* highlight the plate currently being read */
const tabs = [...scrubEl.querySelectorAll('button')];
const io = new IntersectionObserver(entries=>{
  entries.forEach(en=>{
    if(!en.isIntersecting) return;
    const i = [...erasEl.children].indexOf(en.target);
    if(i<0) return;
    tabs.forEach((t,j)=> t.setAttribute('aria-selected', String(j===i)));
    const t = tabs[i];
    const l = t.offsetLeft - scrubEl.clientWidth/2 + t.clientWidth/2;
    scrubEl.scrollTo({left:l, behavior:'smooth'});
  });
}, {rootMargin:'-45% 0px -50% 0px', threshold:0});
[...erasEl.children].forEach(s=> io.observe(s));

/* ---------------------------------------------------------- small multiples */
const grid = document.getElementById('gridMaps');
ERAS.forEach((era,i)=>{
  const b = document.createElement('button');
  b.type='button'; b.className='gm';
  b.innerHTML = shell(true) + `<div class="gm-cap">
      <span class="n">PLATE ${esc(era.n)}</span>
      <span class="y">${esc(era.y)}</span>
      <span class="t">${esc(era.t)}</span></div>`;
  const svg = b.querySelector('svg');
  svg.setAttribute('aria-label', `Plate ${era.n}: ${era.t}`);
  paint(svg, era, true);
  b.addEventListener('click', ()=> document.getElementById('era-'+i).scrollIntoView({behavior:'smooth',block:'start'}));
  grid.appendChild(b);
});

 ['Viorel Achim, “Gypsy Slavery in Wallachia and Moldavia”','https://www.academia.edu/1132654/Gypsy_Slavery_in_Wallachia_and_Moldavia'],

 ['Foreign debt of the Socialist Republic of Romania, and the 1980s austerity policy','https://en.wikipedia.org/wiki/1980s_austerity_policy_in_Romania'],

  s=>`<li><a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a></li>`).join('');
</script>
