<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Private Vault</title>
<style>
  :root{--bg:#0a0c13;--panel:#12162a;--line:#242c4a;--text:#e8eaf2;--dim:#98a0bd;--gold:#f0c04a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--text);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  main{max-width:520px;width:100%;padding:32px}
  h1{font-size:20px;margin:0 0 6px;color:var(--gold)}
  p{margin:0 0 24px;color:var(--dim);font-size:14px}
  a.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;margin-bottom:12px;color:var(--text);text-decoration:none;transition:border-color .15s}
  a.card:hover{border-color:var(--gold)}
  a.card small{display:block;color:var(--dim);margin-top:4px}
</style>
</head>
<body>
<main>
  <h1>Private Vault</h1>
  <p>Unlisted pages — do not share this URL.</p>
  <a class="card" href="roman-universe.html">The Roman Universe<small>Gods, demigods &amp; their connections</small></a>
