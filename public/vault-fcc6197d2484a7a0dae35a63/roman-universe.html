,"tier":"collective","rank":6,"gender":"f","origin":"italic","domains":["fate","the thread of a life","birth"],"summary":"The Fates — but the original Roman figure was a single birth-goddess, and the famous triad is thinner evidence than most people assume.","deeds":["Spin, measure and cut the thread of every life; their decrees bind even Jupiter, who in the Aeneid can delay fate but not change it.","Sing at the wedding of Peleus and Thetis in Catullus 64, working the wool as they prophesy the birth and the slaughters of Achilles — the most powerful Latin treatment of them."],"state":"An attestation warning worth having. The original Roman figure is a singular Parca, a goddess of childbirth, whose name Varro derived from partus. Varro gave a pair — Nona and Decuma, the ninth and tenth months of pregnancy. A third, Morta, was added by Caesellius Vindex citing Livius Andronicus, and Gellius flatly rejects it, saying Morta is just the Greek Moira misread. Latin poets normally use the Greek names or simply call them the Fata.","temple":"No temple; invoked at births and at the Ludi Saeculares","festival":"Invoked at the Secular Games","priest":"None","symbols":["distaff","spindle","measuring rod","shears","the thread"],"epithets":["Fata","Tria Fata","Parca Maurtia"],"sources":["Gellius, Attic Nights 3.16.9-11","Catullus 64.303-383","Varro in Gellius"],"groups":["fate"]},{"id":"furiae","name":"The Furiae / Dirae","latin":"Furiae, Dirae — Allecto, Megaera, Tisiphone","greek":"the Erinyes, Eumenides","tier":"collective","rank":6,"gender":"f","origin":"italic","domains":["vengeance for kin-murder","broken oaths","madness"],"summary":"Snake-haired avengers of blood-guilt — and, in Virgil, the personal enforcers who sit beside Jupiter's throne.","deeds":["Allecto, summoned by Juno out of hell, plants a snake from her hair in Queen Amata's breast and drives her mad; then goads Turnus in his sleep; then makes Ascanius' hounds start the sacred stag. Three visits, and the war is unstoppable.","Tisiphone in a blood-soaked cloak keeps the gate of Tartarus, sleepless day and night, scourging the guilty.","At the climax of the Aeneid Jupiter sends one of the twin Dirae — sisters of Megaera, born of Night in the same birth — and she turns into a small screech-owl and beats her wings in Turnus' face until his strength drains away."],"state":"The group names Furiae and Dirae are genuine Latin; the three individual names are Greek transliterations. Virgil's innovation is political: he makes the Dirae attendants at Jupiter's own throne, instruments of sovereign power rather than free avengers — terror as an arm of the state.","temple":"No temple; propitiated at crossroads and graves","festival":"None","priest":"None","symbols":["snakes for hair","torches","whips","bat wings"],"epithets":["Eumenides","Semnai"],"sources":["Virgil, Aeneid 7.323-405, 6.555-572, 12.843-886","Ovid, Metamorphoses 4.451-511"],"groups":["underworld"]},{"id":"lares","name":"The Lares","latin":"Lares","greek":"none — uniquely Roman","tier":"collective","rank":6,"gender":"m","origin":"italic","domains":["protection of a place","the household","crossroads","travel","the sea"],"summary":"The guardians of a place rather than a person — every Roman house had a cupboard shrine with two dancing boys in it, and every crossroads had a shrine of its own.","deeds":["Ovid makes them the twin sons of Mercury and the nymph Lara, whose tongue Jupiter tore out for talking, and who was then raped by Mercury on the way down to the underworld — a grim origin for the friendliest gods in the house.","Lares Familiares guarded the household; Lares Compitales the crossroads; Lares Praestites the whole city; Lares Permarini those at sea; Lares Viales the roads.","Offerings were made at every meal, at every departure and return, and at every rite of passage in a Roman life."],"state":"Purely Italic, with no Greek equivalent, and the most universally practised religion in Rome — a slave, who could own nothing and had no ancestors, still had a share in the household Lares. Augustus reorganised the crossroads cult in 7 BC into Lares Augusti paired with his own Genius, and put freedmen and slaves in charge of the shrines as vicomagistri: one of the shrewdest religious reforms in Roman history, since it gave the least powerful people in the city a public office and a reason to be grateful.","temple":"The lararium in every house; some 265 crossroads shrines in Augustan Rome","festival":"Compitalia (movable, early January); daily offerings; 1 May (Lares Praestites)","priest":"The paterfamilias; vicomagistri at the crossroads","symbols":["two dancing youths with rhyta","the dog","the wreathed cupboard","the serpent"],"epithets":["Familiares","Compitales","Praestites","Permarini","Viales","Augusti"],"sources":["Ovid, Fasti 2.599-616, 5.129-146","Plautus, Aulularia prologue","Cato, De Agricultura 143"],"groups":["household"]},{"id":"penates","name":"The Penates","latin":"Di Penates","greek":"none — uniquely Roman","tier":"collective","rank":6,"gender":"n","origin":"italic","domains":["the store-cupboard","the household's provision","the state's continuity"],"summary":"The gods of the larder — and, in their public form, the physical objects Aeneas carried out of Troy, on which Rome's existence was held to depend.","deeds":["Appear to Aeneas in Crete, speaking for Apollo, to correct his course: not Crete but Hesperia, the ancient land you call Italy (Aeneid 3.147-171). They are the only gods in the poem who give directions in the first person.","Carried by Aeneas from Troy alongside the Palladium and the sacred fire, deposited at Lavinium, and honoured there by Roman magistrates every year forever after.","In the household, honoured at the hearth with a portion of every meal, alongside the Lares and the Genius."],"state":"The Penates Publici made Rome's claim of Trojan descent physical: consuls and praetors went out to Lavinium on entering and leaving office to sacrifice to them. If the Lares were about place, the Penates were about supply — the difference between where you live and whether you eat.","temple":"Temple of the Penates on the Velia; the sanctuary at Lavinium; every household hearth","festival":"Honoured with Vesta at the Vestalia; annual magistrates' sacrifice at Lavinium","priest":"The paterfamilias; the consuls and praetors at Lavinium","symbols":["the storeroom","paired seated youths","the hearth"],"epithets":["Di Penates Publici Populi Romani Quiritium"],"sources":["Virgil, Aeneid 2.717, 3.147-171","Varro, De Lingua Latina 5.144","Dionysius of Halicarnassus 1.67"],"groups":["household"]},{"id":"manes","name":"The Manes","latin":"Di Manes","greek":"loosely the shades","tier":"collective","rank":5,"gender":"n","origin":"italic","domains":["the divinised dead","ancestors"],"summary":"The dead as a collective divinity — always plural, even for one person, because the individual dissolves into the ancestors.","deeds":["Honoured at the Parentalia, 13-21 February, when families ate at the tomb and left food; the last day, the Feralia, was public, and Ovid says that the one year Rome neglected it, the dead came out and howled through the streets.","Invoked in the devotio, the rite by which a general — Decius Mus at Sentinum — formally handed himself and the enemy army together to the gods below, then rode into the enemy line to die."],"state":"D M — Dis Manibus, 'to the spirits of the dead' — heads tens of thousands of surviving Roman tombstones, more common than any other religious formula in the Latin world. Note the grammar: even a single dead person gets a plural god.","temple":"Every tomb; the mundus pit in the Forum","festival":"Parentalia, 13-21 February; Feralia, 21 February; the mundus opened 24 Aug, 5 Oct, 8 Nov","priest":"The family; pontiffs at the mundus","symbols":["D M on the tombstone","violets and beans","the funeral meal"],"epithets":["Di Manes","Di Parentes"],"sources":["Ovid, Fasti 2.533-616","Livy 8.9.6","CIL passim"],"groups":["underworld","household"]},{"id":"lemures","name":"The Lemures / Larvae","latin":"Lemures, Larvae","greek":"none","tier":"collective","rank":4,"gender":"n","origin":"italic","domains":["restless and malevolent dead"],"summary":"The dead who did not settle — expelled from the house once a year by the father of the family walking barefoot in the dark, spitting black beans over his shoulder.","deeds":["At the Lemuria the paterfamilias rose at midnight, made a sign with his thumb between his fingers, washed his hands, and threw black beans behind him nine times without looking, saying: with these I redeem me and mine. Then he clashed bronze and said nine times: ghosts of my fathers, go out.","Ovid derives the festival from Remus, whose angry ghost appeared to Faustulus and Acca demanding rites — the Remuria becoming the Lemuria."],"state":"May was an unlucky month to marry because the Lemuria fell in it. The contrast with the Manes is sharp: the honoured dead get a family meal at the tomb in February, the unquiet dead get beans thrown at them in the dark in May.","temple":"Every house","festival":"Lemuria, 9, 11 and 13 May","priest":"The paterfamilias","symbols":["black beans","bronze clashed","bare feet"],"epithets":["Larvae"],"sources":["Ovid, Fasti 5.419-492","Horace, Epistles 2.2.209","Apuleius, De Deo Socratis 15"],"groups":["underworld","household"]},{"id":"camenae","name":"The Camenae","latin":"Camenae","greek":"identified with the Musae","tier":"collective","rank":5,"gender":"f","origin":"italic","domains":["springs","prophecy","childbirth","song"],"summary":"Italic water-nymphs of a grove outside the gate — and the word Rome chose when it needed a Latin name for the Muses, which is where Latin literature begins.","deeds":["Their grove and spring outside the Porta Capena is where Egeria met Numa and where the Vestals drew water for the temple.","Livius Andronicus, translating the opening of the Odyssey into Latin around 240 BC, rendered Mousa as Camena — the single act that founded Latin poetry, and did it by finding a native equivalent rather than borrowing the Greek word.","Named members include Carmenta and Egeria, and less certainly Antevorta and Postvorta."],"state":"Horace calls the Muses novem Camenae in the Carmen Saeculare, a hymn sung by state-appointed choirs of children — Greek poetry, Italic name, Roman occasion, all at once.","temple":"The grove and spring of the Camenae outside the Porta Capena","festival":"13 August (with Diana); water drawn daily by the Vestals","priest":"Vestals","symbols":["spring water","the grove","song"],"epithets":["novem Camenae"],"sources":["Livius Andronicus, Odusia fr. 1","Livy 1.21","Horace, Carmen Saeculare","Juvenal 3.10-20"],"groups":["camenae","nymphs"]},{"id":"musae","name":"The Muses","latin":"Musae","greek":"Mousai","tier":"collective","rank":5,"gender":"f","origin":"greek","domains":["epic","history","music","tragedy","dance","love poetry","hymns","astronomy","comedy"],"summary":"The nine daughters of Jupiter and Memory, invoked at the opening of every Latin epic — Rome kept their Greek names but built them a temple with Hercules.","deeds":["Clio (history), Euterpe (flutes), Thalia (comedy), Melpomene (tragedy), Terpsichore (dance), Erato (love poetry), Polyhymnia (hymns), Urania (astronomy), Calliope (epic).","Virgil asks Erato and then Calliope for help at the two turning points of the Aeneid; Ovid asks nobody and starts anyway.","Beat the nine daughters of Pierus in a singing contest and turned them into magpies — still talking, no longer heard."],"state":"The cult of Hercules Musarum at Rome, founded by Fulvius Nobilior with statues brought from Ambracia in 187 BC, put the Muses under the protection of a strongman god — a very Roman arrangement, and the shrine where the poets' guild met.","temple":"Aedes Herculis Musarum in the Circus Flaminius, 187 BC","festival":"13 August","priest":"The collegium poetarum met at the temple","symbols":["scroll","lyre","mask","globe","laurel"],"epithets":["Pierides","Heliconiades"],"sources":["Virgil, Aeneid 1.8, 7.37, 9.525","Ovid, Metamorphoses 5.294-678","Cicero, Pro Archia"],"groups":[]},{"id":"gratiae","name":"The Graces","latin":"Gratiae","greek":"Charites","tier":"collective","rank":4,"gender":"f","origin":"greek","domains":["charm","gratitude","the giving and returning of favours"],"summary":"Three linked figures who, to a Roman moralist, illustrate the whole social economy: one gives, one receives, one returns.","deeds":["Aglaia, Euphrosyne and Thalia; attendants of Venus, and in Horace's odes they dance naked with the Nymphs when spring comes.","Seneca's De Beneficiis opens by reading them as an allegory of beneficium: they dance in a ring, hands linked, because a favour given must come back round."],"state":"Gratiae is genuine Latin, and the word behind gratia — favour, influence, thanks. Roman society ran on reciprocal obligation, and Seneca's reading of these three dancers is the closest thing Rome has to a theory of it.","temple":"No independent cult; honoured with Venus","festival":"None","priest":"None","symbols":["three linked figures dancing","roses","myrtle"],"epithets":[],"sources":["Horace, Odes 1.4, 3.19","Seneca, De Beneficiis 1.3"],"groups":[]},{"id":"venti","name":"The Winds","latin":"Venti — Aquilo, Auster, Favonius, Volturnus","greek":"the Anemoi","tier":"collective","rank":4,"gender":"m","origin":"italic","domains":["the four winds","storms","the sailing season"],"summary":"Four Latin names still used by Italian farmers — and, in Virgil, prisoners kept behind a mountain by a king with a sceptre.","deeds":["Aquilo, the harsh north; Auster, the wet and sickly south; Favonius, the west wind that favet, favours, and brings the spring; Volturnus, the scorching east.","Juno bribes Aeolus, their jailer, with the nymph Deiopea, and he strikes the mountainside with his spear; the winds burst out and wreck the Trojan fleet in the first three hundred lines of the Aeneid.","Neptune's rebuke to them is the poem's first assertion of legitimate authority: who gave you this licence? Not to your king, still less to me, belongs the sea."],"state":"Note a genuine confusion in the sources: Volturnus is also the name of a Campanian river god with his own flamen Volturnalis and festival on 27 August, and Roman writers slide between the two. Virgil, meanwhile, often keeps the Greek names Eurus and Notus even while using the Latin ones.","temple":"Altars at ports; the Tower of the Winds tradition","festival":"Volturnalia, 27 August","priest":"flamen Volturnalis","symbols":["puffed cheeks","wings","the conch","Aeolus' spear"],"epithets":[],"sources":["Virgil, Aeneid 1.50-156","Ovid, Metamorphoses 1.56-66","Seneca, Naturales Quaestiones 5"],"groups":[]},{"id":"nymphae","name":"The Nymphs","latin":"Nymphae, Lymphae","greek":"Nymphai","tier":"collective","rank":4,"gender":"f","origin":"italic","domains":["springs","rivers","woods","mountains","meadows"],"summary":"The divine population of the landscape — Naiads, Dryads, Oreads — and in their native Latin form the Lymphae, water-spirits with real cult.","deeds":["Every spring, grove and hill had one. Juturna, Egeria, Carmenta and Canens are the Roman instances, each attached to a specific place you could walk to.","Cybele turns Aeneas' burning ships into sea-nymphs so that Turnus cannot destroy them — Ovid's strangest rescue.","Varro lists Lympha among the twelve agricultural gods a farmer must propitiate, alongside Jupiter and Tellus."],"state":"The Latin Lymphae are the genuine article: Roman farmers sacrificed to the water of their own land. To go mad from seeing a nymph was lymphatus — the origin of the word 'lymphatic'.","temple":"Springs, groves and grottoes; the Lacus Juturnae in the Forum","festival":"Fontinalia, 13 October (wells garlanded, springs crowned with flowers)","priest":"None","symbols":["urn","shell","spring","garlands"],"epithets":["Naiades","Dryades","Oreades","Lymphae"],"sources":["Varro, Res Rusticae 1.1.4-6","Ovid, Metamorphoses 14.556-565","Horace, Odes 3.13"],"groups":["nymphs"]},{"id":"indigetes","name":"Di Indigetes & Di Novensiles","latin":"Di Indigetes, Di Novensiles","greek":"none","tier":"collective","rank":3,"gender":"n","origin":"italic","domains":["two ancient and disputed classes of god"],"summary":"Two collective names invoked side by side in Rome's most solemn formula — and nobody, ancient or modern, is sure what either means.","deeds":["Both are named together in the devotio of Decius Mus, the formula by which a general offered himself and the enemy army to the gods below (Livy 8.9.6).","Aeneas becomes Iuppiter Indiges after his death, which suggests indiges means something like a god embedded in a specific patch of Roman soil."],"state":"An honest correction. The textbook gloss — Indigetes are the ancient native gods, Novensiles the newly imported ones — is a nineteenth-century construction by Wissowa, and no ancient text actually poses them as a pair of opposites. Ancient writers disagreed among themselves: Piso said the Novensiles were nine gods from Sabine Trebia (from novem, nine, not novus, new); Varro called them Sabine; Servius said they were old gods promoted for their virtue; others linked them to Etruscan thunder-gods or the Muses. Treat the neat opposition with suspicion.","temple":"None","festival":"Invoked in the devotio","priest":"pontifex, dictating the formula","symbols":[],"epithets":[],"sources":["Livy 8.9.6","Arnobius 3.38-39","Varro, De Lingua Latina 5.74"],"groups":[]},{"id":"charon","name":"Charon","latin":"Charon","greek":"Charon","tier":"chthonic","rank":5,"gender":"m","origin":"greek","domains":["ferrying the dead across the Styx"],"summary":"A filthy old man with burning eyes who will not take you if you were not buried — the bureaucratic obstacle at the heart of the Roman underworld.","deeds":["Virgil's portrait is definitive: terrible in his squalor, a grey mat of beard, eyes of standing flame, the cloak knotted at his shoulder, poling his rust-coloured skiff himself though he is a god and old.","Refuses Palinurus, unburied on an Italian beach, and refuses the whole crowd of the unburied who stretch out their hands from the near bank — they must wait a hundred years.","Is not paid by Aeneas at all: the Sibyl simply draws the Golden Bough out from under her robe and his swollen anger settles. Everyone else pays a coin, which is why Romans put one in the mouth of their dead."],"state":"The Etruscan Charun is a separate and grimmer figure — blue-skinned, hook-nosed, carrying a great hammer to finish the dying — and Roman funerary art borrows from both. The requirement of burial made funeral clubs, which pooled subscriptions so poor members could be buried properly, one of the most common associations in the Roman world.","temple":"None","festival":"None","priest":"None","symbols":["the pole and skiff","the coin","burning eyes","the Etruscan hammer"],"epithets":["portitor horrendus"],"sources":["Virgil, Aeneid 6.298-416","Juvenal 3.265-267"],"groups":["underworld"]},{"id":"cerberus","name":"Cerberus","latin":"Cerberus","greek":"Kerberos","tier":"monster","rank":5,"gender":"m","origin":"greek","domains":["guarding the gate of the dead"],"summary":"The three-headed hound whose job is not to keep the living out but to keep the dead in.","deeds":["Dragged up into daylight by Hercules as the twelfth and last labour, without weapons — the only one of the labours that goes into the underworld and comes back.","Charmed to sleep by Orpheus' music, which is how a poet gets past what a hero has to wrestle.","In Virgil the Sibyl throws him a honeyed cake steeped in drugged meal — melle soporatam et medicatis frugibus offam — and the three throats snatch it and the huge body sprawls out across the whole cave. The sop is a Roman funeral cake, which is the point."],"state":"Virgil's drugged cake echoes the real Roman practice of leaving food offerings at tombs. The Latin idiom 'a sop to Cerberus' is not classical, but the image behind it is.","temple":"None","festival":"None","priest":"None","symbols":["three heads","snake-mane","serpent tail"],"epithets":[],"sources":["Virgil, Aeneid 6.417-425","Ovid, Metamorphoses 10.21-22","Hyginus, Fabulae 151"],"groups":["underworld"]},{"id":"minos","name":"Minos","latin":"Minos","greek":"Minos","tier":"chthonic","rank":4,"gender":"m","origin":"greek","domains":["judgement of the dead"],"summary":"The Cretan king who in Virgil's underworld runs a Roman court — with an urn, a jury and a summons.","deeds":["Shakes the urn, summons a silent jury of the dead, and re-examines the lives and the charges (Aeneid 6.432-433).","In life, king of Crete, husband of Pasiphae, master of the Labyrinth and the Minotaur."],"state":"Watch the detail: Virgil casts him as a quaesitor, the presiding magistrate of a Roman standing court, complete with sortition of jurors. Roman legal procedure is imported wholesale into the afterlife. Note also that Virgil makes Rhadamanthus the punisher inside Tartarus and never makes Aeacus a judge at all — the tidy triad of three judges is Greek, and reaches Latin only through Horace, Propertius and Seneca.","temple":"None","festival":"None","priest":"None","symbols":["the urn","the sceptre"],"epithets":["quaesitor Minos"],"sources":["Virgil, Aeneid 6.432-433","Horace, Odes 4.7.21-24"],"groups":["underworld"]},{"id":"rivers_underworld","name":"The Five Rivers","latin":"Styx, Acheron, Cocytus, Phlegethon, Lethe","greek":"same","tier":"chthonic","rank":5,"gender":"n","origin":"greek","domains":["the geography of the underworld"],"summary":"Hate, Woe, Wailing, Fire and Forgetting — Virgil's arrangement of them became the standard map of the afterlife for the next fifteen centuries.","deeds":["STYX, the hateful: the river gods swear by, and in Virgil a marsh the souls must cross, winding nine times about the place.","ACHERON, woe: the river Charon actually ferries, boiling up with mud and vomiting its sand into Cocytus.","COCYTUS, wailing: the river of lamentation.","PHLEGETHON, blazing: a torrent of fire that rings Tartarus, rolling boulders in its current.","LETHE, forgetting: the souls in Elysium drink it after a thousand years, and go back up to be born again. Anchises explains the whole doctrine to Aeneas on its bank, and the parade of unborn Romans is what he shows him next."],"state":"The Roman entrances were real places you could visit: Lake Avernus near Cumae, whose fumes were said to kill birds in flight, and the mundus pit in the Forum. Virgil's five-river system is the direct source for Dante.","temple":"Lake Avernus near Cumae; the mundus in the Forum","festival":"mundus patet, 24 August, 5 October, 8 November","priest":"The Sibyl of Cumae; pontiffs at the mundus","symbols":["the ferry","the marsh","fire","the drink of forgetting"],"epithets":[],"sources":["Virgil, Aeneid 6.295-901","Ovid, Metamorphoses 4.432-446"],"groups":["underworld"]},{"id":"gigantes","name":"The Giants","latin":"Gigantes","greek":"Gigantes","tier":"monster","rank":5,"gender":"m","origin":"greek","domains":["revolt against heaven"],"summary":"Earth's sons who piled mountains to storm the sky — and, in Augustan Rome, the standard image for anyone who fought a civil war and lost.","deeds":["Born from Terra, in some versions from the blood of the castrated Caelus; they heap Ossa on Pelion to reach heaven and are destroyed by Jupiter's thunderbolts.","From their blood Terra makes a new and violent race of men (Ovid, Metamorphoses 1.151-162).","Enceladus lies pinned under Aetna, Typhoeus under Sicily; their struggling is what causes earthquakes."],"state":"Latin poets systematically fuse the Gigantomachy with the Titanomachy — Horace's Odes 3.4 mixes Gyas, Typhoeus, Mimas, Porphyrion, Rhoetus and Enceladus without distinction. The blur is deliberate: the whole complex became the standard allegory for Augustus crushing the chaos of the civil wars, order against brute force, and it is painted, carved and sung everywhere in the period.","temple":"None","festival":"None","priest":"None","symbols":["serpent legs","boulders","piled mountains"],"epithets":[],"sources":["Ovid, Metamorphoses 1.151-162","Horace, Odes 3.4","Claudian, Gigantomachia"],"groups":[]},{"id":"typhoeus","name":"Typhoeus","latin":"Typhoeus, Typhon","greek":"Typhon","tier":"monster","rank":4,"gender":"m","origin":"greek","domains":["storm","volcanic fire","the father of monsters"],"summary":"The hundred-headed storm-monster pinned under Sicily — whose writhing shakes the island and whose breath is Aetna.","deeds":["Born of Terra and Tartarus, the last and worst assault on Jupiter's rule; defeated and buried under Sicily, with Aetna over his mouth.","His struggles crack the earth — and in Ovid it is exactly this that frightens Pluto into riding up to inspect his kingdom's roof, which is when Venus sees him and has Cupid shoot him, which is how Proserpina is taken. The rape of Proserpina is a consequence of a monster's fidgeting.","Father, on Echidna, of Cerberus, the Hydra, the Chimaera and the Sphinx."],"state":"The Sicilian localisation is the Roman version and is doing geographical work: it makes the myth explain a volcano Romans could see.","temple":"None","festival":"None","priest":"None","symbols":["hundred heads","Aetna","earthquake"],"epithets":[],"sources":["Ovid, Metamorphoses 5.321-358","Virgil, Aeneid 3.578-582"],"groups":[]},{"id":"cacus","name":"Cacus","latin":"Cacus","greek":"none — purely Italic","tier":"monster","rank":5,"gender":"m","origin":"italic","domains":["fire","theft","the Aventine cave"],"summary":"The most important native monster in Roman myth — a fire-breathing brigand living in a cave on the Aventine, killed by Hercules on the site of the future city.","deeds":["Son of Vulcan, half-human, vomiting black smoke and flame, with human heads nailed up at his cave mouth.","Steals eight of Hercules' cattle — driven back from Geryon in Spain — by dragging them backwards by the tails so the tracks point away from the cave.","Betrayed when one of the hidden heifers lows and the herd outside answers. Hercules tears the top off the cliff, and the cave is opened to daylight like a wound; he strangles Cacus in the smoke.","Evander then founds the Ara Maxima on the spot, and the rite is still being performed on the day Aeneas arrives."],"state":"Purely Roman, with no Greek original — Cacus may preserve a genuine local fire-deity (his sister Caca had a shrine and a fire cult). His killing is how Rome naturalised Hercules: the Greek hero earns his Roman altar by destroying an Italian monster on the ground where Rome will stand.","temple":"The Scalae Caci on the Palatine preserved his name","festival":"The Ara Maxima rite, 12 August","priest":"The Potitii and Pinarii at the Ara Maxima","symbols":["fire and black smoke","the cave","nailed-up heads"],"epithets":[],"sources":["Virgil, Aeneid 8.184-279","Livy 1.7","Ovid, Fasti 1.543-586","Propertius 4.9"],"groups":[]},{"id":"scylla","name":"Scylla","latin":"Scylla","greek":"Skylla","tier":"monster","rank":4,"gender":"f","origin":"greek","domains":["the strait","shipwreck"],"summary":"Six heads on six necks in a cliff face — and, before that, a girl who was poisoned in her own bathing pool out of jealousy.","deeds":["Was a sea-nymph until Circe, jealous over Glaucus, poisoned the pool where she bathed; the monstrous dogs grew from her own waist and she could not get away from them (Ovid, Met. 13.898-14.74).","Snatches six of Ulysses' men from the deck as the ship passes.","Helenus warns Aeneas to take the long way round Sicily rather than risk the strait at all — Roman epic treats her as a navigational hazard to be avoided by good seamanship."],"state":"Not to be confused with Scylla the daughter of Nisus, who betrayed her father's purple lock. And note: the proverb about falling into Scylla while trying to avoid Charybdis is medieval, not classical.","temple":"None","festival":"None","priest":"None","symbols":["six heads","the girdle of dogs","the cliff"],"epithets":[],"sources":["Ovid, Metamorphoses 13.898-14.74","Virgil, Aeneid 3.420-432"],"groups":["sea"]},{"id":"charybdis","name":"Charybdis","latin":"Charybdis","greek":"Charybdis","tier":"monster","rank":3,"gender":"f","origin":"greek","domains":["the whirlpool"],"summary":"A mouth in the water that swallows the sea three times a day and vomits it back — the other half of the strait.","deeds":["Sucks down and spews out the whole sea three times daily; Virgil's Trojans hear the roar and turn back before they see her."],"state":"Aeneas is warned off and sails the long way round Sicily instead. The moral is characteristically Roman: the hero's correct response to a monster he cannot fight is a change of course.","temple":"None","festival":"None","priest":"None","symbols":["the whirlpool"],"epithets":[],"sources":["Virgil, Aeneid 3.420-432, 3.555-567"],"groups":["sea"]},{"id":"harpies","name":"The Harpies","latin":"Harpyiae","greek":"Harpyiai","tier":"monster","rank":4,"gender":"f","origin":"greek","domains":["snatching","pollution","prophecy"],"summary":"Bird-women with girls' faces who ruin food rather than eat it — and whose leader delivers one of the key prophecies of the Aeneid.","deeds":["Descend on the Trojans' meal in the Strophades, fouling everything they touch; the Trojans fight them with swords and cannot wound them.","Their leader Celaeno then perches on a rock and prophesies: you will reach Italy, but for the wrong you have done us, you will be so starved that you eat your own tables before you build your city.","The omen is fulfilled in Book 7 when the Trojans eat the flat cakes they had used as plates — and Ascanius laughs and says: look, we're eating our tables too."],"state":"A good example of how Virgil works: he takes a Greek monster and makes it deliver the specific, riddling, retrospectively harmless prophecy that marks the founding site. Roman prophecy is usually like this — terrifying, then bureaucratically satisfied.","temple":"None","festival":"None","priest":"None","symbols":["bird body with a woman's face","hooked claws","spoiled food"],"epithets":["Celaeno"],"sources":["Virgil, Aeneid 3.209-267, 7.107-134"],"groups":[]},{"id":"chimaera","name":"The Chimaera","latin":"Chimaera","greek":"Chimaira","tier":"monster","rank":3,"gender":"f","origin":"greek","domains":["hybrid monstrosity","fire"],"summary":"Lion in front, goat in the middle, serpent behind, and fire out of the middle — killed by Bellerophon, and worn as a crest by Turnus.","deeds":["Killed by Bellerophon from the back of Pegasus.","Guards the vestibule of Orcus in Virgil's underworld, among the other shapes Aeneas draws his sword on before the Sibyl stops him.","Blazes on the crest of Turnus' helmet, breathing Aetnaean fire, and Virgil notes that it roars louder as the battle grows bloodier — a helmet that reacts to slaughter."],"state":"The Etruscan bronze Chimaera of Arezzo, made around 400 BC and dug up in 1553, shows how deeply familiar the image was in Italy long before Virgil used it.","temple":"None","festival":"None","priest":"None","symbols":["lion, goat and serpent in one body","fire"],"epithets":[],"sources":["Virgil, Aeneid 6.288, 7.785-788","Ovid, Metamorphoses 9.646-648"],"groups":[]},{"id":"geryon","name":"Geryon","latin":"Geryon","greek":"Geryones","tier":"monster","rank":3,"gender":"m","origin":"greek","domains":["the three-bodied king","cattle"],"summary":"A king with three bodies at the western edge of the world, whose stolen cattle brought Hercules to the future site of Rome.","deeds":["Killed by Hercules on the island of Erythia in the far west; his herd is driven back overland across Spain, Gaul and Italy.","That drive is the reason Hercules camps by the Tiber, and therefore the reason Cacus steals the cattle, and therefore the reason the Ara Maxima exists.","Virgil puts his three-bodied shade at the gate of Orcus."],"state":"Structurally important out of all proportion to his role: the tenth labour of Hercules is the thread that brings Greek myth physically onto Roman ground.","temple":"None","festival":"None","priest":"None","symbols":["three joined bodies","the red cattle"],"epithets":[],"sources":["Virgil, Aeneid 6.289, 8.201-204","Livy 1.7"],"groups":[]},{"id":"hydra","name":"The Lernaean Hydra","latin":"Hydra Lernaea","greek":"Hydra","tier":"monster","rank":3,"gender":"f","origin":"greek","domains":["regenerating heads","venom"],"summary":"Two heads grow where one is cut — and her poison eventually kills the man who killed her.","deeds":["Hercules' second labour; solved only when Iolaus sears each stump with a torch.","Hercules dips his arrows in her blood, and those arrows kill the centaur Nessus, whose poisoned blood on a shirt kills Hercules decades later. The monster wins on a delay.","Virgil doubles her: one Hydra at the entrance of Orcus, and a fiercer fifty-mouthed one inside Tartarus itself."],"state":"The image of a problem that multiplies when attacked entered Latin political vocabulary early and never left it.","temple":"None","festival":"None","priest":"None","symbols":["many heads","the torch","poisoned arrows"],"epithets":[],"sources":["Virgil, Aeneid 6.287, 6.576-579","Ovid, Metamorphoses 9.69-76, 9.101-272"],"groups":[]},{"id":"polyphemus","name":"Polyphemus","latin":"Polyphemus","greek":"Polyphemos","tier":"monster","rank":3,"gender":"m","origin":"greek","domains":["the Cyclops","brutality","unwanted love"],"summary":"Blinded by Ulysses, in love with a sea-nymph who cannot stand him, and — in Virgil — the occasion for Rome's answer to the Odyssey.","deeds":["Blinded by Ulysses with the sharpened stake; Virgil shows him afterwards, groping down to the shore to wash the socket, wading out where the water does not reach his waist.","Loves Galatea, sings her a courtship song of monumental self-regard, and when he sees her with the boy Acis crushes him under a piece of the mountain; Acis' blood becomes a river.","Aeneas rescues Achaemenides, one of Ulysses' crew abandoned on the beach — a Greek, an enemy, saved by Trojans. It is Virgil's deliberate answer to Homer: Roman pietas doing what Greek cunning did not."],"state":"The Achaemenides episode is an invented scene with a polemical purpose, and one of the clearest places to watch Roman literature arguing with its Greek source rather than copying it.","temple":"None","festival":"None","priest":"None","symbols":["the single eye","the pine staff","the flock"],"epithets":[],"sources":["Virgil, Aeneid 3.588-691","Ovid, Metamorphoses 13.750-897"],"groups":[]},{"id":"hercules","name":"Hercules","latin":"Hercules","greek":"Herakles","etruscan":"Hercle","tier":"hero","rank":8,"gender":"m","origin":"greek","domains":["strength","labour","victory","commerce and oaths","protection of travellers"],"summary":"The demigod who became a god by dying — and the first Greek deity to be worshipped on the ground where Rome would stand.","deeds":["Twelve labours imposed by Eurystheus, from the Nemean lion to the fetching of Cerberus — the only labour that goes into death and comes back.","Driving Geryon's cattle home through Italy, he camps by the Tiber; Cacus steals eight beasts by dragging them backwards into his Aventine cave, is betrayed by a single lowing heifer, and is torn out of the cliff and throttled.","Evander founds the Ara Maxima on the spot and recognises the stranger's divinity before he has it; the rite Aeneas walks in on in Aeneid 8 is that same annual sacrifice, already ancient.","Dies in the poisoned shirt of Nessus, burns his mortal part away on Mount Oeta, and is taken up to heaven — Ovid's model for every later apotheosis, including Caesar's."],"state":"The Ara Maxima in the Forum Boarium was served hereditarily by two families, the Potitii and the Pinarii, with sacrifice made Greek-fashion, head uncovered, and women excluded. Merchants dedicated a tenth of their profits to him. Roman generals and later emperors — Commodus most embarrassingly — modelled themselves on him: the man who earns divinity by work rather than birth.","temple":"Ara Maxima in the Forum Boarium; Hercules Victor round temple by the Tiber; Hercules Musarum, 187 BC","festival":"12 August at the Ara Maxima","priest":"Potitii and Pinarii (until 312 BC, then public slaves)","symbols":["club","lion skin","bow","cattle"],"epithets":["Victor","Invictus","Custos","Musarum"],"sources":["Virgil, Aeneid 8.184-305","Livy 1.7, 9.29","Ovid, Fasti 1.543-586","Ovid, Metamorphoses 9.134-272"],"groups":["demigods"]},{"id":"aeneas","name":"Aeneas","latin":"Aeneas","greek":"Aineias","tier":"hero","rank":9,"gender":"m","origin":"greek","domains":["duty","exile and refoundation","the ancestry of Rome"],"summary":"A minor Homeric Trojan whom Rome adopted as its founder — chosen precisely because his defining quality is not glory but obligation.","deeds":["Carries his crippled father Anchises out of burning Troy on his shoulders, leading his son by the hand, and loses his wife Creusa in the smoke; her ghost stops him going back and tells him about Italy.","Loves and leaves Dido at Mercury's order, and Virgil refuses to make it easy: the queen's curse produces Hannibal, and when Aeneas meets her again in the underworld she will not look at him.","Descends to the underworld with the Golden Bough, and is shown by his father's ghost the parade of unborn Romans — including Augustus — and given the Roman mission in six lines: spare the conquered and crush the proud.","Kills Turnus in the last twelve lines of the poem, after hesitating, because he sees Pallas' sword-belt on the man's shoulder. The Aeneid ends on a killing done in rage, and does not comment.","After his death the river Numicus washes off his mortal part and he is worshipped as Iuppiter Indiges."],"state":"The whole Julian claim runs through him: Venus → Aeneas → Iulus → the gens Iulia → Caesar → Augustus. Rome's founder is a refugee whose virtue is doing what he owes even when he hates it — a self-image no other ancient state chose.","temple":"Heroon at Lavinium; cult of Pater Indiges at the Numicus","festival":"Magistrates sacrificed annually at Lavinium","priest":"Roman consuls and praetors at Lavinium","symbols":["carrying his father","the Penates","the Golden Bough","Vulcan's shield"],"epithets":["pius Aeneas","Iuppiter Indiges","Pater Indiges"],"sources":["Virgil, Aeneid 1-12","Livy 1.1-1.2","Ovid, Metamorphoses 14.581-608"],"groups":["demigods","julian_line","trojan_line","deified_mortals"]},{"id":"anchises","name":"Anchises","latin":"Anchises","greek":"Anchises","tier":"mortal","rank":5,"gender":"m","origin":"greek","domains":["the mortal lover of a goddess","ancestral authority"],"summary":"Loved by Venus, lamed by Jupiter for boasting about it, and carried out of Troy on his son's back — then more powerful dead than alive.","deeds":["Seduced by Venus in the guise of a mortal princess on Mount Ida; he boasts of it, and a thunderbolt lames him.","Refuses at first to leave Troy, until flame plays harmlessly around Ascanius' head and a star falls; then he relents, and the escape begins.","Dies at Drepanum in Sicily, off-stage, in a single line — Virgil's most abrupt bereavement.","In Elysium he shows Aeneas the souls waiting to be born and expounds the doctrine of reincarnation; his speech is the ideological centre of the poem."],"state":"Dead, he becomes the voice of Roman purpose. The living Anchises hesitates and has to be persuaded; the dead one hands his son an empire and a rule for holding it.","temple":"Honoured at his tomb in Sicily; funeral games instituted there","festival":"The anniversary games in Aeneid 5","priest":"None","symbols":["the lame leg","the Penates in his arms"],"epithets":[],"sources":["Virgil, Aeneid 2.634-729, 3.708-715, 6.679-901","Homeric Hymn to Aphrodite"],"groups":["trojan_line"]},{"id":"creusa","name":"Creusa","latin":"Creusa","greek":"Kreousa","tier":"mortal","rank":4,"gender":"f","origin":"greek","domains":["the first wife","prophecy after death"],"summary":"Lost in the smoke of Troy, and back within a hundred lines as a ghost taller than life, telling her husband to stop looking for her.","deeds":["Daughter of Priam and Hecuba, wife of Aeneas, mother of Ascanius; separated in the flight and never found.","Her shade appears, larger than the woman was, and forbids grief: long exile lies ahead, a western land, a river Thybris and a royal bride.","She was not killed — the Great Mother of the gods keeps her in that land, and Virgil leaves it there. Aeneas reaches for her three times and three times the shade slips through his hands."],"state":"Her removal is what makes the plot possible: Aeneas must arrive in Italy unmarried. Virgil handles it as a divine abduction rather than a death, which is either mercy or evasion depending on the reader.","temple":"None","festival":"None","priest":"None","symbols":["the vanishing shade"],"epithets":[],"sources":["Virgil, Aeneid 2.735-795"],"groups":["trojan_line"]},{"id":"ascanius","name":"Ascanius / Iulus","latin":"Ascanius, Iulus","greek":"Askanios","tier":"hero","rank":6,"gender":"m","origin":"greek","domains":["dynastic succession","the founding of Alba Longa"],"summary":"Aeneas' son, renamed Iulus so that one Roman family could claim descent from a goddess — the most consequential rebranding in ancient history.","deeds":["A harmless flame plays about his head as Troy burns, and Anchises reads it as the sign to go.","Leads the lusus Troiae, the intricate mounted drill of Trojan boys, at his grandfather's funeral games — a ceremony Augustus revived for the boys of the Roman nobility.","Shoots a stag that turns out to be a Latin girl's tame pet, and the Italian war begins over it. The whole conflict of the second half of the Aeneid starts with a boy hunting.","Kills the taunting Numanus Remulus with an arrow; Apollo appears, praises him, and orders him off the field — his war is over before it starts.","Founds Alba Longa and hands on the line that will reach Romulus."],"state":"Iulus is the hinge of Julian propaganda. Caesar claimed descent from him in a public funeral speech for his aunt, and Augustus built the claim into stone, coinage and epic.","temple":"Honoured at Alba Longa","festival":"The lusus Troiae, revived by Augustus","priest":"None","symbols":["the flame on his head","bow","the Trojan Game"],"epithets":["Iulus"],"sources":["Virgil, Aeneid 2.680-684, 5.545-603, 7.475-510, 9.590-671","Livy 1.3","Suetonius, Julius 6"],"groups":["julian_line","trojan_line","alban_kings"]},{"id":"dido","name":"Dido","latin":"Dido, Elissa","greek":"Dido","tier":"mortal","rank":7,"gender":"f","origin":"greek","domains":["the founding of Carthage","abandoned love","the origin of a war"],"summary":"The Phoenician queen who built a city and lost it to a man passing through — and whose dying curse Rome read as the cause of the Punic Wars.","deeds":["Flees her brother Pygmalion, who murdered her husband Sychaeus for his gold, and founds Carthage on land she measures out with an ox-hide cut into a single thread.","Taken by Juno and Venus, working together for opposite reasons, into a cave during a storm — the moment Virgil calls the beginning of ruin, and refuses to call a marriage.","Curses Aeneas and all his descendants from the pyre: let there rise from my bones an avenger. Every Roman reader heard Hannibal.","Kills herself with the sword he left behind. Her soul will not leave the body until Juno sends Iris to cut the lock of hair that frees it."],"state":"Virgil's greatest and most dangerous creation: a sympathetic enemy. Augustine records weeping over her death as a schoolboy and being ashamed of it later. She gives the Aeneid its moral cost — Rome is founded, and this is what it costs.","temple":"Worshipped as a goddess at Carthage in some traditions","festival":"None at Rome","priest":"None","symbols":["the ox-hide","the pyre","Aeneas' sword"],"epithets":["Elissa"],"sources":["Virgil, Aeneid 1.335-756, 4.1-705","Ovid, Heroides 7","Justin 18.4-6"],"groups":[]},{"id":"latinus","name":"Latinus","latin":"Latinus","greek":"none","tier":"mortal","rank":5,"gender":"m","origin":"italic","domains":["the kingship of Latium"],"summary":"The old king who does everything right and is swept aside anyway — great-grandson of Saturn, and too reasonable for the war around him.","deeds":["Son of Faunus by the nymph Marica, grandson of Picus, great-grandson of Saturn: the Latin royal line is divine four generations up.","Receives the Trojan embassy, recognises the oracle at once, and offers Lavinia and an alliance without being asked twice.","Consults his father Faunus' oracle at Albunea by sleeping on the fleeces, and is told plainly: not a Latin husband.","Withdraws into his palace and lets go of the reins when Amata and Turnus force the war — Virgil's portrait of a ruler who sees clearly and does nothing."],"state":"His hall, hung with the images of Italus, Sabinus, Saturn and Picus, is Virgil's picture of a native Italian antiquity older than Troy — the thing Aeneas marries into rather than conquers.","temple":"Honoured with Jupiter Latiaris at the Latin Festival on the Alban Mount","festival":"Feriae Latinae (movable)","priest":"None","symbols":["the ancestral hall","the twelve-rayed crown","olive"],"epithets":[],"sources":["Virgil, Aeneid 7.45-285","Livy 1.1-1.2"],"groups":["latin_kings"]},{"id":"lavinia","name":"Lavinia","latin":"Lavinia","greek":"none","tier":"mortal","rank":5,"gender":"f","origin":"italic","domains":["the marriage that founds Rome"],"summary":"The bride the war is fought over, who says nothing in the entire poem — and who blushes once, in the most argued-about line in Latin literature.","deeds":["Her hair catches fire without burning as she stands at the altar, and the seers read it: glory for herself, and a great war for her people.","Faunus' oracle forbids her marriage to any Latin; a foreigner is coming who will raise the name to the stars.","When Turnus is told she is weeping, she blushes — and Virgil gives no explanation at all, which has kept scholars busy for two millennia.","After Aeneas' death she rules as regent, bearing Silvius in the woods, and Lavinium is named for her."],"state":"Lavinium, her city, held the Penates that Roman magistrates went out to sacrifice to every year. The silent woman is the hinge of the whole settlement: Trojan and Latin become one people through her.","temple":"Lavinium, the shrine of the Penates","festival":"Annual magistrates' sacrifice at Lavinium","priest":"None","symbols":["the burning hair","the blush","the veil"],"epithets":[],"sources":["Virgil, Aeneid 7.71-80, 12.64-70","Livy 1.1-1.3"],"groups":["latin_kings","trojan_line"]},{"id":"amata","name":"Amata","latin":"Amata","greek":"none","tier":"mortal","rank":4,"gender":"f","origin":"italic","domains":["maternal fury","the possession of a mortal by a goddess"],"summary":"A queen used as a weapon — the Fury Allecto plants a snake in her breast, and she takes the whole of Latium to war before she hangs herself.","deeds":["Wants Turnus for her daughter; Allecto, sent by Juno, slides a serpent from her hair into the queen's dress, and the venom works inward like a slow fever until reason gives way.","Fakes a Bacchic frenzy, hides Lavinia in the mountains, and calls out the mothers of Latium — the first mass action of the war is women leaving their houses.","Hangs herself in the palace when she believes Turnus dead and the city lost, and Latinus tears his clothes and blames himself."],"state":"Virgil's clearest study of divine manipulation: nothing Amata does is out of character, and all of it is caused by a goddess. Roman literature is unusually interested in whether that distinction means anything.","temple":"None","festival":"None","priest":"None","symbols":["the serpent","the false thyrsus","the noose"],"epithets":[],"sources":["Virgil, Aeneid 7.341-405, 12.593-613"],"groups":["latin_kings"]},{"id":"turnus","name":"Turnus","latin":"Turnus","greek":"none","tier":"hero","rank":6,"gender":"m","origin":"italic","domains":["Italian resistance","the doomed champion"],"summary":"The nymph-born prince of the Rutulians — everything a Homeric hero should be, in a poem that has decided such men are finished.","deeds":["Roused from sleep by Allecto, who mocks him and then throws a torch into his chest; he wakes screaming for his weapons.","Breaks into the Trojan camp alone and fights his way out through the whole army, escaping by leaping fully armed into the Tiber.","Kills young Pallas and strips his sword-belt, and Virgil stops the narrative to say that men do not know their fate or how to keep their luck when it is good.","Deserted by Juturna and by Jupiter at the last, wounded in the thigh, he asks for his body to be returned to his father — and dies because Aeneas notices the belt."],"state":"The Aeneid's final image is his life going down to the shades with a groan, resentful. Rome's foundation epic ends with the Italian, not the Trojan, and readers have never agreed on what that means.","temple":"None","festival":"None","priest":"None","symbols":["the Chimaera crest","Pallas' sword-belt","the golden helmet"],"epithets":[],"sources":["Virgil, Aeneid 7.406-474, 9.1-818, 12.1-952"],"groups":[]},{"id":"camilla","name":"Camilla","latin":"Camilla","greek":"none","tier":"hero","rank":5,"gender":"f","origin":"italic","domains":["the warrior maiden","Diana's votary"],"summary":"Bound to a spear as an infant and thrown across a flooded river with a vow — she could run over standing corn without bending it, and died reaching for gold armour.","deeds":["Her father Metabus, driven out and pursued with the baby in his arms, ties her to his spear, vows her to Diana, and hurls the spear across the flooded Amasenus, then swims after it.","Raised on mare's milk in the wild; a Volscian cavalry commander who leads her own troop, and the finest fighter in the Italian army.","Killed by a thrown spear from Arruns while chasing the Trojan priest Chloreus for his gold and purple — Virgil says she pursued him with a woman's love of plunder and finery, and critics have been uneasy about the line ever since.","Diana sends the nymph Opis, who shoots Arruns dead where he stands and goes back up to Olympus."],"state":"Probably Virgil's own creation from Italic cult material — the camillus and camilla were the boy and girl attendants at Roman sacrifices. He gives the Italian side the one warrior the Trojans genuinely cannot handle, and makes her a girl.","temple":"None","festival":"None","priest":"Vowed to Diana from infancy","symbols":["the spear she was tied to","myrtle-shafted javelin","the Amazon's bow"],"epithets":[],"sources":["Virgil, Aeneid 7.803-817, 11.532-867"],"groups":[]},{"id":"evander","name":"Evander","latin":"Evander","greek":"Euandros","tier":"hero","rank":5,"gender":"m","origin":"greek","domains":["the first settlement on the Palatine","hospitality"],"summary":"An Arcadian exile who founded a village on the Palatine sixty years before Troy fell — and gave Aeneas a walking tour of a Rome that did not exist yet.","deeds":["Son of Mercury and the prophetic nymph Carmenta, exiled from Arcadia, he settles Pallanteum on the Palatine.","Founds the Ara Maxima after Hercules kills Cacus, and is still celebrating the rite when the Trojan ships arrive.","Walks Aeneas through the site of the future city — cattle lowing in the Forum, thickets on the Capitol where a god already lives, the Argiletum, the Tarpeian rock — in the most famous passage of Roman antiquarian imagination.","Sends his only son Pallas to war with Aeneas, and gets him back dead."],"state":"Virgil uses him to date Rome's sanctity earlier than Rome: the ground was holy, and Greek, before either Trojans or Latins got there. His mother Carmenta gave her name to the Porta Carmentalis and to a festival with its own flamen.","temple":"Altar at the foot of the Aventine","festival":"Honoured with Carmenta at the Carmentalia","priest":"None","symbols":["the humble hut","the Ara Maxima"],"epithets":[],"sources":["Virgil, Aeneid 8.51-369","Livy 1.5-1.7","Ovid, Fasti 1.469-542"],"groups":[]},{"id":"pallas_evander","name":"Pallas (son of Evander)","latin":"Pallas","greek":"none","tier":"hero","rank":4,"gender":"m","origin":"greek","domains":["the boy sent to war"],"summary":"Aeneas' ward, killed in his first campaign — and the reason the Aeneid ends the way it does.","deeds":["Rallies the retreating Arcadians at the riverbank with a speech and a charge, and holds the line.","Faces Turnus knowing he cannot win; his spear grazes, Turnus' goes through him.","Turnus takes his sword-belt, engraved with the murdered sons of Aegyptus, and puts it on.","His body goes home to Evander on a bier of wicker and oak boughs, with an escort of a thousand men — the longest funeral in the poem."],"state":"Aeneas kills Turnus not as a Roman but as a man discharging a debt to a dead boy's father: Pallas strikes this blow, Pallas takes this sacrifice from your guilty blood. The empire's founder ends the poem performing a private vengeance.","temple":"None","festival":"None","priest":"None","symbols":["the sword-belt","the bier"],"epithets":[],"sources":["Virgil, Aeneid 8.514-519, 10.362-509, 11.1-99, 12.940-952"],"groups":[]},{"id":"silvius","name":"Silvius & the Alban Kings","latin":"Silvius","greek":"none","tier":"mortal","rank":4,"gender":"m","origin":"italic","domains":["the dynasty between Troy and Rome"],"summary":"Fourteen kings invented to bridge four hundred years — a chronological repair job that Roman writers performed with a straight face.","deeds":["Silvius is born posthumously in the woods to Lavinia, and shown to Aeneas in Elysium as his last-born child, a king and the father of kings.","The Livian list: Silvius, Aeneas Silvius, Latinus Silvius, Alba, Atys, Capys, Capetus, Tiberinus, Agrippa, Romulus Silvius, Aventinus, Proca, then Numitor and Amulius.","Tiberinus drowns in the river Albula, which takes his name and becomes the Tiber. Romulus Silvius is blasted by lightning for imitating Jupiter's thunder with machines. Aventinus is buried on the hill that carries his name."],"state":"Troy fell in 1184 BC by the standard reckoning and Rome was founded in 753. Somebody had to fill four centuries, and this list is the result — with just enough divine punishment scattered through it to look like history.","temple":"Alba Longa","festival":"Feriae Latinae","priest":"None","symbols":["the Alban king-list","the white sow"],"epithets":[],"sources":["Virgil, Aeneid 6.760-776","Livy 1.3","Ovid, Fasti 4.41-56"],"groups":["alban_kings"]},{"id":"numitor","name":"Numitor","latin":"Numitor","greek":"none","tier":"mortal","rank":3,"gender":"m","origin":"italic","domains":["the deposed rightful king"],"summary":"Pushed off the throne of Alba Longa by his younger brother, and put back on it by two grandsons he did not know he had.","deeds":["Deposed by Amulius, who murders his son and makes his daughter a Vestal so the line will die.","Recognises Remus, brought before him as a captive, by his age and bearing — and works out the rest.","Restored when the twins kill Amulius; he then gives them leave to found a city of their own, which is how Rome gets founded at all."],"state":"The legal pretext for everything that follows: Romulus and Remus are not adventurers but the restored royal line, going out to found a colony with a king's permission.","temple":"None","festival":"None","priest":"None","symbols":[],"epithets":[],"sources":["Livy 1.3-1.6","Dionysius of Halicarnassus 1.76-83"],"groups":["alban_kings"]},{"id":"amulius","name":"Amulius","latin":"Amulius","greek":"none","tier":"mortal","rank":3,"gender":"m","origin":"italic","domains":["usurpation","sacrilege"],"summary":"The usurper whose crime against a Vestal produced the god-fathered twins who killed him.","deeds":["Seizes the throne from his elder brother, kills Numitor's son, and forces Rhea Silvia into Vesta's priesthood so that no heir can be born.","Orders the newborn twins exposed in the flooded Tiber.","Killed by those twins twenty years later."],"state":"The moral machinery of the foundation story: it is precisely the attempt to sterilise the royal line by making the princess a Vestal that puts her in a god's path. Roman legend consistently punishes offences against Vesta.","temple":"None","festival":"None","priest":"None","symbols":[],"epithets":[],"sources":["Livy 1.3-1.5","Ovid, Fasti 3.49-58"],"groups":["alban_kings"]},{"id":"rhea_silvia","name":"Rhea Silvia","latin":"Rhea Silvia, Ilia","greek":"none","tier":"mortal","rank":5,"gender":"f","origin":"italic","domains":["the Vestal mother of Rome"],"summary":"A Vestal forced into the priesthood to end a dynasty, who bore the god of war's sons in a grove and was punished for it.","deeds":["Ovid puts her asleep by the river with her water-jar tipped over, dreaming of two palm trees springing up — one taller — before Mars comes.","Livy has her name Mars as the father, and lets the reader decide whether she believed it or whether it was the only defence available.","Imprisoned, or in some versions thrown into the Anio and taken as the river-god's bride."],"state":"The Vestal at the origin of Rome is not decoration: the crime of forcing her into the order, and the violation that follows, are why Amulius falls. Roman readers understood the whole foundation as beginning with an offence against Vesta being repaid.","temple":"None","festival":"None","priest":"Vestal Virgin","symbols":["the tipped water-jar","the twin palms","the grove"],"epithets":["Ilia"],"sources":["Livy 1.3-1.4","Ovid, Fasti 3.9-48","Horace, Odes 1.2.17-20"],"groups":["alban_kings"]},{"id":"romulus","name":"Romulus","latin":"Romulus","greek":"none","tier":"hero","rank":8,"gender":"m","origin":"italic","domains":["the founding of Rome","the first kingship","augury"],"summary":"Son of Mars, suckled by a wolf, founder of the city, killer of his brother — and taken bodily into heaven in a storm.","deeds":["Exposed in the Tiber with Remus, washed ashore at the Ficus Ruminalis, and suckled by a she-wolf until the herdsman Faustulus takes them in.","Wins the augury contest on the Palatine with twelve vultures to Remus' six, and kills his brother when he jumps the new wall: so perish anyone else who leaps my walls.","Opens an asylum between the two peaks of the Capitol for fugitives, debtors and runaways — Rome is founded as a refuge for the desperate, and the Romans never hid this.","Stages the Consualia to draw the Sabines in with their families, and seizes their unmarried women; the war that follows is stopped by the women themselves, walking between the two armies.","Wins the spolia opima by killing Acron of Caenina in single combat and dedicating his armour to Jupiter Feretrius — an honour achieved only twice more in a thousand years.","Vanishes in a sudden storm while reviewing the army at the Palus Caprae; the senators are widely suspected of tearing him apart, until Julius Proculus swears he met him on the road, taller than in life, saying: call me Quirinus."],"state":"Every Roman institution was traced back to him: the Senate, the curiae, the three tribes, the celeres, the asylum, the pomerium. Augustus considered taking the name Romulus and chose Augustus instead — partly because Romulus killed his colleague, and partly because he had been a king.","temple":"The Casa Romuli on the Palatine, a thatched hut maintained and rebuilt for centuries; worshipped as Quirinus","festival":"Parilia, 21 April (the city's birthday); Quirinalia, 17 February","priest":"flamen Quirinalis (as Quirinus)","symbols":["the she-wolf","the augur's staff (lituus)","the plough marking the walls","the spolia opima"],"epithets":["Quirinus","Conditor"],"sources":["Livy 1.4-1.16","Ovid, Fasti 2.381-424, 3.9-70","Plutarch, Romulus","Ennius, Annales"],"groups":["demigods","deified_mortals"]},{"id":"remus","name":"Remus","latin":"Remus","greek":"none","tier":"hero","rank":6,"gender":"m","origin":"italic","domains":["the murdered twin","the founding sacrifice"],"summary":"The brother who saw six birds instead of twelve and died for a joke about a low wall.","deeds":["Captured by Numitor's herdsmen in a brawl over pasture, brought before his own grandfather, and recognised — which sets the recognition and the revolution in motion.","Loses the augury, disputes the result, and mockingly leaps the half-built rampart. Livy gives two versions of who killed him and does not choose.","His ghost appears to Faustulus and Acca Larentia, bloodied, asking why he is neglected — and the Lemuria, Ovid says, is named from Remuria."],"state":"Rome's founding act is a fratricide, and Romans knew it. Horace, writing during the civil wars, says a bitter fate drives the Romans, the crime of a brother's murder, ever since Remus' blood soaked into the ground. The story is used as a permanent explanation for civil war.","temple":"None","festival":"Lemuria, 9, 11 and 13 May (by Ovid's etymology)","priest":"None","symbols":["the six vultures","the leapt wall"],"epithets":[],"sources":["Livy 1.6-1.7","Ovid, Fasti 4.807-862, 5.451-484","Horace, Epodes 7.17-20"],"groups":["demigods"]},{"id":"acca_larentia","name":"Acca Larentia","latin":"Acca Larentia","greek":"none","tier":"mortal","rank":4,"gender":"f","origin":"italic","domains":["nursing the twins","a bequest to the Roman people"],"summary":"The foster-mother of Romulus and Remus — and, in the version Romans found more plausible, the reason the she-wolf story exists at all.","deeds":["Wife of the herdsman Faustulus, she raises the twins as her own after the wolf.","Livy records the rationalising tradition without embarrassment: she was called lupa, she-wolf, because that was the common word for a prostitute — which is where the legend came from.","In an entirely different story she is a courtesan won at dice by Hercules' temple-keeper, who marries the rich Etruscan Tarutius and leaves her whole estate to the Roman people.","Her twelve sons were said to be the original Arval Brethren, with Romulus taking the place of one who died."],"state":"Honoured at the Larentalia on 23 December with funeral rites at her supposed tomb, performed by a state priest — an official cult for a woman whose story Romans could not agree on at all.","temple":"Tomb in the Velabrum","festival":"Larentalia, 23 December","priest":"flamen Quirinalis with the pontiffs","symbols":["the twelve Arval Brethren","the she-wolf"],"epithets":["Larentina","Fabula"],"sources":["Livy 1.4","Ovid, Fasti 3.55-58","Plutarch, Romulus 4-5","Macrobius, Saturnalia 1.10"],"groups":[]},{"id":"faustulus","name":"Faustulus","latin":"Faustulus","greek":"none","tier":"mortal","rank":3,"gender":"m","origin":"italic","domains":["the shepherd who found the twins"],"summary":"The royal herdsman who saw a wolf licking two babies and did the decent thing.","deeds":["Finds the twins at the Lupercal, carries them home to Acca Larentia, and keeps the secret of their birth for twenty years.","Reveals it at exactly the right moment, when Remus is in Numitor's hands.","In one tradition he dies trying to get between the quarrelling brothers at the wall."],"state":"He anchors the whole legend to two real places — the Lupercal cave at the foot of the Palatine, and the Ficus Ruminalis, the fig tree by the river — which Romans could and did visit.","temple":"None","festival":"Associated with the Lupercalia","priest":"None","symbols":["the shepherd's crook","the Lupercal cave"],"epithets":[],"sources":["Livy 1.4-1.7","Ovid, Fasti 3.55","Plutarch, Romulus 6-10"],"groups":[]},{"id":"hersilia","name":"Hersilia","latin":"Hersilia","greek":"none","tier":"deified","rank":4,"gender":"f","origin":"sabine","domains":["the peace between Romans and Sabines"],"summary":"A Sabine woman who married her abductor, stopped the war, and was made a goddess to match her husband.","deeds":["Leads the abducted women out between the two armies with their children in their arms, and tells both sides to kill them rather than each other. The battle stops, and the two peoples become one.","After Romulus vanishes she mourns until Juno sends Iris down the rainbow to the Quirinal; a star falls, her hair takes fire from it, and she rises as the goddess Hora Quirini."],"state":"A matched apotheosis: the deified founder gets a deified consort. Ovid uses her to complete the pattern of Roman divinisation that ends, three hundred lines later, with Caesar and Augustus.","temple":"Honoured with Quirinus on the Quirinal","festival":"With the Quirinalia, 17 February","priest":"flamen Quirinalis","symbols":["the rainbow","the falling star"],"epithets":["Hora Quirini"],"sources":["Livy 1.11-1.13","Ovid, Metamorphoses 14.829-851"],"groups":["deified_mortals"]},{"id":"tarpeia","name":"Tarpeia","latin":"Tarpeia","greek":"none","tier":"mortal","rank":4,"gender":"f","origin":"italic","domains":["treason","the execution rock"],"summary":"She asked for what the Sabines wore on their left arms, meaning their gold bracelets; they gave her their shields.","deeds":["Daughter of the commander of the citadel, she lets the Sabines in by night for the price of what they wear on their left hands.","Crushed under the shields they throw on her as they enter — a bargain kept to the letter and not the intention, which is a very Roman kind of justice.","The Tarpeian Rock on the Capitol was named for her and used for the execution of traitors for the next eight centuries.","Propertius rewrites her as a Vestal who fell in love with Titus Tatius while drawing water at the Muses' spring — treason as an erotic tragedy rather than a bribe."],"state":"One of the very few Roman legends about a woman that is purely negative, and the origin story for an actual functioning place of execution. Romans walked past the rock every day.","temple":"None","festival":"None","priest":"None","symbols":["the bracelets","the shields","the rock"],"epithets":[],"sources":["Livy 1.11","Propertius 4.4","Ovid, Fasti 1.261-262"],"groups":[]},{"id":"titus_tatius","name":"Titus Tatius","latin":"Titus Tatius","greek":"none","tier":"mortal","rank":4,"gender":"m","origin":"sabine","domains":["the Sabine kingship","the joint rule"],"summary":"The Sabine king who came to destroy Rome and ended up ruling it jointly with Romulus.","deeds":["Leads the Sabine war of vengeance after the abduction, takes the citadel through Tarpeia's treachery, and fights Romulus to a standstill in the Forum.","Accepts the peace the women impose, and rules Rome jointly with Romulus until his death.","Lynched at Lavinium after refusing to hand over kinsmen who had assaulted foreign envoys — killed, in effect, for breaking the law of nations."],"state":"The charter myth for Rome as a fused people rather than a pure one. The Sabines are not conquered; they move in, and their king shares the throne. Roman citizenship policy for the next eight hundred years is prefigured here.","temple":"None","festival":"Associated with the Nonae Caprotinae","priest":"Said to have founded several cults, including that of the Sabine gods","symbols":[],"epithets":[],"sources":["Livy 1.10-1.14","Ovid, Fasti 3.199-228","Plutarch, Romulus 19-24"],"groups":[]},{"id":"numa","name":"Numa Pompilius","latin":"Numa Pompilius","greek":"none","tier":"mortal","rank":7,"gender":"m","origin":"sabine","domains":["religious law","the calendar","the priesthoods"],"summary":"Rome's second king and the inventor of its entire religion — who claimed a nymph dictated it to him at night, and whom Livy suspected of making that up.","deeds":["Creates the flamines, the Vestals, the Salii, the pontiffs and the augurs; builds the gate of Janus; reforms the calendar to twelve months.","Meets the nymph Egeria nightly in the grove of the Camenae, and attributes every innovation to her instruction.","Traps Picus and Faunus by drugging their spring with wine and honey, and holds them until they tell him how to draw down Jupiter's lightning safely.","Haggles Jupiter down in person: the god demands a head, and Numa offers an onion head; hairs, and he offers hair from the head; a life, and he offers a fish. Jupiter laughs and accepts. It is the most characteristic Roman story about religion there is."],"state":"Livy's comment is the earliest surviving Roman analysis of religion as an instrument of government: Numa invented the nightly meetings with a goddess because a rough people would accept nothing new without divine authority. Rome's own historians were entirely capable of saying this in public.","temple":"The Regia, his traditional residence; his supposed books were dug up in 181 BC and burned by order of the Senate","festival":"The whole calendar attributed to him","priest":"Established every major priesthood","symbols":["the ancile shield","the closed gate of Janus","the grove of Egeria"],"epithets":[],"sources":["Livy 1.18-1.21","Ovid, Fasti 3.259-392","Plutarch, Numa"],"groups":["roman_kings"]},{"id":"tullus_hostilius","name":"Tullus Hostilius","latin":"Tullus Hostilius","greek":"none","tier":"mortal","rank":4,"gender":"m","origin":"italic","domains":["war","the destruction of Alba Longa"],"summary":"Rome's warrior king, who destroyed the mother city and was destroyed himself by a botched ritual.","deeds":["Settles the war with Alba Longa by the duel of the three Horatii against the three Curiatii — and then has the surviving Horatius tried for killing his own sister when she wept for her betrothed among the dead.","Has the treacherous Alban dictator Mettius Fufetius torn in half between two chariots, and destroys Alba Longa, transplanting its whole population to Rome.","Late in life, frightened by plague, he tries Numa's secret rite to summon Jupiter Elicius, gets it wrong, and is struck by lightning with his entire house."],"state":"The lesson Romans drew was not about impiety but about incompetence: he performed the ritual incorrectly. In Roman religion, procedure is the substance.","temple":"None","festival":"None","priest":"None","symbols":["the three duellists","the lightning"],"epithets":[],"sources":["Livy 1.22-1.31","Dionysius of Halicarnassus 3.1-35"],"groups":["roman_kings"]},{"id":"servius_tullius","name":"Servius Tullius","latin":"Servius Tullius","greek":"none","tier":"mortal","rank":5,"gender":"m","origin":"italic","domains":["the census","the Servian constitution","the Aventine Diana"],"summary":"Born to a slave woman by a phallus that rose from the palace hearth-fire, crowned when flames played round his sleeping head, and murdered by his own daughter.","deeds":["His mother Ocrisia, a captive, conceived him from a spirit of the hearth — Vulcan, or the household Lar. Flame played harmlessly about the sleeping child's head and the queen read it as a sign.","Institutes the census, the centuriate assembly and the property classes: the framework of Roman political life for the next four hundred years.","Builds the temple of Diana on the Aventine as the Latin League's federal sanctuary.","Ovid makes him the mortal lover of Fortuna, who came to him by a window; when Tullia had him murdered and drove her carriage over his body in the street ever after called the Vicus Sceleratus, the goddess veiled her own statue's face."],"state":"The most consequential of the kings for how Rome actually worked, and the one with the strangest birth. That Rome's constitutional architect was the son of a slave woman and a hearth-spirit was a story the Romans kept, not one they tidied away.","temple":"Credited with the temples of Diana on the Aventine, Fortuna and Mater Matuta in the Forum Boarium, and Luna on the Aventine","festival":"Nonae Caprotinae; the Servian temples' dedication days","priest":"None","symbols":["the flame around the head","the census","the Servian Wall"],"epithets":[],"sources":["Livy 1.39-1.48","Ovid, Fasti 6.569-636","Dionysius of Halicarnassus 4.1-40"],"groups":["roman_kings"]},{"id":"lucretia","name":"Lucretia","latin":"Lucretia","greek":"none","tier":"mortal","rank":6,"gender":"f","origin":"italic","domains":["chastity","the fall of the monarchy"],"summary":"Raped by the king's son, she called in her father and husband, made them swear vengeance, and killed herself in front of them — and the Republic began.","deeds":["Wins the wives' virtue contest: the young officers ride back from the siege unannounced and find the other wives at dinner parties, and Lucretia spinning with her maids by lamplight.","Raped by Sextus Tarquinius, who threatens to kill her and a slave together and claim he caught them — a threat aimed at her reputation, not her life.","Summons her father and husband, tells them everything, makes them swear, refuses their absolution — though I acquit myself of the fault, I do not free myself from the penalty — and stabs herself.","Brutus pulls the knife from her body, holds it up, and swears by her blood to drive out the Tarquins. The monarchy ends in 509 BC."],"state":"Deliberately secular: no god acts anywhere in the story. Roman historians made the founding act of the Republic depend entirely on human character, and specifically on a woman's judgement about her own honour.","temple":"None","festival":"None","priest":"None","symbols":["the spindle and wool","the knife"],"epithets":[],"sources":["Livy 1.57-1.59","Ovid, Fasti 2.685-852","Dionysius of Halicarnassus 4.64-85"],"groups":["exempla"]},{"id":"horatius","name":"Horatius Cocles","latin":"Horatius Cocles","greek":"none","tier":"mortal","rank":5,"gender":"m","origin":"italic","domains":["holding the bridge"],"summary":"One-eyed, he held the Sublician bridge alone while Rome cut it down behind him, then swam the Tiber in full armour.","deeds":["With Herminius and Lartius, and then alone, he blocks the narrow bridge against Lars Porsenna's Etruscan army while the Romans hack at the timbers behind him.","When the bridge goes, he prays: Father Tiberinus, receive these arms and this soldier in your kindly stream — and jumps in armour, and gets across.","Given as much public land as he could plough round in a day, and a statue in the Comitium."],"state":"The prayer to Tiberinus is the only supernatural element, and it is a prayer to Rome's own river. Polybius, a Greek writing for Greeks, tells the story to explain what Roman soldiers were like.","temple":"Statue in the Comitium","festival":"None","priest":"None","symbols":["the broken bridge","the single eye"],"epithets":["Cocles (the one-eyed)"],"sources":["Livy 2.10","Polybius 6.55","Dionysius of Halicarnassus 5.23-25"],"groups":["exempla"]},{"id":"scaevola","name":"Gaius Mucius Scaevola","latin":"C. Mucius Scaevola","greek":"none","tier":"mortal","rank":5,"gender":"m","origin":"italic","domains":["endurance","the price of resolve"],"summary":"He went to assassinate an enemy king, killed the wrong man, and then burned his own right hand off in front of him to make a point.","deeds":["Infiltrates Porsenna's camp, mistakes the paymaster for the king on payday, and kills him.","Dragged before Porsenna, he thrusts his right hand into the altar fire and holds it there while it burns, saying: see how cheap the body is to men who have a great glory in view.","Tells the king that three hundred more young Romans have sworn the same oath and are drawing lots for their turn. Porsenna, unnerved, opens peace negotiations.","Nicknamed Scaevola, the left-handed, ever after, and the name became one of Rome's most distinguished."],"state":"The story's real content is deterrence: the hand in the fire is not courage for its own sake but a demonstration designed to change an enemy's calculations. It works.","temple":"None","festival":"None","priest":"None","symbols":["the hand in the fire","the altar"],"epithets":["Scaevola (the left-handed)"],"sources":["Livy 2.12-2.13","Plutarch, Publicola 17"],"groups":["exempla"]},{"id":"cloelia","name":"Cloelia","latin":"Cloelia","greek":"none","tier":"mortal","rank":4,"gender":"f","origin":"italic","domains":["escape","female courage"],"summary":"A hostage who led a group of girls out of the enemy camp and swam the Tiber under fire — and got an equestrian statue for it.","deeds":["Given as a hostage to Porsenna, she escapes at the head of a group of Roman girls, swimming the Tiber through a hail of missiles.","Rome sends her back, because the treaty required it and the treaty was the treaty.","Porsenna, impressed rather than angry, frees her and lets her choose half the remaining hostages to take home; she chooses the boys who were young enough to be at risk.","Honoured with an equestrian statue on the Via Sacra — a girl on horseback, among generals."],"state":"The point of returning her is the point of the story: Roman good faith held even when it cost them a heroine. The statue is the state's acknowledgement that both things were true.","temple":"Equestrian statue on the Via Sacra","festival":"None","priest":"None","symbols":["the horse","the river crossing"],"epithets":[],"sources":["Livy 2.13","Plutarch, Publicola 19","Pliny, Natural History 34.28-29"],"groups":["exempla"]},{"id":"cincinnatus","name":"Cincinnatus","latin":"L. Quinctius Cincinnatus","greek":"none","tier":"mortal","rank":5,"gender":"m","origin":"italic","domains":["the relinquished command","the citizen farmer"],"summary":"Called from his plough to absolute power, he won the war in a fortnight and went back to the plough.","deeds":["Found by the Senate's envoys working his four-acre farm across the Tiber; he asks his wife for his toga so he can hear the message decently dressed, and is told he is dictator.","Defeats the Aequi at Mount Algidus in a single night march and a dawn attack, and sends the whole army under the yoke.","Resigns the dictatorship after sixteen days of a six-month term, and goes home."],"state":"The single most quoted Roman example, and the one that most obviously served a political purpose: it told every subsequent Roman with an army that laying power down was the more admirable act. Sulla, Caesar and Augustus were all measured against it, and all three knew it.","temple":"None","festival":"None","priest":"None","symbols":["the plough","the toga","the yoke"],"epithets":[],"sources":["Livy 3.26-3.29","Cicero, De Senectute 56"],"groups":["exempla"]},{"id":"dioscuri","name":"Castor and Pollux","latin":"Castores, Gemini","greek":"the Dioscuri","tier":"hero","rank":6,"gender":"m","origin":"greek","domains":["cavalry","sailors and storms","brotherly loyalty"],"summary":"The twin horsemen who fought in the Roman line at Lake Regillus and announced the victory in the Forum the same evening, before any messenger could have arrived.","deeds":["Pollux, the son of Jupiter, is immortal; Castor, the son of Tyndareus, is not. When Castor dies, Pollux asks to share his immortality, and they alternate between heaven and the underworld — the myth Romans admired most about them.","At Lake Regillus (499 or 496 BC) the dictator Postumius vows them a temple; two enormous young men on white horses lead the decisive charge.","The same evening two strangers in armour are seen watering their steaming horses at the Lacus Juturnae in the Forum, telling the crowd Rome has won — then vanishing.","Appear again to announce victories at Pydna in 168 BC and elsewhere: the standard Roman battlefield epiphany."],"state":"Their temple, dedicated 484 BC, stood in the Forum and served as an office of weights and measures and a strongroom. They were the patron gods of the equites, who paraded past their temple in the transvectio equitum every 15 July. Edepol and mecastor — 'by Pollux', 'by Castor' — were among the commonest Latin oaths, the second used mainly by women.","temple":"Temple of Castor and Pollux in the Roman Forum, vowed 499/496, dedicated 484 BC","festival":"15 July (transvectio equitum); 27 January","priest":"None","symbols":["white horses","the pointed caps (pilei) with stars","spears
