tility","the vine","growth"],"summary":"Liber's female counterpart, the third of the plebeian Aventine Triad — the goddess who gave plebeian women a place at the festival.","deeds":["Named by Cicero as Liber's sister and Ceres' daughter, distinct from the Greek imports.","Equated with Proserpina from the third century BC, and with Ariadne as the bride of Bacchus.","Her presence at the Liberalia meant the coming-of-age rite belonged to both halves of the plebeian household."],"state":"The third member of the Aventine Triad, the plebeian answer to the patrician Capitoline Triad. Ceres, Liber and Libera on the Aventine stood against Jupiter, Juno and Minerva on the Capitol — the class division of Rome written into its skyline.","temple":"Aventine Triad temple, 493 BC","festival":"Liberalia, 17 March","priest":"Aventine college","symbols":["vine","ivy","wine cup"],"epithets":["Libera"],"sources":["Cicero, De Natura Deorum 2.62","Livy 3.55"],"groups":["aventine_triad"]},{"id":"quirinus","name":"Quirinus","latin":"Quirinus","greek":"loosely Enyalios","tier":"major","rank":7,"gender":"m","origin":"sabine","domains":["the Roman people in peace","the citizen body (Quirites)","a war god at rest"],"summary":"The deified Romulus, and the third god of Rome's oldest triad — war put away, the citizen instead of the soldier.","deeds":["As Romulus: founds the city, kills Remus at the wall, seizes the Sabine women at the Consualia, and wins the spolia opima from Acron of Caenina.","Vanishes in a sudden storm at the Palus Caprae while reviewing the army; the senators are suspected of tearing him apart.","Appears at dawn to Julius Proculus on the road from Alba, taller than in life, and tells him: go, announce to the Romans that heaven wills my city to be the capital of the world — and call me Quirinus.","His flamen also officiated at the Consualia and the Robigalia, rites that have nothing to do with Romulus — evidence he was a real Sabine god long before the identification."],"state":"Third member of the Archaic Triad with Jupiter and Mars, which is the surest sign of his antiquity — he outranks Juno and Minerva in the oldest scheme. The flamen Quirinalis was one of the three flamines maiores. Quirinus represents the Romans as Quirites, citizens in their civil rather than military capacity: the same men, with the weapons put down.","temple":"Temple on the Quirinal, dedicated 293 BC by L. Papirius Cursor — Rome's first sundial stood beside it","festival":"Quirinalia, 17 February (the traditional day of Romulus' disappearance); Poplifugia, 5 July","priest":"flamen Quirinalis (flamen maior)","symbols":["myrtle","spear","veiled head"],"epithets":["Quirinus","Ianus Quirinus"],"sources":["Livy 1.16","Ovid, Fasti 2.475-512","Ovid, Metamorphoses 14.805-828","Ennius, Annales"],"groups":["archaic_triad","deified_mortals"]},{"id":"orcus","name":"Orcus","latin":"Orcus","greek":"loosely Hades","tier":"chthonic","rank":5,"gender":"m","origin":"italic","domains":["death itself","the pit","the punishment of broken oaths"],"summary":"Death as the Italian countryside imagined it — grim, hairy, devouring; not a king of the dead but the act of dying.","deeds":["Devours the dead rather than ruling them; Virgil's fauces Orci, the jaws of Orcus, is the mouth of the underworld itself.","Punishes perjury: an oath sworn falsely was said to be owed to Orcus."],"state":"Native Italic, not a translation of Hades — and included in Varro's twenty Di Selecti, which shows the state took him seriously. Three overlapping Latin names must be kept apart: Orcus (death as the pit, folk-level, and the ancestor of Italian orco and English 'ogre'), Dis Pater (the wealthy one, with formal state cult), and Pluto (a Greek loan). Roman peasants feared Orcus; Roman priests sacrificed to Dis.","temple":"No temple","festival":"None in the state calendar","priest":"None","symbols":["hairy giant","the open pit","the hammer (Etruscan Charun)"],"epithets":["Orcus"],"sources":["Varro in Augustine, De Civitate Dei 7.2","Virgil, Aeneid 6.273","Horace, Odes 2.18.34"],"groups":["di_selecti","underworld"]},{"id":"genius","name":"Genius","latin":"Genius","greek":"none — uniquely Roman","tier":"collective","rank":6,"gender":"m","origin":"italic","domains":["the life-force of a man","the generative power of a household, a place, a people"],"summary":"Every man had one, born with him and dying with him — and swearing falsely by the emperor's Genius was treason.","deeds":["Honoured on a man's birthday with unmixed wine, incense and cakes — a rite performed for a living person, which is unlike almost anything else in Roman religion.","The female counterpart is a woman's Iuno; every person therefore had a divine double of their own sex.","Extended outward without limit: Genius loci, the spirit of a place; Genius populi Romani, the life-force of the Roman people; the Genius of a legion, a guild, a market."],"state":"One of Varro's twenty Di Selecti — an abstraction ranked above most Olympians. Augustus fused the Genius of the emperor with the crossroads cult of the Lares, so that every neighbourhood shrine in Rome honoured his household spirit. Oaths by the emperor's Genius were legally binding, and refusing to swear one was a capital offence — the specific charge on which Christians were most often tried.","temple":"Every household lararium; every crossroads shrine","festival":"Each person's own birthday; Compitalia (with the Lares)","priest":"The paterfamilias; the vicomagistri at the crossroads","symbols":["serpent","cornucopia","patera","toga with veiled head"],"epithets":["Genius Augusti","Genius loci","Genius populi Romani"],"sources":["Varro in Augustine, De Civitate Dei 7.2","Horace, Epistles 2.2.187-189","Pliny, Letters 10.96"],"groups":["di_selecti","household"]},{"id":"cupid","name":"Cupid / Amor","latin":"Cupido, Amor","greek":"Eros","tier":"major","rank":6,"gender":"m","origin":"greek","domains":["desire","erotic love"],"summary":"A cosmic force in philosophy and a malicious child in poetry — Rome kept both versions and never reconciled them.","deeds":["Sent by Venus to Carthage disguised as Ascanius, he sits in Dido's lap and breathes the poison into her — the most calculated cruelty in the Aeneid.","At Venus' order shoots Pluto so that he seizes Proserpina; Ovid makes the whole seasonal myth a byproduct of Venus wanting more territory.","Shoots Apollo with a gold arrow and Daphne with a lead one, after Apollo mocked his archery.","Falls in love with Psyche himself after scratching himself on his own arrow; Jupiter finally makes her immortal, and their child is Voluptas — Pleasure."],"state":"Almost nothing in state cult, and everywhere in Roman art. His dynastic use was real: as Venus' son he is the Julian family's kin, and a small Cupid rides a dolphin at the ankle of the Augustus of Prima Porta to remind the viewer whose descendant is speaking. Cicero notes that Romans distinguished three different Cupids by parentage.","temple":"No independent state temple; worshipped with Venus","festival":"None of his own","priest":"None","symbols":["bow and quiver","gold and lead arrows","wings","torch","blindfold"],"epithets":["Amor","Cupido"],"sources":["Virgil, Aeneid 1.657-722","Ovid, Metamorphoses 1.452-567, 5.362-384","Apuleius, Metamorphoses 4-6","Cicero, De Natura Deorum 3.59-60"],"groups":["julian_line"]},{"id":"fortuna","name":"Fortuna","latin":"Fortuna","greek":"Tyche","etruscan":"loosely Nortia","tier":"abstract","rank":7,"gender":"f","origin":"italic","domains":["luck and chance","fate","fertility","oracles"],"summary":"Chance made into a goddess and then given a wheel — the most consulted oracle in Italy, and the most feared idea in Roman thought.","deeds":["Loved the king Servius Tullius and came to him through his bedroom window; when he was murdered, her statue in the Forum Boarium was said to have veiled its own face.","Her oracle of lots at Praeneste began when a man split a rock at the goddess' command and found inside it oak tablets inscribed with answers.","Her wheel raises and destroys; the phrase Fortuna caeca — blind Fortune — runs through Latin literature from Cicero to Boethius.","Fortuna Muliebris commemorates the Roman matrons who went out to Coriolanus' camp and turned him back when the Senate could not."],"state":"The oracles of Fortuna Primigenia at Praeneste and Fortuna at Antium were the most consulted in Italy — even emperors sent to them. Fors Fortuna on 24 June was a rowdy plebeian holiday, everyone rowing garlanded boats down the Tiber and drinking. Fortuna Redux, whose altar marked Augustus' safe return in 19 BC, became a standing imperial cult title: the emperor's luck was public property.","temple":"Fortuna and Mater Matuta in the Forum Boarium (attributed to Servius Tullius); Fors Fortuna across the Tiber; the vast sanctuary of Fortuna Primigenia at Praeneste (2nd c. BC); Fortuna Huiusce Diei, 101 BC","festival":"Fortuna Primigenia, 25 May; Fors Fortuna, 24 June; Fortuna Muliebris, 6 July; Fortuna Redux, 12 October","priest":"sortilegi (lot-drawers) at Praeneste","symbols":["wheel","rudder","globe","cornucopia","blindfold"],"epithets":["Primigenia","Publica","Redux","Huiusce Diei","Muliebris","Virilis","Augusta"],"sources":["Ovid, Fasti 6.569-636","Cicero, De Divinatione 2.85-87","Livy 2.40","Plutarch, De Fortuna Romanorum"],"groups":["virtues"]},{"id":"victoria","name":"Victoria","latin":"Victoria","greek":"Nike","tier":"abstract","rank":7,"gender":"f","origin":"italic","domains":["victory","the outcome of war"],"summary":"The daughter of a Titan who took Jupiter's side in the Titanomachy — and whose altar in the Senate House became the last battlefield of Roman paganism.","deeds":["Daughter of Pallas and Styx; she and her siblings Vis, Cratos and Zelus side with Jupiter against the Titans and never leave his side again.","Stands behind the triumphing general in his chariot, holding the crown over his head, while a slave repeats that he is only a man.","Her image standing on a globe became the visual shorthand of world empire on Roman coinage for four centuries."],"state":"The Altar of Victory, set up by Octavian in the Curia in 29 BC after Actium, was where every senator burned a grain of incense before business. Gratian had it removed in 382; Symmachus' appeal to have it restored in 384, answered by Ambrose, is the defining confrontation between the old religion and the new — an argument about a single altar that both sides understood to be about everything.","temple":"Temple on the Palatine, dedicated 294 BC by L. Postumius Megellus (it sheltered the Magna Mater's black stone from 204 to 191 BC); Victoria Virgo, 193 BC","festival":"1 August (the two Victories); 17 July","priest":"None","symbols":["wings","laurel wreath","palm branch","globe","trophy"],"epithets":["Victoria Augusta","Victoria Virgo"],"sources":["Livy 10.33","Symmachus, Relatio 3","Ambrose, Epistles 17-18"],"groups":["virtues"]},{"id":"bellona","name":"Bellona","latin":"Bellona, Duellona","greek":"Enyo","tier":"major","rank":6,"gender":"f","origin":"italic","domains":["war","battle frenzy","the formal declaration of war"],"summary":"War as procedure — her temple precinct was where Rome legally declared war and where generals waiting for a triumph had to stay outside the city.","deeds":["Drives Mars' chariot into battle; variously his sister, wife, daughter or charioteer, and the Romans never settled which.","Beside her temple stood the columna bellica, a pillar representing enemy soil: the fetial priest declared war by hurling a spear over it — a legal fiction that let Rome perform the ancient border ritual against enemies a thousand miles away.","As the Anatolian Ma-Bellona, imported under Sulla, she was served by bellonarii who gashed their own arms and legs and sprinkled the blood in prophecy."],"state":"Functionally the Senate's diplomatic annexe. Because foreign ambassadors and generals holding imperium could not cross the pomerium, the Senate met them in Bellona's precinct outside it. The declaration of war, the reception of enemy envoys, and the granting of triumphs all happened on her ground.","temple":"Temple near the Circus Flaminius, vowed 296 BC by Appius Claudius Caecus during the Samnite war","festival":"3 June","priest":"fetiales at the columna bellica; bellonarii (Ma-Bellona)","symbols":["bloody whip","torch","spear","helmet"],"epithets":["Bellona Pulvinensis","Nerio"],"sources":["Livy 10.19","Ovid, Fasti 6.199-208","Cassius Dio 50.4"],"groups":[]},{"id":"faunus","name":"Faunus","latin":"Faunus","greek":"loosely Pan","tier":"native","rank":6,"gender":"m","origin":"italic","domains":["forests and flocks","wild fertility","prophetic voices","panic"],"summary":"The voice in the woods — an oracular god you consulted by sleeping on a sheepskin in his grove and waiting for a dream.","deeds":["Gives the oracle from his grove at Albunea that stops the Latin war before it starts: Latinus must not marry his daughter to a Latin, but to a stranger coming from abroad (Aeneid 7.81-101).","As Fatuus, the speaker, he answers questions from the darkness to those who sleep on the fleeces of sacrificed sheep in his precinct.","Caught by Numa and Picus, who drug the spring where they drink with wine and honey and then bind them, to force out of them the way to draw down Jupiter's lightning safely.","Father of Latinus by the nymph Marica, and so the ancestor of the royal house Aeneas marries into."],"state":"The Lupercalia is his festival and one of Rome's strangest and most durable rites: young men, naked but for goatskins, ran a circuit of the Palatine striking bystanders — especially women hoping to conceive — with thongs cut from the sacrificed goats. It was still being celebrated in the AD 490s, five hundred years after Augustus. It was at the Lupercalia of 44 BC that Antony offered Caesar the diadem.","temple":"Temple on the Tiber Island, dedicated 194 BC","festival":"Lupercalia, 15 February; Faunalia, 5 December; 13 February","priest":"Luperci (two colleges, Quinctiales and Fabiani)","symbols":["goat's legs and horns","pipes","wolfskin","laurel"],"epithets":["Lupercus","Inuus","Fatuus","Faunus Pater"],"sources":["Virgil, Aeneid 7.81-101","Ovid, Fasti 2.267-452, 3.291-348","Livy 1.5"],"groups":["woodland"]},{"id":"silvanus","name":"Silvanus","latin":"Silvanus","greek":"loosely Pan","etruscan":"Selvans","tier":"native","rank":5,"gender":"m","origin":"italic","domains":["uncultivated woodland","estate boundaries","woodcutting","herds","soldiers"],"summary":"The god the Roman state never officially recognised and ordinary Romans worshipped more than almost anyone else.","deeds":["Loved the boy Cyparissus, who accidentally killed his pet stag and grieved until he was turned into the cypress — the tree Silvanus carries ever after.","After the battle of the Arsia against the Etruscans, a terrible voice from the Arsian wood counted the dead and declared Rome the winner by one man; the Etruscans fled in the night. Livy says the voice was Silvanus'.","His three aspects mapped the whole of a Roman's world: domesticus at the house, agrestis at the farm, orientalis at the wild boundary."],"state":"He has no temple in the state calendar, no festival, no flamen — and is among the most frequently named gods in surviving Latin inscriptions, especially from slaves, freedmen, soldiers and small farmers. He is the clearest evidence that the official calendar is not the same thing as what Romans actually believed. Women were excluded from his rites.","temple":"Hundreds of small private and guild shrines; no major public temple","festival":"No fixed calendar date (private rites)","priest":"None; private collegia","symbols":["pruning knife","cypress","pine","dog","basket of fruit"],"epithets":["Domesticus","Agrestis","Sanctus","Dendrophorus"],"sources":["Livy 2.7","Virgil, Aeneid 8.600-602","Cato, De Agricultura 83","CIL passim"],"groups":["woodland"]},{"id":"flora","name":"Flora","latin":"Flora","greek":"Chloris","tier":"native","rank":5,"gender":"f","origin":"sabine","domains":["blossom and flowering","spring","grain in flower","prostitutes"],"summary":"Goddess of the moment when a plant flowers — not of the fruit but of the promise — and patron of the rowdiest festival in Rome.","deeds":["Was the nymph Chloris until Zephyrus the west wind seized her and, in compensation, made her mistress of all flowers; Ovid lets her tell the story herself and she is dry about it.","Gives Juno the magic flower from the fields of Olenus that lets her conceive Mars without any man — which makes Flora the effective cause of Mars' birth, and thus of Rome.","Her games were instituted after the Sibylline Books were consulted during a drought, and made permanent after the crops failed again the year the Romans skipped them."],"state":"She had her own flamen Floralis, one of the twelve minor flamines — proof of very high antiquity even though her temple is late. Her temple was built with fines levied on graziers who had illegally pastured cattle on public land. The Floralia was the most explicitly licentious festival in the calendar: mimes performed by prostitutes, hares and goats released into the crowd, coloured clothes worn in place of the toga, and — famously — the actresses stripped when the audience demanded it, which is why Cato left the theatre so the show could go on.","temple":"Temple near the Circus Maximus, vowed after the drought of 241/238 BC","festival":"Floralia / Ludi Florales, 28 April - 3 May","priest":"flamen Floralis (flamen minor)","symbols":["flowers","garlands","honey"],"epithets":["Flora Mater"],"sources":["Ovid, Fasti 5.183-378","Pliny, Natural History 18.286","Valerius Maximus 2.10.8"],"groups":["minor_flamens"]},{"id":"pomona","name":"Pomona","latin":"Pomona","greek":"none — no Greek equivalent","tier":"native","rank":5,"gender":"f","origin":"italic","domains":["orchard fruit","fruit trees","grafting and pruning"],"summary":"The only major Roman deity with no Greek counterpart at all, and the heroine of the one myth invented entirely in Latin.","deeds":["Cares nothing for the woods or rivers — only for her orchard. She carries a pruning hook rather than a spear, and she locks the gate against every suitor.","Vertumnus courts her in a run of disguises — reaper, ploughman, soldier, fisherman — and finally as an old woman who sits down, argues his case, tells her the cautionary tale of Iphis and Anaxarete, and kisses her rather too warmly for a grandmother.","When he drops the disguise and stands there as himself, she yields at once, and the orchard opens."],"state":"She possessed her own flamen Pomonalis — the most junior of all the flamines, and yet a flamen, which means the state priesthood was organised around her before anyone thought to build her a temple. That combination, high priestly antiquity with almost no public cult, is the signature of a genuinely archaic Italic deity.","temple":"The Pomonal, a sacred grove on the road to Ostia","festival":"No calendar festival","priest":"flamen Pomonalis (flamen minor)","symbols":["pruning knife","platter heaped with fruit","apples"],"epithets":["Pomona"],"sources":["Ovid, Metamorphoses 14.623-771","Varro, De Lingua Latina 7.45"],"groups":["minor_flamens"]},{"id":"vertumnus","name":"Vertumnus","latin":"Vertumnus, Vortumnus","greek":"loosely Proteus","etruscan":"Voltumna","tier":"native","rank":5,"gender":"m","origin":"etruscan","domains":["the turning of the seasons","change","ripening","gardens","trade"],"summary":"The god of turning — an Etruscan national deity captured by Rome and set up as a statue in the Tuscan quarter, redressed for every season.","deeds":["Changes shape at will to court Pomona, and finally wins her by argument rather than by force.","As Voltumna he was the chief god of the Etruscan League, whose sanctuary the fanum Voltumnae was the confederacy's parliament.","When Volsinii fell in 264 BC he was formally invited to Rome by evocatio — a national god taken as the ultimate war trophy."],"state":"The clearest surviving case of evocatio applied to an entire people's god. His bronze statue in the Vicus Tuscus was a Roman landmark, redecorated with each turn of the year — Propertius has the statue itself speak and explain its many costumes. He is Rome's absorption of Etruria, standing on a street corner.","temple":"Temple on the Aventine, in place by 264 BC; the famous bronze statue in the Vicus Tuscus","festival":"Vortumnalia, 13 August","priest":"None","symbols":["pruning knife","fruit","garland","changing costume"],"epithets":["Vortumnus"],"sources":["Ovid, Metamorphoses 14.623-771","Propertius 4.2","Varro, De Lingua Latina 5.46"],"groups":[]},{"id":"terminus","name":"Terminus","latin":"Terminus","greek":"loosely Zeus Horios","tier":"native","rank":6,"gender":"m","origin":"italic","domains":["boundary stones","property limits","the inviolability of borders"],"summary":"A boundary stone that was also a god — and the one deity who refused to move for Jupiter, which Rome took as the guarantee that its empire would never shrink.","deeds":["When Tarquin cleared the Capitol to build Jupiter's temple, every god consented to be deconsecrated and moved — except Terminus, and Juventas. The augurs declared this the best omen in Roman history: the borders would never recede and the state would stand forever.","Numa is said to have instituted his cult to end violent land disputes, decreeing death for anyone who ploughed up a boundary stone — the man and his oxen alike became sacer, forfeit to the god.","The Terminalia was celebrated at the stone itself: the two neighbours garlanded their own side, poured honey, wine and the blood of a victim into a pit beneath it, and then ate together."],"state":"The perfect Roman god: a clause of property law given a face. His stone stayed inside the cella of Jupiter Optimus Maximus with a hole left open in the roof above it, because Terminus must always stand under the open sky — the state's greatest temple was built with a hole in it out of respect for a rock. 23 February was the last day of the pre-Julian year, before the intercalary days were inserted — which is why a festival of boundaries sits exactly there.","temple":"No separate temple; his stone stood within the cella of Jupiter Optimus Maximus, open to the sky","festival":"Terminalia, 23 February; a public rite at the sixth milestone on the Via Laurentina","priest":"The neighbouring landowners themselves; pontiffs at the public rite","symbols":["the boundary stone","the herm"],"epithets":["Terminus"],"sources":["Ovid, Fasti 2.639-684","Livy 1.55","Dionysius of Halicarnassus 2.74"],"groups":[]},{"id":"consus","name":"Consus","latin":"Consus","greek":"loosely Poseidon Hippios","tier":"native","rank":5,"gender":"m","origin":"italic","domains":["stored grain","the underground granary","secret counsel"],"summary":"The god of the buried grain-pit, whose altar was kept under earth and uncovered only twice a year — and whose festival was the pretext for the rape of the Sabine women.","deeds":["Romulus proclaimed games in his honour specifically to lure the neighbouring Sabines into Rome with their families; at the signal the young Romans seized the unmarried women. One tradition says the god himself advised it.","His altar at the first turning-post of the Circus Maximus was kept buried under earth all year, exactly like the grain-pit it represents, and dug out only on his feast days."],"state":"His rites were performed by the flamen Quirinalis together with the Vestals — an extraordinarily senior priesthood for a supposedly minor god, which marks how much archaic Rome cared about stored food. At the Consualia horses, mules and donkeys were garlanded and given the day off work, and races were run in the Circus above his buried altar.","temple":"Subterranean altar at the meta prima of the Circus Maximus; temple on the Aventine, 272 BC","festival":"Consualia, 21 August and 15 December; also 7 July","priest":"flamen Quirinalis with the Vestals","symbols":["the buried altar","grain","garlanded draught animals"],"epithets":["Consus Consivius"],"sources":["Livy 1.9","Ovid, Fasti 3.199-228","Dionysius of Halicarnassus 2.31","Tertullian, De Spectaculis 5"],"groups":[]},{"id":"portunus","name":"Portunus","latin":"Portunus","greek":"Palaemon","tier":"native","rank":4,"gender":"m","origin":"italic","domains":["keys and doors","harbours","warehouses","livestock"],"summary":"Guardian of the river port through which Rome's grain arrived — a two-faced god of the opening, like Janus but for water.","deeds":["Assimilated to Palaemon, the deified boy Melicertes who leapt into the sea with his mother Ino and became a protector of sailors.","Guarded the Portus Tiberinus, the river harbour at the Forum Boarium on which the city's food supply depended.","At his festival keys were thrown into a fire for luck — a rite nobody in the late Republic could fully explain."],"state":"He had his own flamen Portunalis, whose specific and peculiar duty was to oil the sacred spear of Quirinus. Roman priesthoods often survived with duties detached from any explanation, and this is the standard example.","temple":"Temple of Portunus in the Forum Boarium beside the Pons Aemilius — the surviving building is c. 100 BC on a 3rd-century foundation, and is one of the best-preserved temples in Rome","festival":"Portunalia, 17 August","priest":"flamen Portunalis (flamen minor)","symbols":["keys","two faces","ship's prow"],"epithets":["Portunus Pater"],"sources":["Varro, De Lingua Latina 6.19","Ovid, Fasti 6.545-550","Festus 217L"],"groups":["minor_flamens","sea"]},{"id":"salacia","name":"Salacia","latin":"Salacia","greek":"Amphitrite","tier":"native","rank":4,"gender":"f","origin":"italic","domains":["salt water","the open sunlit sea","springs"],"summary":"Neptune's Roman consort — not Amphitrite, but a native goddess of the salt sea, paired with Venilia of the incoming wave.","deeds":["Fled Neptune's courtship into the depths of the ocean; a dolphin found her and persuaded her back, and Neptune set the dolphin among the stars as the constellation Delphinus.","Bore Triton, the herald of the sea."],"state":"Her pairing with Venilia is the classic illustration of a Roman habit: instead of telling stories about the sea, Romans split it into functions and gave each a name — salt depth and breaking wave, each with its own goddess. Varro and Augustine both cite her as Neptune's paredra.","temple":"No independent temple; honoured with Neptune","festival":"Neptunalia, 23 July","priest":"None","symbols":["dolphin","seaweed crown"],"epithets":["Salacia Neptuni"],"sources":["Varro, De Lingua Latina 5.72","Augustine, De Civitate Dei 7.22","Gellius, Attic Nights 13.23"],"groups":["sea"]},{"id":"vediovis","name":"Vediovis","latin":"Vediovis, Veiovis","greek":"loosely young Apollo","etruscan":"Veive","tier":"native","rank":4,"gender":"m","origin":"italic","domains":["plague-averting","chthonic and volcanic power","the negative of Jupiter"],"summary":"The anti-Jupiter — a beardless youth with arrows and a she-goat, whose nature Romans themselves could no longer explain.","deeds":["Gellius reads the prefix ve- as negation, making him Jupiter's malign or diminished counterpart — a small Jupiter, or an un-Jupiter.","She-goats were sacrificed to him humano ritu, 'in the manner of a human being', to draw plague away from the people onto the animal.","His temple stood between the two summits of the Capitol, on the site where Romulus was said to have opened the asylum that first populated Rome with fugitives."],"state":"The best evidence that Rome kept archaic rites long after anyone knew what they meant. Ovid, Gellius and Varro each offer a different explanation of who he was and all three disagree. The state performed his sacrifices correctly and on schedule anyway — which is the real Roman attitude to religion: get the ritual right, and the theology can look after itself.","temple":"Temple between the two summits of the Capitol, vowed 200, dedicated 192 BC — remains survive under the Palazzo Senatorio; a second temple on the Tiber Island, 194 BC","festival":"1 January, 7 March, 21 May","priest":"None recorded","symbols":["arrows","she-goat","beardless youth"],"epithets":["Vediovis","Veiovis"],"sources":["Gellius, Attic Nights 5.12","Ovid, Fasti 3.429-448","Livy 31.21, 34.53"],"groups":[]},{"id":"summanus","name":"Summanus","latin":"Summanus","greek":"loosely Pluto","tier":"native","rank":3,"gender":"m","origin":"italic","domains":["nocturnal thunder and lightning"],"summary":"The god who threw lightning at night, as against Jupiter who threw it by day — a distinction Roman divination took entirely seriously.","deeds":["In 278 BC a bolt struck the head off his terracotta statue on the roof of Jupiter's Capitoline temple, and the head was later found in the Tiber; the prodigy was so alarming that Rome vowed him a temple of his own.","Any place struck by lightning at night had to be expiated to Summanus; by day, to Jupiter. Getting it wrong meant the expiation did not count."],"state":"Shows how precise Roman lightning-lore was: the pontiffs and Etruscan haruspices had to identify which god had sent a given bolt before it could be ritually buried, and the day/night division was a formal category of divination. His offering was a wheel-shaped cake of flour, milk and honey — summanalia.","temple":"Temple near the Circus Maximus, dedicated 20 June 278 BC during the war with Pyrrhus","festival":"20 June","priest":"pontiffs and haruspices","symbols":["night lightning","wheel-cakes","black victims"],"epithets":["Dis Summanus"],"sources":["Ovid, Fasti 6.729-732","Pliny, Natural History 2.138","Livy, Periochae 14"],"groups":[]},{"id":"bona_dea","name":"Bona Dea","latin":"Bona Dea","greek":"none","tier":"native","rank":5,"gender":"f","origin":"italic","domains":["women's health and fertility","healing","chastity"],"summary":"The Good Goddess, whose real name could not be spoken and whose December rite no man could witness — a rule Clodius broke in 62 BC and brought down the Republic's politics with him.","deeds":["Identified variously with Fauna, Faunus' wife or daughter; in one story Faunus beat her to death with myrtle rods for drinking wine, which is why myrtle and wine were both handled strangely in her cult (wine was present but called 'milk', and its jar a 'honey pot').","Her December rite was held at night in the house of a serving magistrate, conducted by his wife and the Vestals, with every male — including statues and paintings of men — removed or veiled.","In 62 BC Publius Clodius Pulcher infiltrated the rite in the house of Julius Caesar, dressed as a woman. The scandal produced a sacrilege trial, Caesar's remark that his wife must be above suspicion, and the political enmity with Cicero that shaped the next decade."],"state":"One of the very few Roman cults from which men were absolutely excluded, and one where Rome's most powerful women — the consul's wife, the Vestals — acted with full ritual authority. Snakes were kept in her precinct and healing herbs dispensed from it.","temple":"Temple on the Aventine, below the Saxum; the annual rite held in a magistrate's house","festival":"1 May (temple day); the nocturnal rite in early December","priest":"Women only; the Vestals and the magistrate's wife","symbols":["snake","cornucopia","wine jar called a honey-pot","myrtle (forbidden)"],"epithets":["Fauna","Damia","Bona Dea Subsaxana"],"sources":["Cicero, De Haruspicum Responsis","Plutarch, Caesar 9-10","Ovid, Fasti 5.148-158","Macrobius, Saturnalia 1.12"],"groups":["woodland"]},{"id":"carmenta","name":"Carmenta","latin":"Carmenta, Carmentis","greek":"none","tier":"native","rank":5,"gender":"f","origin":"italic","domains":["childbirth","prophecy","song and spells"],"summary":"A prophetic nymph who arrived in Italy before Troy fell, mother of Evander — and one of the few goddesses with her own flamen.","deeds":["Brings her son Evander from Arcadia to the Palatine sixty years before the Trojan War, and prophesies the future greatness of the site while it is still pasture.","Her name comes from carmen, a song or spell — prophecy and poetry were one word in early Latin.","Her two attendants, Antevorta (or Porrima) and Postvorta, look forward and back: they attend births in which the child comes head-first or feet-first."],"state":"She has a flamen Carmentalis and two festival days, which places her among the oldest layer of Roman cult. The Porta Carmentalis was named for her, and one of its arches — the Porta Scelerata — was considered so unlucky after the Fabii marched out through it to be massacred that no one used it again.","temple":"Shrine at the foot of the Capitol beside the Porta Carmentalis","festival":"Carmentalia, 11 and 15 January","priest":"flamen Carmentalis (flamen minor)","symbols":["leather, which was forbidden in her shrine","song","the birth-chair"],"epithets":["Carmentis","Porrima","Postverta"],"sources":["Ovid, Fasti 1.461-586","Livy 1.7","Virgil, Aeneid 8.333-341"],"groups":["minor_flamens","camenae"]},{"id":"juturna","name":"Juturna","latin":"Iuturna","greek":"none","tier":"native","rank":5,"gender":"f","origin":"italic","domains":["springs and fountains","healing waters"],"summary":"Given immortality as compensation for rape, and made to watch her brother die — Virgil's cruellest study of what the gods' gifts cost.","deeds":["Raped by Jupiter, who gives her godhead and lordship over all waters in payment.","Disguised as Turnus' charioteer Metiscus she keeps her brother out of Aeneas' reach for a whole book, and breaks the truce by inciting Tolumnius to throw the first spear.","When Jupiter sends a Dira to drive her off, she veils her head, cries out that immortality is worthless if she must outlive him, and sinks into her own river."],"state":"Her pool in the Forum, the Lacus Juturnae, is where Castor and Pollux were seen watering their horses after Lake Regillus, and its water was used in state sacrifices and thought to heal the sick. The Juturnalia on 11 January was the festival of the men who maintained Rome's water supply.","temple":"The Lacus Juturnae in the Roman Forum; a temple in the Campus Martius","festival":"Juturnalia, 11 January","priest":"None","symbols":["spring water","the fountain basin"],"epithets":[],"sources":["Virgil, Aeneid 12.134-160, 12.843-886","Ovid, Fasti 1.463-464","Varro, De Lingua Latina 5.71"],"groups":["nymphs"]},{"id":"tiberinus","name":"Tiberinus","latin":"Tiberinus, Pater Tiberis","greek":"none","tier":"native","rank":5,"gender":"m","origin":"italic","domains":["the river Tiber","the city's water"],"summary":"Rome's own river, deified — the god who told Aeneas he had arrived, and who caught Horatius when he jumped.","deeds":["Rises from his poplars in a dream to Aeneas, tells him this is the promised land, and gives him the sign: a white sow with thirty piglets under the oaks, marking the site of Alba Longa and its thirty years (Aeneid 8.31-65).","Stills his own current so the Trojan ships can row upstream against him without effort.","Bore Horatius Cocles up in full armour when he leapt from the broken bridge, after Horatius prayed to him by name.","Named for the Alban king Tiberinus, who drowned in the river then called the Albula."],"state":"The Argei rite — twenty-seven rush puppets thrown from the Pons Sublicius into the river by the Vestals each 14 May — is one of Rome's most archaic and least understood ceremonies; ancient writers guessed it replaced human sacrifice. The Tiber was also where the refuse of Vesta's temple was carried, and where prodigies and executed criminals were consigned.","temple":"Shrine on the Tiber Island; altars along the banks","festival":"Tiberinalia, 8 December; the Argei, 14 May; 17 June","priest":"Pontiffs and Vestals at the Argei","symbols":["poplar","reeds","urn pouring water","the white sow"],"epithets":["Pater Tiberinus","Volturnus (older name)"],"sources":["Virgil, Aeneid 8.31-101","Livy 2.10","Ovid, Fasti 5.621-662"],"groups":["rivers"]},{"id":"anna_perenna","name":"Anna Perenna","latin":"Anna Perenna","greek":"none","tier":"native","rank":5,"gender":"f","origin":"italic","domains":["the circle of the year","the returning new year"],"summary":"The goddess of the year coming round again — worshipped with a drunken picnic on the riverbank, and, in Ovid's telling, secretly Dido's sister.","deeds":["Ovid identifies her with Anna, Dido's sister: after Carthage falls she is shipwrecked in Latium, taken in by Aeneas, warned in a dream by Dido's ghost that Lavinia means to kill her, and carried off by the river Numicius as its nymph — Anna the perennial.","As a goddess she plays a joke on Mars: he asks her to arrange his marriage to Minerva, and she turns up herself under the bridal veil. The obscene songs sung at her festival are said to commemorate the laughter."],"state":"Her festival on the Ides of March was one of the happiest days in the Roman year — the plebs camped in the grove on the Via Flaminia, drank a cup of wine for each year they hoped to live, sang filthy songs and went home unable to walk. In 44 BC it fell on the same day as Caesar's assassination.","temple":"Sacred grove at the first milestone of the Via Flaminia","festival":"Ides of March, 15 March","priest":"None","symbols":["wine cups","riverbank","the ring of the year"],"epithets":["Anna Perenna"],"sources":["Ovid, Fasti 3.523-710","Macrobius, Saturnalia 1.12.6"],"groups":["deified_mortals"]},{"id":"libitina","name":"Libitina","latin":"Libitina","greek":"none","tier":"chthonic","rank":4,"gender":"f","origin":"italic","domains":["funerals","burial","corpses"],"summary":"Death as an administrative fact — her grove was the undertakers' headquarters and, effectively, Rome's registry of deaths.","deeds":["Every death in Rome was registered at her grove with a coin, which is why her records served as the city's mortality statistics — Suetonius reports 30,000 entries in one autumn under Nero.","Undertakers (libitinarii) were hired at her precinct, and funeral equipment stored there.","Varro derived her name from lubere, 'to please', which produced the striking identification Venus Libitina — desire and death sharing one name."],"state":"Wholly Roman, and a good example of how Roman religion absorbed administration. Horace's boast that part of him would escape Libitina (Odes 3.30) means simply: I will not be filed.","temple":"The lucus Libitinae, a grove outside the city","festival":"None fixed","priest":"libitinarii","symbols":["the funeral couch","the register","the coin"],"epithets":["Venus Libitina"],"sources":["Horace, Odes 3.30.6-7","Livy 40.19, 41.21","Suetonius, Nero 39","Dionysius of Halicarnassus 4.15"],"groups":["underworld"]},{"id":"mater_matuta","name":"Mater Matuta","latin":"Mater Matuta","greek":"Ino / Leucothea","tier":"native","rank":4,"gender":"f","origin":"italic","domains":["the dawn","ripening","childbirth","mariners"],"summary":"An Italic dawn-mother whose festival belonged to matrons — and at which each woman prayed not for her own children but for her sister's.","deeds":["Identified by Romans with Ino/Leucothea, the mortal woman who leapt into the sea with her son and became a goddess who rescues sailors.","At the Matralia, matrons brought their nieces and nephews into the temple and prayed for them; their own children were left outside. A slave woman was ceremonially led in and beaten out of the temple with rods."],"state":"Note the standard modern error: Romans equated Mater Matuta with Ino/Leucothea, not with Aurora, despite the dawn associations. Her twin temple with Fortuna in the Forum Boarium, credited to Servius Tullius, is one of the oldest excavated sacred sites in Rome.","temple":"Twin temple with Fortuna in the Forum Boarium, attributed to Servius Tullius","festival":"Matralia, 11 June","priest":"Univirae — matrons married only once","symbols":["dawn light","toasted cakes","the child in arms"],"epithets":["Mater Matuta"],"sources":["Ovid, Fasti 6.473-568","Livy 5.19","Plutarch, Roman Questions 16-17"],"groups":[]},{"id":"feronia","name":"Feronia","latin":"Feronia","greek":"none","tier":"native","rank":4,"gender":"f","origin":"sabine","domains":["wild places","freedmen and liberty","springs","trade"],"summary":"The goddess of manumission — slaves sat on a stone in her temple and stood up free, with a cap on their heads.","deeds":["In her sanctuary at Terracina a stone bore the inscription: let deserving slaves sit down and rise up free.","Her grove at Capena hosted a great annual fair where Sabines, Latins and Etruscans traded under truce.","Her worshippers were said to walk barefoot over burning coals in her honour without harm."],"state":"A Sabine goddess who became the specific patroness of freedmen — one of the largest and most economically important groups in Roman society, and one that had almost no other religious home. Her cult marks the point where Roman religion touched the machinery of slavery.","temple":"Sanctuary in the grove at Capena; temple at Terracina","festival":"13 November","priest":"None","symbols":["the freedman's cap (pileus)","the stone seat","flowers"],"epithets":["Feronia"],"sources":["Livy 1.30, 26.11","Virgil, Aeneid 7.800","Servius on Aeneid 8.564"],"groups":[]},{"id":"nerio","name":"Nerio","latin":"Nerio, Neriene","greek":"none","tier":"native","rank":3,"gender":"f","origin":"sabine","domains":["valour","the strength of Mars"],"summary":"The archaic consort of Mars, whose name is the old Sabine word for strength — a goddess who is really an attribute given a marriage.","deeds":["Her name comes from the Sabine nerio, manly strength; Gellius says the old formula was Nerio Martis, the valour of Mars, and that the Romans later mistook the possessive for a wife.","In one comic tradition Anna Perenna impersonates Minerva to trick Mars at his wedding — the joke depends on everyone knowing Mars' real consort was this obscure abstraction."],"state":"A neat illustration of how Roman gods multiply: an attribute of a god acquires a name, the name acquires a gender, and the gender acquires a marriage. Half the Roman pantheon can be described this way.","temple":"Honoured with Mars","festival":"23 March (Tubilustrium)","priest":"None","symbols":["spear","the strength of the war god"],"epithets":["Neriene","Nerio Martis"],"sources":["Gellius, Attic Nights 13.23","Plautus, Truculentus 515"],"groups":[]},{"id":"picus","name":"Picus","latin":"Picus","greek":"none","tier":"native","rank":4,"gender":"m","origin":"italic","domains":["augury","the woodpecker","the early kingship of Latium"],"summary":"The first king of Latium and a master augur, turned into a woodpecker by Circe for refusing her — and the bird that helped feed Romulus and Remus.","deeds":["Son of Saturn, father of Faunus, grandfather of Latinus: the divine root of the Latin royal line.","Rejects Circe while out hunting boar; she turns him into a purple-crested woodpecker and his companions into beasts. His name is the Latin word for the bird, and the bird was a bird of omen.","Trapped with Faunus by Numa, who drugs their spring, to extract the secret of drawing down lightning safely.","His wooden effigy stood in Latinus' ancestral hall among the images of Italus, Sabinus and Saturn, when the Trojan embassy arrived."],"state":"The woodpecker is Mars' bird, and in several versions it brings food to the exposed twins alongside the she-wolf. Picus sits exactly at the join between Italic augury, the Latin king-list and the foundation legend.","temple":"No temple; a sacred grove near Rome","festival":"None","priest":"augurs (the woodpecker as a bird of omen)","symbols":["woodpecker","augur's staff","purple crest"],"epithets":[],"sources":["Ovid, Metamorphoses 14.320-434","Virgil, Aeneid 7.45-49, 7.187-191","Ovid, Fasti 3.291-348"],"groups":["latin_kings"]},{"id":"canens","name":"Canens","latin":"Canens","greek":"none","tier":"native","rank":3,"gender":"f","origin":"italic","domains":["song","the voice"],"summary":"Daughter of Janus, whose singing moved stones and animals — and who, looking for her lost husband, sang herself out of existence.","deeds":["Her voice could move rocks, bend trees and stop wild beasts; her name means simply 'singing'.","When Picus vanished she searched six days and six nights without food or sleep, and at last, on the bank of the Tiber, sang a last lament and dissolved into thin air.","The Camenae named the place Canens after her."],"state":"A fading rather than a transformation — Ovid's most unusual metamorphosis, and one with no Greek model.","temple":"None","festival":"None","priest":"None","symbols":["song","the riverbank"],"epithets":[],"sources":["Ovid, Metamorphoses 14.333-434"],"groups":["nymphs"]},{"id":"egeria","name":"Egeria","latin":"Egeria","greek":"none","tier":"native","rank":5,"gender":"f","origin":"italic","domains":["springs","counsel","sacred law"],"summary":"The nymph who met King Numa at night in a grove and dictated Rome's entire religious system to him.","deeds":["Meets Numa nightly in the grove of the Camenae outside the Porta Capena and gives him the laws, priesthoods and rites of Roman religion.","Livy notes drily that Numa invented the meetings because a superstitious people would accept nothing new without a god behind it — the earliest surviving Roman analysis of religion as statecraft.","After Numa's death she weeps without stopping until Diana, in pity, dissolves her into a cold spring at Aricia."],"state":"She is the mythic charter for the claim that Rome's religion was revealed rather than invented. The water of her spring was drawn by the Vestals for use in the temple.","temple":"The grove and spring of the Camenae outside the Porta Capena; the grove at Aricia","festival":"Honoured with the Camenae","priest":"Vestals drew her water","symbols":["spring","urn","the grove"],"epithets":[],"sources":["Livy 1.19, 1.21","Ovid, Metamorphoses 15.482-551","Ovid, Fasti 3.261-275"],"groups":["nymphs","camenae"]},{"id":"aesculapius","name":"Aesculapius","latin":"Aesculapius","greek":"Asclepius","tier":"imported","rank":6,"gender":"m","origin":"greek","domains":["healing","medicine","plague-averting"],"summary":"The god who chose his own address in Rome — he came as a snake, boarded the ship himself, and swam ashore at the island where his temple still partly stands.","deeds":["Learned medicine from the centaur Chiron and grew so skilled that he raised the dead — including Hippolytus — until Jupiter killed him with a thunderbolt for breaking the boundary between mortal and immortal.","Healed by incubation: the sick slept in his precinct and he appeared to them in dreams with the cure.","In 293 BC, with plague in the city, the Sibylline Books sent envoys to Epidaurus. The god refused to send his statue but appeared as an enormous serpent, glided aboard their ship of his own accord, and on reaching Rome swam to the Tiber Island and coiled there. The temple was built on the spot he chose."],"state":"The model Roman religious import: a foreign god formally invited, arriving under Sibylline authority, and picking his own site. The island was later revetted in travertine and shaped like a ship, with an obelisk for a mast — you can still see the prow. Claudius ruled that sick slaves abandoned there by their owners became free if they recovered.","temple":"Temple on the Tiber Island, following the plague of 293; its dedication day was 1 January, and modern datings range between 291 and 289 BC","festival":"1 January","priest":"None; temple attendants and physicians","symbols":["serpent-entwined staff","snake","dog","cockerel"],"epithets":["Salutifer"],"sources":["Ovid, Metamorphoses 15.622-744","Livy, Periochae 11","Suetonius, Claudius 25"],"groups":["sibylline_imports"]},{"id":"cybele","name":"Cybele / Magna Mater","latin":"Magna Mater Deum Idaea","greek":"Rhea","tier":"imported","rank":7,"gender":"f","origin":"anatolian","domains":["mother of the gods","mountains and wild beasts","city walls","fertility"],"summary":"The first oriental cult the Senate ever officially imported — brought in as a black meteorite to win a war, and then fenced round with restrictions for two centuries.","deeds":["Her sacred black stone was fetched from Pessinus in 204 BC on the instruction of the Sibylline Books, which promised that the foreign enemy would be driven from Italy if the Idaean Mother came to Rome.","The ship carrying the stone ran aground in the Tiber and would not move, until the matron Claudia Quinta — whose chastity was under public suspicion — prayed to the goddess and drew the vessel free single-handed with her girdle.","Drove Attis mad for breaking faith with her, so that he castrated himself under a pine tree and died.","Her Corybantes clashed their shields around the infant Jupiter on Crete so that Saturn would not hear him cry."],"state":"Accepted and immediately contained. Roman citizens were forbidden to serve as galli, her self-castrated priests, or to march in the ecstatic processions; the cult was run by Phrygians under the supervision of the quindecimviri. Because she came from Mount Ida above Troy, Rome could claim her as an ancestral rather than a foreign goddess — the same trick that made Aeneas a Roman. Claudius later lifted the restrictions.","temple":"Temple on the Palatine, dedicated 11 April 191 BC (the stone housed in the Temple of Victoria 204-191); rebuilt by Augustus","festival":"Megalesia, 4-10 April; the March cycle — Canna intrat 15 March, Arbor intrat 22 March, Dies Sanguinis 24 March, Hilaria 25 March, Lavatio 27 March","priest":"galli under an archigallus; supervised by the quindecimviri","symbols":["mural crown","lion-drawn chariot","tympanum","the black stone"],"epithets":["Magna Mater","Mater Deum Magna Idaea"],"sources":["Livy 29.10-14","Ovid, Fasti 4.179-372","Catullus 63"],"groups":["sibylline_imports","mystery_cults"]},{"id":"attis","name":"Attis","latin":"Attis","greek":"loosely Adonis","tier":"imported","rank":4,"gender":"m","origin":"anatolian","domains":["vegetation","death and rebirth","castration"],"summary":"Cybele's consort, who castrated himself under a pine and died — and whose resurrection was celebrated in Rome on 25 March.","deeds":["Born of the virgin Nana, made pregnant by fruit from a tree that grew where Agdistis' severed genitals fell.","Broke faith with Cybele to marry a king's daughter; she drove him mad, and he castrated himself beneath a pine tree and bled to death.","His body was preserved uncorrupted, and his return was celebrated at the Hilaria with unrestrained rejoicing after the mourning of the Dies Sanguinis."],"state":"Marginal under the Republic; the full March cycle became a state festival only under Claudius, and the archigallus was then made a post open to Roman citizens. On the Day of Blood the galli scourged themselves and novices castrated themselves; the next day the city celebrated his rising. The proximity of that calendar to the Christian Easter was noticed in antiquity and argued about ever since.","temple":"Worshipped within the Palatine precinct of Magna Mater","festival":"Dies Sanguinis, 24 March; Hilaria, 25 March","priest":"galli; the archigallus","symbols":["pine tree","Phrygian cap","shepherd's crook","violets"],"epithets":["Attis Menotyrannus"],"sources":["Ovid, Fasti 4.221-244","Catullus 63","Arnobius 5.5-7"],"groups":["mystery_cults"]},{"id":"isis","name":"Isis","latin":"Isis","greek":"identified with Demeter and Io","tier":"imported","rank":6,"gender":"f","origin":"egyptian","domains":["magic","motherhood","healing","sailors","fate","personal salvation"],"summary":"Banned five times, demolished by the Senate, and worshipped anyway — the goddess who offered Romans something their own religion did not: a personal relationship and a promise.","deeds":["Gathers the scattered pieces of the murdered Osiris and revives him long enough to conceive Horus.","Tricks Ra into revealing his secret name and so acquires supreme magical power.","In Apuleius' Golden Ass she rises from the sea at Cenchreae, appears to Lucius the ass in the moonlight, tells him she is the single deity the whole world worships under a thousand names, and restores him to human form in exchange for initiation. It is the fullest surviving account of what a Roman conversion felt like from the inside."],"state":"Repeatedly suppressed under the Republic — her shrines were demolished five times between 59 and 48 BC, and Augustus banned Egyptian rites inside the pomerium — precisely because the cult was voluntary, private, initiatory and beyond magistrate control. Then patronised by Caligula, Vespasian, Domitian and Hadrian. Her daily liturgy, morning and evening services, and lifelong priesthood were unlike anything in native Roman religion.","temple":"Iseum Campense in the Campus Martius, state-sanctioned under Caligula c. AD 38","festival":"Navigium Isidis, 5 March (the launching of the sacred ship for the sailing season); Isia, late October to early November","priest":"A shaven, linen-robed professional priesthood, with grades of initiation","symbols":["sistrum","situla","the tyet knot","throne headdress","knotted robe","moon disc"],"epithets":["Isis Regina","Myrionymos (of ten thousand names)","Pelagia","Panthea"],"sources":["Apuleius, Metamorphoses 11","Plutarch, De Iside et Osiride","Tacitus, Annals 2.85"],"groups":["mystery_cults"]},{"id":"serapis","name":"Serapis","latin":"Serapis, Sarapis","greek":"a blend of Zeus, Hades and Asclepius","tier":"imported","rank":5,"gender":"m","origin":"egyptian","domains":["the underworld","healing","grain","the sea"],"summary":"A god deliberately designed by a committee under Ptolemy I to be worshippable by Greeks and Egyptians alike — and who then made Vespasian emperor.","deeds":["Invented c. 300 BC by fusing Osiris with the Apis bull and dressing the result as a Greek Zeus, to give a mixed kingdom one god.","Appeared to Vespasian at Alexandria in AD 69 and confirmed his claim to the empire; in the god's precinct Vespasian healed a blind man with spittle and a lame man with his heel, before witnesses.","Delivered healing oracles by incubation, like Aesculapius."],"state":"The Flavians made him a dynastic legitimator: Vespasian had no ancestry and no army loyalty to inherit, so the Alexandrian miracles became the propaganda foundation of the new dynasty, and Serapis appeared on imperial coinage alongside Jupiter and Minerva. Caracalla built him one of the largest temples in Rome on the Quirinal.","temple":"Serapeum on the Quirinal, built by Caracalla; the great Serapeum of Alexandria (destroyed AD 391)","festival":"Celebrated with Isis","priest":"Egyptian-style priesthood","symbols":["the modius grain-measure on his head","sceptre","Cerberus at his side","full beard"],"epithets":["Serapis Invictus","Iuppiter Serapis"],"sources":["Tacitus, Histories 4.81-84","Suetonius, Vespasian 7","Plutarch, De Iside et Osiride 28"],"groups":["mystery_cults"]},{"id":"mithras","name":"Mithras","latin":"Mithras","greek":"linked to Sol and Phanes","tier":"imported","rank":6,"gender":"m","origin":"eastern","domains":["cosmic order","the sun","loyalty and oath-keeping","the salvation of initiates"],"summary":"Never a public cult, never in the calendar, and the most widespread religion in the Roman army — worshipped in artificial caves by men only, in seven grades.","deeds":["Born fully formed from a rock, holding a torch and a dagger.","Hunts, captures and kills the cosmic bull in a cave; from its blood and marrow the useful plants and animals spring, while a dog, a snake, a scorpion and a raven attend the killing. This scene — the tauroctony — stands at the end of every mithraeum, and nobody today can read it with certainty.","Makes a pact with Sol, sealed by a handshake, and banquets with him on the bull's hide."],"state":"The measure of how much of Roman religion happened outside the state: some 680 mithraea are estimated for the city of Rome alone, and roughly 420 sites are known across the empire, concentrated in the army, the customs service and the imperial slave administration. Seven grades of initiation — Corax, Nymphus, Miles, Leo, Perses, Heliodromus, Pater — each under a planet. Women were excluded entirely.","temple":"Mithraea: small, windowless, cave-like halls seating fifteen to forty men","festival":"No public calendar festival; private ritual meals","priest":"A Pater for each congregation","symbols":["the tauroctony","Phrygian cap","the torchbearers Cautes and Cautopates","raven","lion","snake"],"epithets":["Sol Invictus Mithras","Deus Invictus"],"sources":["Statius, Thebaid 1.719-720","CIMRM (corpus of inscriptions and monuments)","Porphyry, De Antro Nympharum"],"groups":["mystery_cults"]},{"id":"epona","name":"Epona","latin":"Epona","greek":"none","tier":"imported","rank":4,"gender":"f","origin":"gallic","domains":["horses","cavalry","mules and stables","fertility"],"summary":"A Gaulish goddess who became the only Celtic deity with a place in the Roman state calendar — because the cavalry insisted.","deeds":["Depicted riding side-saddle, or between two horses, or feeding foals from a patera.","Carried into every province by Roman auxiliary cavalry, who put her image in the stables themselves."],"state":"Rome absorbed hundreds of provincial deities without granting any of them official days. Epona comes closer than most: a rustic calendar from Guidizzolo marks 18 December for her, though that may record a local observance rather than a Roman state festival. Her shrines were in stables, not temples — which is the real measure of how she spread.","temple":"Shrines in stables and cavalry barracks across the western provinces","festival":"18 December (on the rustic calendar of Guidizzolo)","priest":"None","symbols":["horse","foal","patera","cornucopia","key"],"epithets":["Epona Regina"],"sources":["Juvenal 8.155-157","Apuleius, Metamorphoses 3.27","CIL passim"],"groups":[]},{"id":"roma","name":"Roma","latin":"Roma","greek":"none","tier":"abstract","rank":6,"gender":"f","origin":"greek","domains":["the Roman state personified","empire"],"summary":"The city worshipping itself — invented in the Greek east, imported home, and finally given the largest temple in Rome.","deeds":["First worshipped not at Rome but by Greek cities of Asia grateful (or careful) enough to build temples to their conqueror, from Smyrna in 195 BC.","Augustus allowed provincials to worship Roma paired with his own name, which is how the imperial cult began: not as an emperor demanding worship, but as a compromise for subjects who wanted to offer it.","Hadrian's Temple of Venus and Roma, dedicated AD 135, was the largest in the city, and set the goddess back to back with the ancestress of the Julian house — Roma amor, the palindrome, was noticed."],"state":"The purest demonstration that Roman religion was political. Roma has no myth, no genealogy and no story; she is what a state looks like when its subjects need a face to address.","temple":"Temple of Venus and Roma, dedicated AD 135; provincial temples across the east from 195 BC","festival":"21 April (Parilia, refounded as the Natalis Urbis, Rome's birthday)","priest":"Provincial flamines and concilia","symbols":["helmet","spear","she-wolf","globe","mural crown"],"epithets":["Roma Aeterna","Dea Roma"],"sources":["Tacitus, Annals 4.37","Livy 43.6","Cassius Dio 51.20"],"groups":["virtues"]},{"id":"concordia","name":"Concordia","latin":"Concordia","greek":"Homonoia","tier":"abstract","rank":5,"gender":"f","origin":"italic","domains":["civic agreement","marital harmony","the settlement of class conflict"],"summary":"Harmony as a public building — her temple was vowed to end the struggle of the orders and then used, repeatedly, to declare the argument over.","deeds":["Vowed by Camillus in 367 BC when the Licinian-Sextian laws finally opened the consulship to plebeians.","Rebuilt by Opimius in 121 BC immediately after the killing of Gaius Gracchus — a temple to Harmony put up by the man who had just massacred the opposition, which Romans noticed and resented.","Cicero delivered the Fourth Catilinarian in her temple, and the Senate voted there to execute the conspirators."],"state":"The building where the Senate met when it wanted the setting to make an argument. Rebuilt magnificently by Tiberius in AD 10 as Concordia Augusta, when harmony had become the property of one family.","temple":"Temple of Concord at the foot of the Capitol, vowed 367 BC, rebuilt 121 BC and again AD 10","festival":"5 February; 22 July; 16 January (Concordia Augusta)","priest":"None","symbols":["clasped hands","cornucopia","caduceus","patera"],"epithets":["Concordia Augusta","Concordia Ordinum"],"sources":["Livy 6.42","Plutarch, Gaius Gracchus 17","Ovid, Fasti 1.637-650"],"groups":["virtues"]},{"id":"pax","name":"Pax","latin":"Pax","greek":"Eirene","tier":"abstract","rank":5,"gender":"f","origin":"italic","domains":["peace — specifically, peace imposed by victory"],"summary":"Roman peace is not the absence of war but its successful conclusion — which is why her great monument is covered in armour and her altar was voted for a returning general.","deeds":["The Ara Pacis Augustae, voted by the Senate in 13 BC for Augustus' return from Gaul and Spain and dedicated 30 January 9 BC, carries the imperial family in procession on one side and Tellus with her children on the other: dynasty and fertility as the two products of peace.","Vespasian's Templum Pacis, built from the spoils of Jerusalem and housing the Temple treasures, made the point without subtlety."],"state":"Pax gets a state cult only under the empire, because only then could peace be presented as an achievement rather than an interval. The phrase pax Romana carries the whole ambiguity: Tacitus has a British chieftain say that where they make a desert, they call it peace.","temple":"Ara Pacis Augustae, dedicated 30 January 9 BC; Templum Pacis, dedicated by Vespasian AD 75","festival":"30 January; 3 January","priest":"None","symbols":["olive branch","cornucopia","caduceus","burning weapons"],"epithets":["Pax Augusta","Pax Romana"],"sources":["Ovid, Fasti 1.709-722","Augustus, Res Gestae 12","Tacitus, Agricola 30"],"groups":["virtues"]},{"id":"salus","name":"Salus","latin":"Salus","greek":"Hygieia","tier":"abstract","rank":5,"gender":"f","origin":"italic","domains":["the safety and welfare of the Roman people","health"],"summary":"Not personal health but public survival — and the object of the augurium Salutis, a rite that could only be performed when Rome was at peace everywhere.","deeds":["The augurium Salutis asked whether it was permitted to pray for the safety of the Roman people — but could only be taken on a day when no Roman army anywhere was in the field, which for most of Roman history meant never.","Augustus revived it in 29 BC; its performance became a public statement that the wars were over."],"state":"Salus Publica Populi Romani was the collective survival of the state, and the augury attached to her is one of the most revealing Roman rites: a ceremony designed so that it could almost never be held.","temple":"Temple on the Quirinal, vowed 311, dedicated 302 BC by C. Junius Bubulcus","festival":"5 August; 30 March","priest":"augurs","symbols":["snake and patera","rudder","globe"],"epithets":["Salus Publica","Salus Augusta"],"sources":["Livy 9.43","Cicero, De Divinatione 1.105","Cassius Dio 51.20"],"groups":["virtues"]},{"id":"spes","name":"Spes","latin":"Spes","greek":"Elpis","tier":"abstract","rank":4,"gender":"f","origin":"italic","domains":["hope","expectation of the harvest","dynastic succession"],"summary":"Hope shown as a young woman lifting the hem of her dress and holding out a flower — the bud, not the fruit.","deeds":["The only thing left in Pandora's jar when everything else escaped.","Her Forum Holitorium temple was struck by lightning and burned repeatedly, which Romans found ominous and mordantly funny."],"state":"Under the empire Spes Augusta meant the heir: putting Hope on the coinage announced that the succession was settled. Roman abstractions were rarely abstract for long.","temple":"Temple in the Forum Holitorium, vowed during the First Punic War, c. 258 BC","festival":"1 August","priest":"None","symbols":["a flower in bud","the lifted hem"],"epithets":["Spes Augusta","Spes Vetus"],"sources":["Livy 21.62, 24.47","Cicero, De Natura Deorum 2.61"],"groups":["virtues"]},{"id":"fides","name":"Fides","latin":"Fides","greek":"Pistis","tier":"abstract","rank":5,"gender":"f","origin":"italic","domains":["good faith","the binding force of an oath","trust between states"],"summary":"The keeping of one's word, worshipped by priests with their right hands wrapped in white cloth — because the right hand is where faith lives.","deeds":["Her cult was ascribed to Numa. The three major flamines drove to her shrine together in a covered carriage and sacrificed with their right hands bound up to the fingers in white wool.","Fides publica populi Romani was the state's credit: treaties, surrenders and the protection of ambassadors all rested on her.","A defeated enemy who surrendered in fidem populi Romani placed himself entirely at Rome's mercy, and Rome's reputation for keeping that bargain was worth armies."],"state":"The most functional god in the pantheon. Roman power depended on other peoples believing that Roman promises held; Fides is that belief given a temple next to Jupiter's on the Capitol.","temple":"Temple on the Capitol beside Jupiter Optimus Maximus, dedicated 254 BC by A. Atilius Calatinus","festival":"1 October","priest":"The three flamines maiores together","symbols":["the veiled right hand","clasped hands","white wool","turtle-dove"],"epithets":["Fides Publica","Fides Romana"],"sources":["Livy 1.21","Cicero, De Officiis 3.104","Dionysius of Halicarnassus 2.75"],"groups":["virtues"]},{"id":"libertas","name":"Libertas","latin":"Libertas","greek":"Eleutheria","tier":"abstract","rank":5,"gender":"f","origin":"italic","domains":["political liberty","freedom from a master","manumission"],"summary":"Freedom shown as a cap — the pileus a freed slave put on, and the same cap Brutus struck on his coins after killing Caesar.","deeds":["The freed slave's cap became the universal Roman sign of liberty; at the Saturnalia everyone wore one.","Brutus issued the EID MAR denarius in 43-42 BC showing two daggers flanking the cap of liberty — the most brazen coin in ancient history, advertising an assassination as a public service.","Clodius consecrated a shrine of Libertas on the site of Cicero's demolished house, so that Cicero could not legally rebuild; Cicero's speech De Domo Sua got the consecration annulled."],"state":"The most contested word in Roman politics. Every faction claimed it: the Senate against the Gracchi, the Gracchi against the Senate, Caesar's killers against Caesar, and Augustus, who wrote in his own Res Gestae that he had restored liberty to the Republic he had just replaced.","temple":"Temple on the Aventine, dedicated 238 BC; the Atrium Libertatis with the censors' archives","festival":"13 April","priest":"None","symbols":["pileus cap","rod (vindicta)","broken chain"],"epithets":["Libertas Publica","Libertas Augusta"],"sources":["Livy 24.16","Cicero, De Domo Sua","Augustus, Res Gestae 1"],"groups":["virtues"]},{"id":"virtus","name":"Virtus","latin":"Virtus","greek":"Arete","tier":"abstract","rank":4,"gender":"m","origin":"italic","domains":["courage","manliness","military excellence"],"summary":"Courage as a masculine noun — and, by Roman rule, unreachable except through Honos, whose temple you had to walk through to get to it.","deeds":["Marcellus built the joined temples of Honos and Virtus after Syracuse in 205 BC, arranged so that the only way into Virtus was through Honos: no glory without honourable conduct first, architecturally enforced."],"state":"The word behind vir, a man — and behind virtue. Roman moral vocabulary begins by defining goodness as the specific excellence of a soldier, and the whole later history of the word is a slow widening of that.","temple":"Joined temples of Honos and Virtus at the Porta Capena, rebuilt by Marcellus 205 BC","festival":"17 July; 29 May","priest":"None","symbols":["helmet","short sword","spear","trophy"],"epithets":["Virtus Augusta"],"sources":["Livy 27.25","Cicero, De Natura Deorum 2.61","Valerius Maximus 1.1.8"],"groups":["virtues"]},{"id":"honos","name":"Honos","latin":"Honos","greek":"none","tier":"abstract","rank":4,"gender":"m","origin":"italic","domains":["public honour","the recognition earned by service"],"summary":"Honour as a thing the community awards, not a thing you feel — inseparable from Virtus, and placed in front of it.","deeds":["Shared a double temple with Virtus at the Porta Capena, where triumphing generals passed on their way into the city."],"state":"The pairing states the Roman theory of a career: courage earns honour, honour is conferred by the state, and no amount of the first entitles you to seize the second.","temple":"Double temple with Virtus at the Porta Capena","festival":"17 July","priest":"None","symbols":["cornucopia","sceptre","laurel"],"epithets":["Honos Augusti"],"sources":["Livy 27.25","Cicero, De Legibus 2.58"],"groups":["virtues"]},{"id":"pietas","name":"Pietas","latin":"Pietas","greek":"Eusebeia","tier":"abstract","rank":5,"gender":"f","origin":"italic","domains":["duty to gods, family and country"],"summary":"The central Roman virtue and the hardest to translate — Aeneas is called pius not because he is holy but because he does what he owes, whatever it costs him.","deeds":["Her temple was said to stand where a woman had secretly kept her imprisoned parent alive by nursing them at her own breast — the Caritas Romana story.","Virgil applies the adjective pius to Aeneas some twenty times, almost always at the moments when duty is costing him something he wants: leaving Dido, burying Palinurus, killing Turnus."],"state":"Pietas is obligation running in three directions at once — up to the gods, back to the ancestors, out to the state — and Roman moral judgement of a man was largely a judgement of how he handled the conflicts between them.","temple":"Temple in the Forum Holitorium, vowed 191, dedicated 181 BC by M'. Acilius Glabrio","festival":"1 December","priest":"None","symbols":["stork","patera","altar","the veiled head"],"epithets":["Pietas Augusta"],"sources":["Virgil, Aeneid passim","Livy 40.34","Pliny, Natural History 7.121","Valerius Maximus 5.4.7"],"groups":["virtues"]},{"id":"juventas","name":"Juventas","latin":"Iuventas","greek":"Hebe","tier":"abstract","rank":4,"gender":"f","origin":"italic","domains":["youth","the military age-class","the young men of Rome"],"summary":"The goddess of the age at which a Roman became liable for military service — and one of the two who refused to move for Jupiter.","deeds":["With Terminus, refused to be exaugurated from the Capitol when Tarquin cleared the hill; her chapel was left inside the great temple's precinct.","Every boy who assumed the toga virilis paid a coin into her treasury, which made her shrine a census of Rome's fighting strength."],"state":"The pairing of Terminus and Juventas at the heart of the Capitoline temple gave the augurs their two guarantees: borders that never recede, and young men who never run out.","temple":"Chapel within the precinct of Jupiter Optimus Maximus; temple in the Circus Maximus, dedicated 191 BC","festival":"19 December","priest":"None","symbols":["the cup of the gods","the toga virilis"],"epithets":["Iuventus"],"sources":["Livy 5.54, 36.36","Dionysius of Halicarnassus 3.69"],"groups":["virtues"]},{"id":"annona","name":"Annona","latin":"Annona","greek":"none","tier":"abstract","rank":4,"gender":"f","origin":"italic","domains":["the year's grain supply","the corn dole"],"summary":"The grain shipment personified — because in a city of a million people fed from Egypt and Africa, the arrival of the fleet was a religious event.","deeds":["Appears on imperial coinage holding grain ears and a modius, usually with a ship's prow: the state announcing that the convoy has docked."],"state":"Riots over the grain supply brought down magistrates and frightened emperors; Claudius was pelted with crusts in the Forum. Annona is what a food-supply guarantee looks like when the guarantor wants to be believed.","temple":"Honoured at Ostia and in the Forum Boarium; no major temple in Rome","festival":"None fixed","priest":"praefectus annonae (an administrative post, not a priesthood)","symbols":["modius grain-measure","grain ears","ship's prow","cornucopia"],"epithets":["Annona Augusti"],"sources":["Tacitus, Annals 2.87","Suetonius, Claudius 18","CIL VI"],"groups":["virtues"]},{"id":"nemesis","name":"Nemesis","latin":"Nemesis","greek":"Nemesis","tier":"abstract","rank":5,"gender":"f","origin":"greek","domains":["retribution","the correction of undeserved good fortune","measured justice"],"summary":"Not revenge but proportion — she pulls down whatever has risen too far, and her attribute is a measuring rod.","deeds":["Punishes Narcissus, who scorned Echo, by giving him a love he can never reach: his own reflection.","Pursued by Jupiter through a chain of shape-changes; as a goose she lays the egg from which Helen hatches.","Carries a cubit-rule, a bridle and scales — the instruments of measurement, restraint and weighing."],"state":"She became the particular goddess of the arena: the largest concentration of her inscriptions is in amphitheatres and army camps across the empire, and there was a shrine at the Colosseum's own gate. Gladiators, whose fortunes reversed in seconds, understood her better than philosophers did.","temple":"Shrines beside amphitheatres, notably the sacellum at the Colosseum; a chapel on the Capitol","festival":"No fixed date","priest":"None","symbols":["measuring rod","scales","bridle","wheel","griffin"],"epithets":["Rhamnusia","Nemesis Campestris"],"sources":["Ovid, Metamorphoses 3.406-410","Pliny, Natural History 28.22","CIL VI 532"],"groups":["virtues"]},{"id":"discordia","name":"Discordia","latin":"Discordia","greek":"Eris","tier":"abstract","rank":4,"gender":"f","origin":"greek","domains":["strife","civil discord"],"summary":"The only guest not invited to the wedding, and therefore the cause of the Trojan War, the fall of Troy, and everything that followed.","deeds":["Left off the guest list for the wedding of Peleus and Thetis, she rolls a golden apple inscribed 'to the fairest' among the goddesses, and the Judgement of Paris follows.","In Virgil she rages over the battlefield with a bloody ribbon binding her snaky hair, and she sits at the entrance to the underworld among the terrors.","Her iron cell is kept shut by the twin gates of War; when war comes she is what gets out."],"state":"Rome gave her no cult at all — instead it worshipped her opposite, Concordia, with a great temple in the Forum. The pairing is the Roman theory of politics in two buildings: strife is real, has no shrine, and is answered by an architecture of agreement.","temple":"No cult","festival":"None","priest":"None","symbols":["golden apple","torn robes","snakes for hair"],"epithets":[],"sources":["Virgil, Aeneid 6.280, 8.702","Hyginus, Fabulae 92"],"groups":[]},{"id":"fama","name":"Fama","latin":"Fama","greek":"Pheme","tier":"abstract","rank":4,"gender":"f","origin":"greek","domains":["rumour","report","reputation"],"summary":"Rumour as a monster that grows by moving — Virgil's most famous single description, and a study of how information actually travels.","deeds":["Born last of Terra's children, in anger at the gods, sister to the Giants. She starts small and frightened, then walks the ground with her head in the clouds; under every feather is a watching eye, a talking tongue, a listening ear.","She spreads the news of Dido and Aeneas through the African cities — mixing true and false in equal measure, as Virgil carefully says — and it is the report, not the affair, that destroys Dido.","Ovid gives her a house of echoing bronze at the centre of the world, open on all sides, where every word that arrives is repeated back larger."],"state":"No cult of Fama — but a real one for Aius Locutius, the Announcing Voice, whose shrine on the Via Nova was built after a plebeian reported hearing a voice in the night warning of the Gauls, and was ignored. Rome built a temple to the warning it had failed to heed.","temple":"None (see Aius Locutius, shrine on the Via Nova, 390s BC)","festival":"None","priest":"None","symbols":["wings","trumpet","countless eyes, tongues and ears"],"epithets":[],"sources":["Virgil, Aeneid 4.173-197","Ovid, Metamorphoses 12.39-63","Livy 5.32, 5.50"],"groups":[]},{"id":"mors","name":"Mors","latin":"Mors","greek":"Thanatos","tier":"chthonic","rank":4,"gender":"f","origin":"latin","domains":["death"],"summary":"Death — and in Latin, female, unlike the masculine Greek Thanatos, which quietly changed how Roman art imagined dying.","deeds":["Wrestled and beaten by Hercules at the tomb of Alcestis, who is given back to her husband.","Bound by Sisyphus so that for a while nobody on earth could die at all, until Mars came and released her.","Stands with Disease, Old Age, Fear, Hunger and Toil in the vestibule of Orcus — the things Aeneas walks past before he even reaches the river."],"state":"Almost no cult. Romans handled death through the di Manes and the calendar of the dead — Parentalia in February, Lemuria in May — rather than through a god of death. The abstraction stayed literary.","temple":"None","festival":"None","priest":"None","symbols":["inverted torch","black wings"],"epithets":[],"sources":["Virgil, Aeneid 6.273-281","Hyginus, Fabulae praef."],"groups":["underworld"]},{"id":"letum","name":"Letum","latin":"Letum","greek":"none","tier":"chthonic","rank":2,"gender":"n","origin":"latin","domains":["violent death","ruin"],"summary":"A second Latin word for death with no Greek counterpart — death as destruction, as against mors, death as the event.","deeds":["Stands in Virgil's vestibule of the underworld in the pairing Letumque Labosque — Ruin and Toil, side by side."],"state":"A purely Latin personification. The distinction between mors and letum has no Greek equivalent and shows Latin thinking about death in two registers at once.","temple":"None","festival":"None","priest":"None","symbols":[],"epithets":[],"sources":["Virgil, Aeneid 6.277","Hyginus, Fabulae praef."],"groups":["underworld"]},{"id":"somnus","name":"Somnus","latin":"Somnus","greek":"Hypnos","tier":"chthonic","rank":4,"gender":"m","origin":"latin","domains":["sleep","dreams"],"summary":"Sleep, who lives in a Cimmerian cave where no cock crows and no door hinge creaks, with the river Lethe running through it and poppies at the mouth.","deeds":["Sends his son Morpheus to Alcyone in the exact shape of her drowned husband Ceyx, to tell her he is dead — the tenderest scene in the Metamorphoses.","In the Aeneid a god in Somnus' shape leans over Palinurus at the helm, shakes a branch dripping with Lethe over his temples, and tips him into the sea: the last life lost before Italy.","Virgil gives him twin Gates of Sleep — horn for true shades, ivory for false — and sends Aeneas back up through the ivory one, which scholars have been arguing about for two thousand years."],"state":"Purely poetic; his brother is Mors. Morpheus is Ovid's own invention and has no Greek precedent — one of the very few gods a Roman poet simply made up and made stick.","temple":"None","festival":"None","priest":"None","symbols":["poppies","horn of sleep","wand","wings","the dark cave"],"epithets":[],"sources":["Ovid, Metamorphoses 11.592-748","Virgil, Aeneid 5.833-871, 6.893-898"],"groups":["underworld"]},{"id":"parcae","name":"The Parcae","latin":"Parcae — Nona, Decuma, Morta","greek":"the Moirai"
