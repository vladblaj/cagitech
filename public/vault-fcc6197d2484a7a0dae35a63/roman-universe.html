","the egg"],"epithets":["Castores","Gemini","Tyndaridae"],"sources":["Livy 2.19-2.20, 2.42","Dionysius of Halicarnassus 6.13","Cicero, De Natura Deorum 2.6","Ovid, Fasti 1.705-708"],"groups":["demigods"]},{"id":"virbius","name":"Virbius / Hippolytus","latin":"Virbius","greek":"Hippolytos","tier":"hero","rank":4,"gender":"m","origin":"greek","domains":["the sacred grove at Aricia","resurrection"],"summary":"A Greek hero killed by his own horses, raised from the dead, and resettled by Diana in an Italian wood where horses were forbidden forever.","deeds":["Falsely accused by his stepmother Phaedra and cursed by his father Theseus; a monster sent by Neptune from the sea panics his horses and he is dragged to pieces.","Aesculapius reassembles and revives him with Paeonian herbs — and Jupiter kills Aesculapius for it.","Diana hides him in thick mist, ages his face so no one will know him, renames him Virbius, and settles him in her grove at Aricia by Lake Nemi. No horse may enter it.","His son, also Virbius, fights on the Italian side in the Aeneid — and comes to war in a chariot, which Virgil notes."],"state":"The clearest single example of how Rome naturalised Greek myth: take a Greek hero, kill him, resurrect him, rename him in Latin, and install him as the resident god of a real Italian sanctuary with its own strange rule and its own priest, the rex Nemorensis.","temple":"The grove of Diana Nemorensis at Aricia, Lake Nemi","festival":"Nemoralia, 13 August","priest":"rex Nemorensis","symbols":["the forbidden horse","the grove","the mist"],"epithets":["Virbius"],"sources":["Virgil, Aeneid 7.761-782","Ovid, Metamorphoses 15.479-546","Ovid, Fasti 3.263-266, 6.735-762"],"groups":[]},{"id":"circe","name":"Circe","latin":"Circe","greek":"Kirke","tier":"hero","rank":5,"gender":"f","origin":"greek","domains":["sorcery","transformation","herbs"],"summary":"The Sun's daughter, relocated by Roman poets to a real mountain on the Latian coast that travellers could point at from the sea.","deeds":["Turns Ulysses' crew into swine; he resists with the herb moly and stays a year.","Poisons the pool where Scylla bathes, out of jealousy over Glaucus, and makes a monster of a girl who had done nothing.","Turns Picus, king of Latium, into a woodpecker for refusing her, and his companions into beasts — which is how she enters Roman rather than Greek myth.","Aeneas' fleet passes her shore at night and hears the lions roaring and the bears growling in her house; Neptune sends a wind to carry them past without landing."],"state":"Placing her at Monte Circeo, a real headland south of Rome, is how Latin poets grafted Homer's geography onto Italy. Her son by Ulysses, Telegonus, was said to have founded Tusculum — so a Roman aristocratic town claimed descent from Homer's witch.","temple":"None","festival":"None","priest":"None","symbols":["the wand","the cup","herbs","the loom"],"epithets":[],"sources":["Ovid, Metamorphoses 14.1-74, 14.246-440","Virgil, Aeneid 7.10-24"],"groups":[]},{"id":"ganymede","name":"Ganymede","latin":"Ganymedes","greek":"Ganymedes","tier":"hero","rank":3,"gender":"m","origin":"greek","domains":["the cupbearer of the gods"],"summary":"Snatched off Mount Ida by an eagle and made cupbearer of heaven — and one of the standing insults that keep Juno at war with Troy.","deeds":["Taken by Jupiter's eagle, or by Jupiter as an eagle, and given immortality and the office of pouring the gods' wine, displacing Juno's daughter Hebe.","The scene is embroidered on the cloak Aeneas gives as a prize at Anchises' funeral games — the boy shown gasping, the old guardians reaching up, the hounds baying at the sky."],"state":"Structurally important out of proportion to his story: Virgil lists 'the honours of ravished Ganymede' in the poem's first thirty lines as one of the grudges that make Juno hate the entire Trojan race. A Trojan boy's promotion is one of the causes of the Aeneid.","temple":"None","festival":"None","priest":"None","symbols":["eagle","wine cup","Phrygian cap"],"epithets":[],"sources":["Virgil, Aeneid 1.28, 5.250-257","Ovid, Metamorphoses 10.155-161"],"groups":["trojan_line"]},{"id":"divus_iulius","name":"Divus Iulius","latin":"Divus Iulius","greek":"none","tier":"deified","rank":6,"gender":"m","origin":"italic","domains":["the first deified Roman","the Julian star"],"summary":"Julius Caesar, made a god by a senatorial decree and a comet — the moment Roman religion openly absorbed Roman politics.","deeds":["Assassinated on the Ides of March, 44 BC, at the foot of Pompey's statue.","At the games Octavian held that July a comet burned for seven days; it was read as Caesar's soul ascending, and became the sidus Iulium, the Julian star, put on coins and on the statue's forehead.","Formally consecrated by the Senate on 1 January 42 BC; the Temple of Divus Iulius was dedicated in 29 BC on the spot in the Forum where his body was burned.","Ovid has Venus snatch the soul out of the body and carry it up to the stars herself — explicitly so that her descendant Augustus should not be the son of a mortal."],"state":"The template. Apotheosis of a named historical Roman by vote of the Senate has no real Greek parallel, and the mythic precedents — Aeneas, Romulus, Hersilia — were emphasised under Augustus precisely to make the new practice look ancestral. Ovid's Metamorphoses ends on exactly that sequence, which is the argument made as structure.","temple":"Temple of Divus Iulius in the Roman Forum, dedicated 18 August 29 BC","festival":"12 July (his birthday); the games of Venus Genetrix in July","priest":"flamen Divi Iulii (the first holder was Mark Antony)","symbols":["the comet","the star above the brow","the laurel"],"epithets":["Divus Iulius"],"sources":["Ovid, Metamorphoses 15.745-851","Pliny, Natural History 2.93-94","Suetonius, Julius 88"],"groups":["deified_mortals","julian_line"]},{"id":"divus_augustus","name":"Divus Augustus","latin":"Divus Augustus","greek":"none","tier":"deified","rank":6,"gender":"m","origin":"italic","domains":["the imperial cult","the deified founder of the principate"],"summary":"Deified by the Senate a month after his death, on the sworn testimony of one senator who said he saw the shape rising from the pyre.","deeds":["Died 19 August AD 14; consecrated by senatorial decree on 17 September.","The senator Numerius Atticus swore on oath that he had seen the emperor's form ascending from the flames — and was paid a million sesterces by Livia, which Cassius Dio reports without further comment.","A flamen Augustalis and the college of sodales Augustales were established; Livia became his priestess.","Both Virgil and Ovid had prophesied his godhead while he was still alive, which put the poets in the awkward position of having been right."],"state":"Completes the chain the Aeneid was written to display: Venus → Aeneas → Iulus → Caesar → Augustus. In the provinces the cult had begun decades earlier, paired with Roma, because subjects wanted a way to address the power over them. At Rome it was permitted only after death — a distinction the emperors maintained carefully, and a few of them dropped.","temple":"Temple of Divus Augustus, dedicated AD 37; provincial temples from Pergamum, 29 BC","festival":"17 September (consecration); the Augustalia, 12 October","priest":"flamen Augustalis; sodales Augustales","symbols":["the eagle released from the pyre","the radiate crown","the laurel"],"epithets":["Divus Augustus","Pater Patriae"],"sources":["Suetonius, Augustus 100","Tacitus, Annals 1.10","Cassius Dio 56.46","Ovid, Metamorphoses 15.868-870"],"groups":["deified_mortals","julian_line"]},{"id":"diva_augusta","name":"Livia / Diva Augusta","latin":"Iulia Augusta, Diva Augusta","greek":"none","tier":"deified","rank":5,"gender":"f","origin":"italic","domains":["the deified empress"],"summary":"The first Roman woman fully consecrated by the state — thirteen years after her death, by a grandson who needed the connection.","deeds":["Adopted into the Julian family by Augustus' will in AD 14 and renamed Julia Augusta; made priestess of the deified Augustus.","Tiberius, her own son, blocked every honour proposed for her and refused her consecration.","Claudius deified her in AD 42 as Diva Augusta, gave her an elephant-drawn carriage in the circus procession, and put the Vestals in charge of her rites."],"state":"Establishes the imperial-consort apotheosis that the myth of Hersilia had prefigured — and shows the mechanism plainly: deification was a decision taken by a living ruler about a dead relative, for reasons of the moment.","temple":"Honoured with Divus Augustus","festival":"With the Augustalia","priest":"The Vestals conducted her rites","symbols":["the elephant carriage","the veiled head","grain ears"],"epithets":["Iulia Augusta","Diva Augusta"],"sources":["Tacitus, Annals 5.1-2","Suetonius, Claudius 11","Cassius Dio 60.5"],"groups":["deified_mortals","julian_line"]}],"links":[["caligo","chaos","parent","bore"],["chaos","nox","parent","bore"],["chaos","dies","parent","bore"],["chaos","erebus","parent","bore"],["chaos","aether","parent","bore"],["aether","dies","consort","consort of"],["nox","erebus","consort","consort of"],["aether","terra","parent","fathered"],["aether","caelus","parent","fathered"],["dies","terra","parent","bore"],["dies","caelus","parent","bore"],["caelus","terra","consort","consort of"],["terra","tartarus","consort","consort of"],["caelus","saturn","parent","fathered"],["terra","saturn","parent","bore"],["caelus","ops","parent","fathered"],["terra","ops","parent","bore"],["caelus","hyperion","parent","fathered"],["caelus","thea","parent","fathered"],["caelus","coeus","parent","fathered"],["caelus","phoebe","parent","fathered"],["caelus","crius","parent","fathered"],["caelus","iapetus","parent","fathered"],["caelus","oceanus","parent","fathered"],["caelus","tethys","parent","fathered"],["caelus","themis","parent","fathered"],["caelus","mnemosyne","parent","fathered"],["terra","hyperion","pare const tierMeta = {}; TIERS.forEach(t => tierMeta[t.id] = t);

const state = {

  tiersOff:new Set(), linksOff:new Set(),
  cam:{x:0,y:0,k:1}
};

/* ring radius per rank: wide enough for everyone standing on it */
const rankCount = {};
F.forEach(f => rankCount[f.rank] = (rankCount[f.rank]||0) + 1);
const ringOf = {};
let prevR = 0;
for (let r=10; r>=1; r--){
  const c = rankCount[r] || 0;
  if (r === 10 && c <= 2){ ringOf[r] = 0; continue; }
  const spanPerNode = (3.6 + r*1.75)*2 + 62;
  const need = c * spanPerNode / (2*Math.PI);
  const rad = Math.max(prevR + 105, need);
  ringOf[r] = rad; prevR = rad;
}
const MAXRING = ringOf[1] || 700;

/* nodes / edges */
const nodes = F.map((f,i) => {
  const ring = ringOf[f.rank];
  const a = (i * 2.399963) % (Math.PI*2);
  return {
    id:f.id, f, ring,
    x: Math.cos(a)*ring + (Math.random()-.5)*40,
    y: Math.sin(a)*ring + (Math.random()-.5)*40,
    vx:0, vy:0,
    r: 3.6 + f.rank * 1.75,
    col: tierMeta[f.tier].color
  };
});
const nmap = {}; nodes.forEach(n => nmap[n.id] = n);
const edges = L.map(l => ({s:nmap[l[0]], t:nmap[l[1]], type:l[2], label:l[3]}))
               .filter(e => e.s && e.t);

/* adjacency */
const adj = {};
nodes.forEach(n => adj[n.id] = []);
edges.forEach(e => { adj[e.s.id].push(e); adj[e.t.id].push(e); });

document.getElementById('count').textContent =
  F.length + ' figures · ' + edges.length + ' connections';

  d.onclick = () => {

    if (state.view !== 'graph') render();
  };
  tierChips.appendChild(d);
});
document.getElementById('allTiers').onclick = () => {

const linkChips = document.getElementById('linkChips');
Object.keys(LINKTYPES).forEach(k => {

/* ============================ search ============================ */
const searchEl = document.getElementById('search');
searchEl.oninput = () => { state.query = searchEl.value.trim().toLowerCase(); render(); };

function matches(f) {
  if (!state.query) return true;
  const q = state.query;
  return (f.name+' '+f.latin+' '+(f.greek||'')+' '+(f.etruscan||'')+' '+f.summary+' '+
          f.domains.join(' ')+' '+f.deeds.join(' ')+' '+(f.state||'')+' '+
          (f.epithets||[]).join(' ')+' '+(f.festival||'')+' '+(f.temple||'')
         ).toLowerCase().includes(q);
}

/* ============================ canvas ============================ */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
function resize(){
  const r = cv.getBoundingClientRect();
  W = r.width; H = r.height;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
function fitK(){
  const k = Math.max(0.2, Math.min(1.4, Math.min(W, H) / (MAXRING*2 + 130)));
  return W < 760 ? k * 1.9 : k;   // phones start closer in, and pan
}
window.addEventListener('resize', () => { resize(); });

/* simulation */
let alpha = 1, dragNode = null;
function tick(){
  if (alpha < 0.005 && !dragNode) return;
  alpha *= 0.994;
  const a = Math.max(alpha, 0.03);

  // repulsion
  for (let i=0;i<nodes.length;i++){
    const A = nodes[i];
    for (let j=i+1;j<nodes.length;j++){
      const B = nodes[j];
      let dx = B.x-A.x, dy = B.y-A.y;
      let d2 = dx*dx+dy*dy;
      if (d2 > 160000 || d2 === 0) continue;
      const d = Math.sqrt(d2);
      const push = (3600 + (A.r+B.r)*160) / d2 * a;
      const ux = dx/d, uy = dy/d;
      A.vx -= ux*push; A.vy -= uy*push;
      B.vx += ux*push; B.vy += uy*push;
      // hard collision
      const min = A.r + B.r + 16;
      if (d < min){
        const o = (min-d)*0.34;
        A.vx -= ux*o; A.vy -= uy*o;
        B.vx += ux*o; B.vy += uy*o;
      }
    }
  }
  // springs
  for (const e of edges){
    const dx = e.t.x-e.s.x, dy = e.t.y-e.s.y;
    const d = Math.hypot(dx,dy) || 1;
    const rest = 150 + Math.abs(e.s.ring-e.t.ring)*0.6;
    const k = (e.type==='parent'||e.type==='consort'||e.type==='same') ? 0.026 : 0.011;
    const f = (d-rest)*k*a;
    const ux = dx/d, uy = dy/d;
    e.s.vx += ux*f; e.s.vy += uy*f;
    e.t.vx -= ux*f; e.t.vy -= uy*f;
  }
  // radial gravity to rank ring + centring
  for (const n of nodes){
    const d = Math.hypot(n.x,n.y) || 1;
    const pull = (d - n.ring) * 0.055 * a;
    n.vx -= (n.x/d)*pull; n.vy -= (n.y/d)*pull;
    n.vx *= 0.86; n.vy *= 0.86;
    if (n !== dragNode){ n.x += n.vx; n.y += n.vy; }
  }
}

function visible(n){
  return !state.tiersOff.has(n.f.tier);
}
function hit(x){
  if (!state.query) return true;
  return matches(x && x.f ? x.f : x);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // starfield
  ctx.save();
  const g = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.75);
  g.addColorStop(0,'#141a30'); g.addColorStop(1,'#0a0c13');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.restore();

  const cam = state.cam;
  ctx.save();
  ctx.translate(W/2 + cam.x, H/2 + cam.y);
  ctx.scale(cam.k, cam.k);

  // rings
  ctx.strokeStyle = 'rgba(255,255,255,0.032)'; ctx.lineWidth = 1/cam.k;
  for (let r=10;r>=1;r--){ const rr = ringOf[r]; if (!rr) continue;
    ctx.beginPath(); ctx.arc(0,0,rr,0,Math.PI*2); ctx.stroke(); }

  const focus = state.query ? state.hover : (state.sel || state.hover);
  const near = new Set();
  if (focus){ near.add(focus); (adj[focus]||[]).forEach(e => { near.add(e.s.id); near.add(e.t.id); }); }

  // edges
  for (const e of edges){
    if (state.linksOff.has(e.type)) continue;
    if (!visible(e.s) || !visible(e.t)) continue;
    const lt = LINKTYPES[e.type] || {color:'#666',w:1,dash:null};
    let alphaE = 0.30;
    if (focus){
      alphaE = (near.has(e.s.id) && near.has(e.t.id) &&
                (e.s.id===focus || e.t.id===focus)) ? 0.95 : 0.05;
    } else if (state.query){
      alphaE = (hit(e.s) || hit(e.t)) ? 0.4 : 0.04;
    }
    if (alphaE < 0.03) continue;
    ctx.globalAlpha = alphaE;
    ctx.strokeStyle = lt.color;
    ctx.lineWidth = (lt.w * (focus && alphaE>.5 ? 1.9 : 1)) / cam.k;
    ctx.setLineDash(lt.dash ? lt.dash.map(v=>v/cam.k) : []);
    ctx.beginPath();
    const mx = (e.s.x+e.t.x)/2, my = (e.s.y+e.t.y)/2;
    const dx = e.t.x-e.s.x, dy = e.t.y-e.s.y;
    ctx.moveTo(e.s.x, e.s.y);
    ctx.quadraticCurveTo(mx - dy*0.09, my + dx*0.09, e.t.x, e.t.y);
    ctx.stroke();
  }
  ctx.setLineDash([]); ctx.globalAlpha = 1;

  // nodes
  const labels = [];
  for (const n of nodes){
    if (!visible(n)) continue;
    let a = 1;
    if (focus) a = near.has(n.id) ? 1 : 0.14;
    else if (state.query) a = hit(n) ? 1 : 0.11;
    ctx.globalAlpha = a;

    if (n.f.rank >= 8 || n.id === focus){
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r*2.6, 0, Math.PI*2);
      const gg = ctx.createRadialGradient(n.x,n.y,n.r*0.4,n.x,n.y,n.r*2.6);
      gg.addColorStop(0, n.col+'55'); gg.addColorStop(1, n.col+'00');
      ctx.fillStyle = gg; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
    ctx.fillStyle = n.col; ctx.fill();
    if (n.id === state.sel){
      ctx.lineWidth = 2.4/cam.k; ctx.strokeStyle = '#fff'; ctx.stroke();
    } else {
      ctx.lineWidth = 1/cam.k; ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.stroke();
    }

    if (a > 0.3){
      let prio = n.f.rank;
      if (n.id === focus) prio = 100;
      else if (focus && near.has(n.id)) prio = 50 + n.f.rank;
      else if (state.query && hit(n)) prio = 40 + n.f.rank;
      const minRank = cam.k > 1.0 ? 1 : cam.k > 0.72 ? 3 : cam.k > 0.5 ? 5 : cam.k > 0.34 ? 7 : 8;
      if (prio >= 40 || n.f.rank >= minRank) labels.push({n, prio, a});
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // labels: screen space, biggest first, no overlaps
  const placed = [];
  labels.sort((p,q) => q.prio - p.prio);
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (const item of labels){
    const n = item.n;
    const sx = W/2 + cam.x + n.x*cam.k;
    const sy = H/2 + cam.y + n.y*cam.k + n.r*cam.k + 4;
    if (sx < -80 || sx > W+80 || sy < -20 || sy > H+20) continue;
    const big = n.f.rank >= 8 || item.prio >= 40;
    const scale = W < 760 ? 0.86 : 1;
    const fs = Math.max(9, Math.min(15, 9.5 + n.f.rank*0.55) * scale);
    ctx.font = (big ? '600 ' : '') + fs + 'px -apple-system,Segoe UI,Roboto,sans-serif';
    const w = ctx.measureText(n.f.name).width;
    const box = {x: sx-w/2-3, y: sy-2, w: w+6, h: fs+4};
    let clash = false;
    for (const p of placed){
      if (box.x < p.x+p.w && box.x+box.w > p.x && box.y < p.y+p.h && box.y+box.h > p.y){ clash = true; break; }
    }
    if (clash && item.prio < 100) continue;
    placed.push(box);
    ctx.globalAlpha = item.a;
    ctx.lineWidth = 3.4; ctx.strokeStyle = 'rgba(6,8,15,.95)'; ctx.lineJoin = 'round';
    ctx.strokeText(n.f.name, sx, sy);
    ctx.fillStyle = big ? '#ffffff' : '#c3cade';
    ctx.fillText(n.f.name, sx, sy);
  }
  ctx.globalAlpha = 1;
}

function loop(){ if (state.view === 'graph'){ tick(); draw(); } requestAnimationFrame(loop); }

/* interaction */
function toWorld(px,py){
  const c = state.cam;
  return { x:(px - W/2 - c.x)/c.k, y:(py - H/2 - c.y)/c.k };
}
function pick(px,py){
  const p = toWorld(px,py);
  let best = null, bd = 1e9;
  for (const n of nodes){
    if (!visible(n)) continue;
    const d = Math.hypot(n.x-p.x, n.y-p.y);
    if (d < n.r + 9/state.cam.k && d < bd){ bd = d; best = n; }
  }
  return best;
}
let panning = false, last = null, moved = false;
cv.addEventListener('pointerdown', ev => {
  cv.setPointerCapture(ev.pointerId);
  const n = pick(ev.offsetX, ev.offsetY);
  moved = false;
  if (n){ dragNode = n; alpha = Math.max(alpha, .35); }
  else { panning = true; cv.classList.add('grabbing'); }
  last = {x:ev.offsetX, y:ev.offsetY};
});
cv.addEventListener('pointermove', ev => {
  if (dragNode){
    const p = toWorld(ev.offsetX, ev.offsetY);
    dragNode.x = p.x; dragNode.y = p.y; dragNode.vx = dragNode.vy = 0;
    moved = true; alpha = Math.max(alpha, .3);
  } else if (panning){
    state.cam.x += ev.offsetX-last.x; state.cam.y += ev.offsetY-last.y;
    last = {x:ev.offsetX, y:ev.offsetY};
    if (Math.abs(ev.offsetX-last.x)>2) moved = true;
    moved = true;
  } else {
    const n = pick(ev.offsetX, ev.offsetY);
    const id = n ? n.id : null;
    if (id !== state.hover){ state.hover = id; cv.style.cursor = n ? 'pointer' : 'grab'; }
  }
});
cv.addEventListener('pointerup', ev => {
  if (dragNode && !moved) select(dragNode.id);
  else if (!dragNode && !moved){
    const n = pick(ev.offsetX, ev.offsetY);
    if (!n) select(null);
  }
  dragNode = null; panning = false; cv.classList.remove('grabbing');
});
cv.addEventListener('wheel', ev => {
  ev.preventDefault();
  const f = ev.deltaY < 0 ? 1.13 : 1/1.13;
  const before = toWorld(ev.offsetX, ev.offsetY);
  state.cam.k = Math.max(0.22, Math.min(4.5, state.cam.k*f));
  const after = toWorld(ev.offsetX, ev.offsetY);
  state.cam.x += (after.x-before.x)*state.cam.k;
  state.cam.y += (after.y-before.y)*state.cam.k;
}, {passive:false});

/* pinch */
let pinch = null;
cv.addEventListener('touchstart', ev => {
  if (ev.touches.length === 2){
    pinch = {d: Math.hypot(ev.touches[0].clientX-ev.touches[1].clientX,
                           ev.touches[0].clientY-ev.touches[1].clientY), k: state.cam.k};
  }
}, {passive:true});
cv.addEventListener('touchmove', ev => {
  if (pinch && ev.touches.length === 2){
    const d = Math.hypot(ev.touches[0].clientX-ev.touches[1].clientX,
                         ev.touches[0].clientY-ev.touches[1].clientY);
    state.cam.k = Math.max(0.22, Math.min(4.5, pinch.k * d/pinch.d));
  }
}, {passive:true});
cv.addEventListener('touchend', () => { pinch = null; }, {passive:true});

document.getElementById('zin').onclick = () => state.cam.k = Math.min(4.5, state.cam.k*1.28);
document.getElementById('zout').onclick = () => state.cam.k = Math.max(0.22, state.cam.k/1.28);
document.getElementById('resetView').onclick = () => {
  state.cam = {x:0, y:0, k: fitK()}; alpha = 0.7;
};

/* ============================ detail panel ============================ */
const detail = document.getElementById('detail');

function select(id){

  if (!id){ detail.classList.remove('on'); return; }
  const f = byId[id];

  const tm = tierMeta[f.tier];

  });

      '<div class="badges">' +
        '<span class="badge" style="color:'+tm.color+';border-color:'+tm.color+'55;background:'+tm.color+'12">'+tm.name+'</span>' +
        (f.origin ? '<span class="badge" style="color:#9aa3c0;border-color:#2a3252">'+esc(ORIGINS[f.origin]||f.origin)+'</span>' : '') +
        (f.groups||[]).filter(g=>GROUPS[g]).map(g =>
          '<span class="badge" style="color:var(--gold);border-color:var(--gold-dim);background:#1d1a10">'+GROUPS[g]+'</span>').join('') +
      '</div>' +
      '<div class="rank">Weight in Rome<div class="rankbar"><i style="width:'+(f.rank*10)+'%"></i></div>'+f.rank+'/10</div>' +
    '</div>' +
    '<div class="dt-body">' +
      '<div class="sec"><p class="lede">'+esc(f.summary)+'</p></div>' +
      ((f.greek && f.greek!=='none') || f.etruscan ?
        '<div class="sec"><h4>Other names</h4><dl class="kv">' +
          (f.greek ? '<dt>Greek</dt><dd>'+esc(f.greek)+'</dd>' : '') +
          (f.etruscan ? '<dt>Etruscan</dt><dd>'+esc(f.etruscan)+'</dd>' : '') +
        '</dl></div>' : '') +
      '<div class="sec"><h4>Sphere</h4><div class="tags">' +
        f.domains.map(d => '<span class="tag">'+esc(d)+'</span>').join('') + '</div></div>' +
      '<div class="sec"><h4>What they did</h4><ul>' +
        f.deeds.map(d => '<li>'+esc(d)+'</li>').join('') + '</ul></div>' +
      (f.state ? '<div class="sec"><h4>Why Rome cared</h4><p>'+esc(f.state)+'</p></div>' : '') +
      '<div class="sec"><h4>Cult</h4><dl class="kv">' +
        '<dt>Temple</dt><dd>'+esc(f.temple||'—')+'</dd>' +
        '<dt>Festival</dt><dd>'+esc(f.festival||'—')+'</dd>' +
        '<dt>Priest</dt><dd>'+esc(f.priest||'—')+'</dd>' +
      '</dl></div>' +
      ((f.symbols||[]).length ? '<div class="sec"><h4>Attributes</h4><div class="tags">' +
        f.symbols.map(s => '<span class="tag">'+esc(s)+'</span>').join('') + '</div></div>' : '') +
      ((f.epithets||[]).length ? '<div class="sec"><h4>Epithets</h4><div class="tags">' +
        f.epithets.map(s => '<span class="tag it">'+esc(s)+'</span>').join('') + '</div></div>' : '') +
      (relHTML ? '<div class="sec"><h4>Connections ('+(adj[id]||[]).length+')</h4>'+relHTML+'</div>' : '') +
      '<div class="sec"><h4>Ancient sources</h4><div class="src">'+ (f.sources||[]).map(esc).join(' · ') +'</div></div>' +

  if (state.view !== 'graph'){ centreOn(id); render(); }
}

function centreOn(id){
  const n = nmap[id]; if (!n) return;
  state.cam.k = Math.max(state.cam.k, 0.9);
  state.cam.x = -n.x * state.cam.k;
  state.cam.y = -n.y * state.cam.k;
}

/* ============================ other views ============================ */
function render(){
  ['hier','tree','cal'].forEach(v =>
    document.getElementById('v-'+v).classList.toggle('on', state.view===v));

  document.querySelector('.zoombox').style.display = state.view==='graph' ? '' : 'none';

function renderHier(){
  const el = document.getElementById('v-hier');
  let html = '<div class="intro"><h2>The ladder of the Roman heavens</h2>' +
    '<p>Rome never had one tidy pantheon. It had overlapping schemes stacked on top of each other — ' +
    'Ennius&rsquo; twelve <em>Dii Consentes</em>, Varro&rsquo;s twenty <em>Di Selecti</em>, the archaic triad the ' +
    'Capitoline triad replaced, and a floor of native powers so old that by Cicero&rsquo;s day nobody could say ' +
    'what half of them did. The orders below run from the powers that made the world to the mortals it swallowed. ' +
    'The bars under each name are that figure&rsquo;s weight in the Roman state.</p></div>';
  TIERS.forEach(t => {
    if (state.tiersOff.has(t.id)) return;

    if (!list.length) return;

      '<b style="color:'+t.color+'">'+t.name+'</b><em>'+t.desc+'</em><i>'+list.length+'</i></div><div class="cards">';
    list.forEach(f => {

        '<b>'+esc(f.name)+'</b><em>'+esc(f.latin)+'</em>' +

  });
  el.innerHTML = html;
  el.querySelectorAll('[data-go]').forEach(c => c.onclick = () => select(c.dataset.go));
}

function renderTree(){
  const el = document.getElementById('v-tree');
  // generational depth from descent edges (parent + attested line-of)
  const dEdges = edges.filter(e => e.type==='parent' || e.type==='ancestor');
  const parents = {}, kids = {};
  nodes.forEach(n => { parents[n.id]=[]; kids[n.id]=[]; });
  dEdges.forEach(e => { parents[e.t.id].push(e.s.id); kids[e.s.id].push(e.t.id); });
  const inTree = nodes.filter(n => parents[n.id].length || kids[n.id].length);
  const depth = {};
  inTree.forEach(n => depth[n.id] = 0);
  const settle = () => {
    for (let k=0;k<40;k++){
      let ch = false;
      for (const e of dEdges){
        if (depth[e.t.id] < depth[e.s.id]+1){ depth[e.t.id] = depth[e.s.id]+1; ch = true; }
      }
      if (!ch) break;
    }
  };
  settle();
  // a figure with no recorded parent sits one step above its best-dated child
  for (const n of inTree){
    if (parents[n.id].length) continue;
    const anchored = kids[n.id].filter(c => parents[c].length > 1);
    if (!anchored.length) continue;
    const m = Math.min.apply(null, anchored.map(c => depth[c])) - 1;
    if (m > depth[n.id]) depth[n.id] = m;
  }
  settle();
  // the historically deified belong at the end of Roman time, not inside mythic generations
  let baseMax = Math.max.apply(null, Object.values(depth).concat([0]));
  const apoDepth = baseMax + 1;
  inTree.forEach(n => { if (n.f.tier === 'deified') depth[n.id] = apoDepth; });
  const maxD = Math.max.apply(null, Object.values(depth).concat([0]));
  const NAMES = ['The first darkness','Chaos','Night, air and day','Sky and Earth',
                 'The Titans','The Olympian generation','Children of the Olympians',
                 'Grandchildren of the gods','Heroes and Latin kings','The line of Latium',
                 'The Alban house','The Vestal and her sons','Rome founded','Later Roman descent',
                 'Further descent'];
  let html = '<div class="intro"><h2>The bloodline</h2>' +
    '<p>Only descent is drawn here — who fathered or bore whom, plus the claimed lines the Romans ' +
    'themselves asserted. Read downward: the founder of Rome stands a dozen steps below the first ' +
    'darkness, and a Roman politician of 44 BC below him again. That chain was the point of telling ' +
    'the story this way at all. Note that a claimed line (Ascanius to the Caesars, say) compresses ' +
    'centuries into a single step. Click any name to open it; figures with no recorded parent or ' +
    'child are left out.</p></div>';
  for (let d=0; d<=maxD; d++){
    const list = nodes.filter(n => depth[n.id]===d && !state.tiersOff.has(n.f.tier))
                      .sort((a,b) => b.f.rank-a.f.rank);
    if (!list.length) continue;
    const lab = (d === apoDepth) ? 'Historical apotheosis' : (NAMES[d] || ('Generation ' + d));
    html += '<div class="gen"><div class="gen-label">'+lab+'</div><div class="gen-nodes">';
    list.forEach(n => {
      const cls = state.query ? (matches(n.f) ? 'hl' : 'dim') : '';
      html += '<div class="tnode '+cls+'" data-go="'+n.id+'" style="border-bottom-color:'+n.col+'">' +
              esc(n.f.name)+'</div>';
    });
    html += '</div></div>';
  }
  el.innerHTML = html;
  el.querySelectorAll('[data-go]').forEach(c => c.onclick = () => select(c.dataset.go));
}

const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];
function renderCal(){
  const el = document.getElementById('v-cal');
  const buckets = MONTHS.map(() => []);
  const rx = new RegExp('(\\d{1,2})\\s*(?:[-–]\\s*\\d{1,2}\\s*)?(' + MONTHS.join('|') +
                        '|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sept|Sep|Oct|Nov|Dec)', 'g');
  F.forEach(f => {
    if (!f.festival || f.festival === 'None' || f.festival.startsWith('None')) return;
    if (state.tiersOff.has(f.tier)) return;
    f.festival.split(';').forEach(part => {
      let m, found = false;
      const seen = new Set();
      rx.lastIndex = 0;
      while ((m = rx.exec(part))){
        const mi = MONTHS.findIndex(x => x.toLowerCase().startsWith(m[2].toLowerCase().replace('.','')));
        if (mi >= 0 && !seen.has(mi)){
          seen.add(mi);
          buckets[mi].push({f, day:+m[1], text:part.trim()});
          found = true;
        }
      }
      if (!found && /Kalends|movable/i.test(part)) buckets[0].push({f, day:0, text:part.trim()});
    });
  });
  let html = '<div class="intro"><h2>The sacred year</h2>' +
    '<p>Roman religion was a calendar before it was a theology. Days were marked <em>fastus</em> or ' +
    '<em>nefastus</em> — business permitted or forbidden — and the festivals below were fixed points that ' +
    'organised farming, war, trade and mourning. Everything here is drawn from the figures in this map; ' +
    'click an entry to open the god it belongs to.</p></div><div class="months">';
  MONTHS.forEach((mn,i) => {
    const evs = buckets[i].sort((a,b) => a.day-b.day);
    if (!evs.length) return;
    html += '<div class="month"><h5>'+mn+'</h5>';
    evs.forEach(e => {
      html += '<div class="ev" data-go="'+e.f.id+'"><b>'+esc(e.f.name)+'</b> — '+esc(e.text)+'</div>';
    });
    html += '</div>';
  });
  html += '</div>';
  el.innerHTML = html;
  el.querySelectorAll('[data-go]').forEach(c => c.onclick = () => select(c.dataset.go));
}

/* ============================ view switching ============================ */
document.querySelectorAll('.views button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.views button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    state.view = b.dataset.view;
    render();
  };
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') select(null);
  if (e.key === '/' && document.activeElement !== searchEl){ e.preventDefault(); searchEl.focus(); }
});
