<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Roman Universe — Gods, Demigods & Their Connections</title>
<style>
:root{
  --bg:#0a0c13; --bg2:#0f1220; --panel:#12162a; --panel2:#171c33;
  --line:#242c4a; --text:#e8eaf2; --dim:#98a0bd; --dimmer:#69708c;
  --gold:#f0c04a; --gold-dim:#8c7430;
  --t-primordial:#8b7bf5; --t-titan:#c084d8; --t-consentes:#f0c04a;
  --t-major:#f09a4a; --t-native:#4fc78a; --t-chthonic:#8892b8;
  --t-abstract:#4ea8e0; --t-collective:#59c3c3; --t-imported:#e06a9a;
  --t-hero:#e8604c; --t-mortal:#bfae8e; --t-deified:#ffd9a0; --t-monster:#b06848;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--text);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
#app{display:flex;flex-direction:column;height:100%}

/* ---------- top bar ---------- */
header{
  display:flex;align-items:center;gap:14px;padding:10px 16px;
  background:linear-gradient(180deg,#131829,#0d1120);
  border-bottom:1px solid var(--line); z-index:40; flex:none;
}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{
  margin:0;font-size:16px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--gold);white-space:nowrap;
}
.brand span{font-size:11px;color:var(--dimmer);white-space:nowrap}
.spacer{flex:1}
.views{display:flex;gap:4px;background:#0b0f1c;padding:3px;border-radius:8px;border:1px solid var(--line)}
.views button{
  background:none;border:0;color:var(--dim);font:inherit;font-size:12.5px;
  padding:6px 13px;border-radius:6px;cursor:pointer;white-space:nowrap;letter-spacing:.02em;
}
.views button:hover{color:var(--text)}
.views button.on{background:var(--gold);color:#161006;font-weight:600}
#search{
  background:#0b0f1c;border:1px solid var(--line);color:var(--text);
  padding:7px 12px;border-radius:8px;font:inherit;font-size:13px;width:220px;
}
#search:focus{outline:none;border-color:var(--gold-dim)}
#search::placeholder{color:var(--dimmer)}

/* ---------- body ---------- */
main{flex:1;display:flex;min-height:0;position:relative}
#stage{flex:1;position:relative;min-width:0;overflow:hidden}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas.grabbing{cursor:grabbing}
.scrollview{position:absolute;inset:0;overflow-y:auto;padding:22px 26px 60px;display:none}
.scrollview.on{display:block}

/* ---------- left rail ---------- */
aside.rail{
  width:210px;flex:none;background:var(--bg2);border-right:1px solid var(--line);
  overflow-y:auto;padding:14px 12px 40px;
}
.rail h3{
  margin:0 0 8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dimmer);font-weight:600;
}
.rail h3:not(:first-child){margin-top:18px}
.chip{
  display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;
  cursor:pointer;font-size:12px;color:var(--dim);user-select:none;
}
.chip:hover{background:#1a2038;color:var(--text)}
.chip.off{opacity:.32}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip .n{margin-left:auto;font-size:10px;color:var(--dimmer);font-variant-numeric:tabular-nums}
.railbtn{
  width:100%;background:#151a30;border:1px solid var(--line);color:var(--dim);
  font:inherit;font-size:11.5px;padding:6px;border-radius:6px;cursor:pointer;margin-top:6px;
}
.railbtn:hover{color:var(--text);border-color:var(--gold-dim)}
.legendline{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim);padding:2px 6px}
.legendline i{width:20px;height:0;border-top-width:2px;border-top-style:solid;flex:none}

/* ---------- detail panel ---------- */
aside.detail{
  width:400px;flex:none;background:var(--panel);border-left:1px solid var(--line);
  overflow-y:auto;display:none;
}
aside.detail.on{display:block}
.dt-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);position:relative;background:var(--panel2)}
.dt-close{position:absolute;top:12px;right:14px;background:none;border:0;color:var(--dimmer);font-size:20px;cursor:pointer;line-height:1}
.dt-close:hover{color:var(--text)}
.dt-head h2{margin:0 0 3px;font-size:23px;font-weight:600;letter-spacing:.01em;padding-right:26px}
.dt-latin{font-style:italic;color:var(--gold);font-size:13px;margin-bottom:9px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badge{font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:20px;border:1px solid;font-weight:600}
.rank{display:flex;align-items:center;gap:7px;margin-top:11px;font-size:10.5px;color:var(--dimmer);letter-spacing:.08em;text-transform:uppercase}
.rankbar{flex:1;height:4px;background:#0b0f1c;border-radius:3px;overflow:hidden}
.rankbar i{display:block;height:100%;background:linear-gradient(90deg,#8c7430,var(--gold))}
.dt-body{padding:16px 20px 70px}
.sec{margin-bottom:20px}
.sec h4{
  margin:0 0 8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold);font-weight:700;
}
.sec p{margin:0 0 8px;color:#d2d7e6;font-size:13.5px}
.lede{font-size:14.5px;line-height:1.6;color:#eef0f8}
.sec ul{margin:0;padding:0;list-style:none}
.sec ul li{
  position:relative;padding:0 0 9px 16px;font-size:13.3px;color:#cdd3e4;line-height:1.55;
}
.sec ul li:before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--gold-dim)}
.kv{display:grid;grid-template-columns:74px 1fr;gap:4px 10px;font-size:12.6px}
.kv dt{color:var(--dimmer);letter-spacing:.04em}
.kv dd{margin:0;color:#cdd3e4}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;padding:3px 9px;border-radius:5px;background:#1b2138;color:#aab2cc;border:1px solid #232a45}
.tag.it{font-style:italic;color:var(--gold);border-color:var(--gold-dim);background:#1d1a10}
.rel{
  display:flex;align-items:baseline;gap:8px;padding:5px 7px;border-radius:6px;cursor:pointer;
  font-size:12.8px;border-left:2px solid transparent;
}
.rel:hover{background:#1a2038}
.rel b{font-weight:600;flex:none}
.rel span{color:var(--dimmer);font-size:11.8px}
.relgroup{margin-bottom:11px}
.relgroup>div:first-child{
  font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);
  margin:0 0 3px 7px;font-weight:600;
}
.src{font-size:11.5px;color:var(--dimmer);font-style:italic;line-height:1.7}

/* ---------- hierarchy view ---------- */
.band{margin-bottom:24px}
.band-head{display:flex;align-items:baseline;gap:11px;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.band-head b{font-size:14px;letter-spacing:.05em}
.band-head em{font-style:normal;font-size:11.5px;color:var(--dimmer);flex:1}
.band-head i{font-style:normal;font-size:11px;color:var(--dimmer);font-variant-numeric:tabular-nums}
.cards{display:flex;flex-wrap:wrap;gap:8px}
.card{
  background:var(--panel);border:1px solid var(--line);border-left-width:3px;
  border-radius:8px;padding:9px 12px;cursor:pointer;min-width:150px;max-width:250px;transition:.12s;
}
.card:hover{background:var(--panel2);transform:translateY(-1px)}
.card b{display:block;font-size:13.5px;font-weight:600}
.card em{display:block;font-style:italic;font-size:11px;color:var(--dimmer);margin-top:1px}
.card u{
  display:block;text-decoration:none;font-size:11.5px;color:#9aa3c0;margin-top:5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.card .pips{display:flex;gap:2px;margin-top:6px}
.card .pips i{width:8px;height:3px;border-radius:2px;background:#2a3252}

/* ---------- bloodline view ---------- */
#treewrap{position:relative}
.gen{display:flex;gap:22px;align-items:flex-start;margin-bottom:16px}
.gen-label{
  width:120px;flex:none;text-align:right;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dimmer);padding-top:9px;font-weight:600;
}
.gen-nodes{flex:1;display:flex;flex-wrap:wrap;gap:6px}
.tnode{
  border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;
  padding:5px 10px;font-size:12.5px;cursor:pointer;background:var(--panel);white-space:nowrap;
}
.tnode:hover{background:var(--panel2)}
.tnode.hl{background:#2a2210;border-color:var(--gold)}
.tnode.dim{opacity:.28}

/* ---------- calendar view ---------- */
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px}
.month{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
.month h5{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.month .ev{font-size:12.3px;color:#c4cbdf;padding:3px 0;cursor:pointer;border-bottom:1px solid #1a2038}
.month .ev:last-child{border:0}
.month .ev:hover{color:var(--gold)}
.month .ev b{color:var(--text);font-weight:600}

/* ---------- misc ---------- */
.intro{max-width:820px;margin:0 auto 26px;color:#b9c0d6;font-size:13.5px}
.intro h2{color:var(--gold);font-size:18px;margin:0 0 8px;letter-spacing:.03em}
.hint{
  position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
  background:rgba(12,15,26,.9);border:1px solid var(--line);border-radius:20px;
  padding:6px 15px;font-size:11.5px;color:var(--dimmer);pointer-events:none;z-index:5;
  white-space:nowrap;
}
.zoombox{position:absolute;bottom:12px;right:12px;display:flex;flex-direction:column;gap:4px;z-index:6}
.zoombox button{
  width:30px;height:30px;background:rgba(18,22,42,.94);border:1px solid var(--line);
  color:var(--dim);font-size:15px;border-radius:7px;cursor:pointer;line-height:1;
}
.zoombox button:hover{color:var(--gold);border-color:var(--gold-dim)}
#toggleRail{display:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#252c48;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#333c60}

@media (max-width:900px){
  aside.rail{position:absolute;left:0;top:0;bottom:0;z-index:30;transform:translateX(-100%);transition:.2s}
  aside.rail.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.6)}
  aside.detail{position:absolute;right:0;top:0;bottom:0;width:100%;max-width:420px;z-index:35}
  #toggleRail{display:block;background:#151a30;border:1px solid var(--line);color:var(--dim);
    border-radius:7px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer;flex:none}
  .brand span{display:none}
  header{gap:8px;padding:8px 10px;flex-wrap:wrap}
  .brand h1{font-size:13px}
  .spacer{display:none}
  #search{flex:1;width:auto;min-width:0}
  .views{order:5;width:100%;justify-content:space-between}
  .views button{flex:1;padding:7px 4px;font-size:11.5px;text-align:center}
  .hint{font-size:10.5px;padding:5px 11px}
  .scrollview{padding:16px 14px 60px}
  .gen{gap:10px}
  .gen-label{width:78px;font-size:9px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="toggleRail">☰</button>
    <div class="brand">
      <h1>The Roman Universe</h1>
      <span id="count"></span>
    </div>
    <div class="spacer"></div>
    <input id="search" type="search" placeholder="Search gods, deeds, cults…" autocomplete="off">
    <div class="views">
      <button data-view="graph" class="on">Constellation</button>
      <button data-view="hier">Hierarchy</button>
      <button data-view="tree">Bloodline</button>
      <button data-view="cal">Sacred Year</button>
    </div>
  </header>

  <main>
    <aside class="rail" id="rail">
      <h3>Orders of Being</h3>
      <div id="tierChips"></div>
      <button class="railbtn" id="allTiers">Show all orders</button>
      <h3>Ties</h3>
      <div id="linkChips"></div>
      <h3>Reading the map</h3>
      <div class="legendline" style="color:var(--dim);font-size:11px;display:block;padding:2px 6px 8px">
        Distance from the centre is power. Jupiter sits at the middle; the further out a figure lies,
        the less the Roman state depended on them. Dot size is the same measure.
      </div>
      <button class="railbtn" id="resetView">Recentre the sky</button>
    </aside>

    <div id="stage">
      <canvas id="cv"></canvas>
      <div class="hint" id="hint">Drag to pan · scroll to zoom · click a figure</div>
      <div class="zoombox">
        <button id="zin">+</button><button id="zout">−</button>
      </div>
      <div class="scrollview" id="v-hier"></div>
      <div class="scrollview" id="v-tree"></div>
      <div class="scrollview" id="v-cal"></div>
    </div>

    <aside class="detail" id="detail"></aside>
  </main>
</div>

<script>
const DATA = {"tiers":[{"id":"primordial","name":"Primordial Powers","color":"#8b7bf5","desc":"The first things: sky, earth, night, the pit. Cosmology rather than cult."},{"id":"titan","name":"Titans & Elder Gods","color":"#c084d8","desc":"The generation Jupiter overthrew — and, in Saturn's case, the one Rome liked best."},{"id":"consentes","name":"The Twelve — Dii Consentes","color":"#f0c04a","desc":"Six gods and six goddesses whose gilded statues stood together in the Forum."},{"id":"major","name":"Great Gods beyond the Twelve","color":"#f09a4a","desc":"Janus, Liber, Quirinus and the rest — outside the Greek scheme, central to the Roman one."},{"id":"native","name":"Native Italic Powers","color":"#4fc78a","desc":"Gods of boundaries, orchards, granaries and springs. The oldest layer, and the most Roman."},{"id":"chthonic","name":"The Underworld","color":"#8892b8","desc":"Dis, Proserpina and the staff of the dead — plus the machinery of Roman funerals."},{"id":"abstract","name":"Personifications & Virtues","color":"#4ea8e0","desc":"Rome's speciality: abstractions with temples, priesthoods and political uses."},{"id":"collective","name":"Collectives & Household Spirits","color":"#59c3c3","desc":"Lares, Penates, Manes, Fates and Furies — the gods most Romans actually prayed to."},{"id":"imported","name":"Imported & Mystery Cults","color":"#e06a9a","desc":"Brought in by Sibylline decree or by soldiers: Magna Mater, Isis, Mithras, Aesculapius."},{"id":"hero","name":"Demigods & Heroes","color":"#e8604c","desc":"Half-divine, half-historical: Hercules, Aeneas, Romulus, and the losers who opposed them."},{"id":"mortal","name":"Mortals of the Legend","color":"#bfae8e","desc":"Kings, queens, traitors and exempla — the human cast of Rome's founding story."},{"id":"deified","name":"Deified Mortals","color":"#ffd9a0","desc":"Rome's own invention: named human beings voted into godhead by the Senate."},{"id":"monster","name":"Monsters & Antagonists","color":"#b06848","desc":"What the heroes had to get past — including Cacus, the one Italy made itself."}],"figures":[{"id":"chaos","name":"Chaos","latin":"Chaos","greek":"Chaos","tier":"primordial","rank":4,"gender":"n","origin":"greek","domains":["the unformed first state","prime matter"],"summary":"Not a god in Roman hands but a condition: the rudis indigestaque moles, the raw undigested mass out of which a god sorted the world.","deeds":["Ovid opens the Metamorphoses (1.5-9) by recasting Hesiod's yawning gap as Stoic prime matter — sea, land and air jumbled together, formless and at war with itself.","An unnamed god (deus et melior natura) separates the four elements and gives the cosmos its shape; this is the Roman creation, and it is an act of engineering, not birth.","In Hyginus' Fabulae the genealogy runs from Caligo (Mist) to Chaos, and from Chaos come Nox, Dies, Erebus and Aether."],"state":"Rome had no cult of Chaos. Its importance is philosophical: Roman cosmology begins with matter to be organised, which mirrors how Romans understood their own achievement — order imposed on disorder.","temple":"None","festival":"None","priest":"None","symbols":["formless mass","warring elements"],"epithets":["rudis indigestaque moles"],"sources":["Ovid, Metamorphoses 1.5-20","Hyginus, Fabulae praef."],"groups":["cosmogony"]},{"id":"caligo","name":"Caligo","latin":"Caligo","greek":"Skotos","tier":"primordial","rank":2,"gender":"f","origin":"latin","domains":["mist","primordial obscurity"],"summary":"The Mist that stands before Chaos in the Latin genealogy — the correct Latin name for the first darkness.","deeds":["Hyginus' preface reads Ex Caligine Chaos — from Mist, Chaos: the Latin tradition puts obscurity before the unformed mass.","Mother, by Chaos, of Nox, Dies, Erebus and Aether."],"state":"Included here as a correction: the name 'Scotus' that circulates in modern lists is an untranslated Greek word stranded in the Hyginus manuscript tradition. The Latin is Caligo.","temple":"None","festival":"None","priest":"None","symbols":["mist","obscurity"],"epithets":[],"sources":["Hyginus, Fabulae praef."],"groups":["cosmogony"]},{"id":"caelus","name":"Caelus","latin":"Caelus / Caelum","greek":"Uranus","tier":"primordial","rank":6,"gender":"m","origin":"latin","domains":["the sky","the vault of heaven","the generative aether"],"summary":"The sky as the first father — castrated by his own son Saturn, and so the origin of both Venus and the whole dynasty of gods.","deeds":["With Terra he produces the Titans, the Cyclopes and the hundred-handed Centimani, then imprisons the monstrous ones inside their mother, which provokes the revolt.","Castrated by Saturn with a sickle Terra herself provides; from the severed genitals cast into the sea, Venus is born of the foam.","Cicero (De Natura Deorum 2) reads the whole episode allegorically: the generative aether does not need bodily organs to create — the myth is physics in disguise."],"state":"Theologically foundational, cultically absent — Rome took the genealogy without the worship. But he is prominent in Augustan art: Caelus holds the billowing canopy of heaven across the top of the cuirass of the Augustus of Prima Porta, framing the emperor's rule as cosmically sanctioned.","temple":"No temple at Rome","festival":"None","priest":"None","symbols":["mantle held over the head as the arch of the sky","the zodiac"],"epithets":["Caelus Aeternus"],"sources":["Cicero, De Natura Deorum 3.44","Varro, De Lingua Latina 5.57-58","Ennius, Euhemerus"],"groups":["cosmogony"]},{"id":"terra","name":"Terra Mater / Tellus","latin":"Terra Mater, Tellus","greek":"Gaia","etruscan":"Cel Ati","tier":"primordial","rank":7,"gender":"f","origin":"italic","domains":["the earth itself","productive power","oaths","the dead","earthquakes"],"summary":"The earth as mother and as witness — and, unlike Greek Gaia, an active Roman state cult with a temple, a flamen and one of the strangest rites in the calendar.","deeds":["With Caelus she produces the Titans, then arms Saturn with the sickle against his father.","After the Titans fall she brings forth the Giants to avenge them, and from the Giants' blood a violent race of men.","When a chasm opened in the Roman Forum and the seers said the earth demanded Rome's greatest treasure, Marcus Curtius rode fully armed into the pit, which closed over him.","Her name is invoked alongside Jupiter in the most solemn Roman oaths, and offerings for the dead are made to her."],"state":"Served by the flamen Cerialis jointly with Ceres. The Fordicidia — thirty pregnant cows sacrificed, one per curia, the unborn calves burned by the senior Vestal — is among the most archaic surviving Roman rites, organised by the oldest political divisions of the people. The Tellus panel of the Ara Pacis made her the visual centrepiece of Augustan peace propaganda.","temple":"Temple of Tellus on the Esquiline (Carinae), vowed 268 BC by P. Sempronius Sophus during an earthquake in battle","festival":"Fordicidia, 15 April; Sementivae, late January; 13 December","priest":"flamen Cerialis (shared with Ceres)","symbols":["cornucopia","reclining woman with children and beasts","fruits of the field"],"epithets":["Terra Mater","Tellus Mater","Tellumo (male aspect)"],"sources":["Ovid, Fasti 4.629-672","Livy 7.6 (Curtius)","Ara Pacis Augustae"],"groups":["cosmogony","di_selecti"]},{"id":"nox","name":"Nox","latin":"Nox","greek":"Nyx","tier":"primordial","rank":5,"gender":"f","origin":"latin","domains":["night","the mother of terrors"],"summary":"Night, who bore almost everything Romans feared: Death, Fate, Sleep, Old Age, Strife, Retribution and the Parcae.","deeds":["Hyginus' preface makes her, with Erebus, the mother of Fatum, Senectus, Mors, Letum, Somnus, the Somnia, Amor, Discordia, Miseria, Nemesis, Styx and the Parcae.","Virgil gives her a chariot crossing the sky (Aeneid 5.721) and has Aeneas sacrifice black victims to her at the mouth of the underworld (6.250).","In Hyginus, Erebus is both her brother and her consort."],"state":"Unlike most Greek-derived abstractions, Nox received real Roman cult: black-fleeced victims, sacrificed at night, before consulting the dead.","temple":"None","festival":"Invoked in nocturnal and chthonic rites","priest":"None","symbols":["star-strewn mantle","chariot","black victims"],"epithets":["Nox alma"],"sources":["Hyginus, Fabulae praef.","Virgil, Aeneid 5.721, 6.250"],"groups":["cosmogony"]},{"id":"erebus","name":"Erebus","latin":"Erebus","greek":"Erebos","tier":"primordial","rank":3,"gender":"m","origin":"greek","domains":["the darkness beneath the earth"],"summary":"Underworld darkness — in Latin poets more often a place than a person, a metonym for the whole realm of the dead.","deeds":["Brother and consort of Nox; with her, father of the whole brood of night-born powers.","Menoetius the Titan is blasted down into Erebus by Jupiter's bolt during the Titanomachy."],"state":"No Roman cult. Latin usage drifts steadily from person to place — Erebo demissus means simply 'sent down to the dark'.","temple":"None","festival":"None","priest":"None","symbols":["darkness"],"epithets":[],"sources":["Hyginus, Fabulae praef.","Virgil, Aeneid 6"],"groups":["cosmogony","underworld"]},{"id":"aether","name":"Aether","latin":"Aether","greek":"Aither","tier":"primordial","rank":3,"gender":"m","origin":"greek","domains":["the upper bright air","the fiery heaven"],"summary":"The shining upper air — for Roman Stoics, the active fiery principle that fertilises the earth with rain.","deeds":["With his sister Dies he fathers Terra, Caelum and Mare in Hyginus' scheme.","Virgil's pater Aether descends in fertile showers into the lap of his joyful bride, the Earth (Georgics 2.325) — a cosmogony written as agriculture."],"state":"Cultless, but philosophically central: Stoic physics gave Romans a way to read all their inherited myths as descriptions of natural process.","temple":"None","festival":"None","priest":"None","symbols":["bright upper air","rain"],"epithets":["pater Aether"],"sources":["Hyginus, Fabulae praef.","Virgil, Georgics 2.325"],"groups":["cosmogony"]},{"id":"dies","name":"Dies","latin":"Dies","greek":"Hemera","tier":"primordial","rank":2,"gender":"f","origin":"greek","domains":["day","daylight"],"summary":"Day, the sister and consort of Aether — barely a person in Latin, since dies is normally a masculine common noun.","deeds":["Bears Terra, Caelum and Mare to Aether in the Hyginus genealogy."],"state":"A feminine calque of Greek Hemera, rare outside Hyginus. Included to show where the Latin tradition strains against Greek genealogy.","temple":"None","festival":"None","priest":"None","symbols":["daylight"],"epithets":[],"sources":["Hyginus, Fabulae praef."],"groups":["cosmogony"]},{"id":"tartarus","name":"Tartarus","latin":"Tartarus","greek":"Tartaros","tier":"primordial","rank":4,"gender":"m","origin":"greek","domains":["the abyss of punishment"],"summary":"The pit below the underworld — in Virgil a walled prison with a gate, a jailer and a hierarchy of torments, not an active god.","deeds":["Virgil measures it precisely: Tartarus sinks twice as far below as Olympus stands above the earth (Aeneid 6.577-581).","Tisiphone in a bloody cloak keeps the gate sleepless; Rhadamanthus inside forces confession of concealed sins.","With Terra he fathers the Gigantes and Typhoeus."],"state":"Rome converted the Greek pit into a place of formal judicial procedure — the punished are tried, sentenced and held, in a system a Roman jurist would recognise.","temple":"None","festival":"None","priest":"None","symbols":["adamantine gate","triple wall","the fire-river Phlegethon"],"epithets":[],"sources":["Virgil, Aeneid 6.548-627","Hyginus, Fabulae praef."],"groups":["cosmogony","underworld"]},{"id":"pontus","name":"Pontus","latin":"Pontus","greek":"Pontos","tier":"primordial","rank":2,"gender":"m","origin":"greek","domains":["the sea as element"],"summary":"The sea before there were sea-gods; father, on Terra, of Nereus, Thaumas, Phorcys and Ceto.","deeds":["Fathers the elder sea-powers, and so the Nereids, the Harpies, the Gorgons and Scylla's line."],"state":"Latin uses pontus as an ordinary word for 'the deep'. The personification is Greek and cultless at Rome, where the sea belonged to Neptune and Salacia.","temple":"None","festival":"None","priest":"None","symbols":["open sea"],"epithets":[],"sources":["Hyginus, Fabulae praef."],"groups":["cosmogony","sea"]},{"id":"oceanus","name":"Oceanus","latin":"Oceanus","greek":"Okeanos","tier":"titan","rank":4,"gender":"m","origin":"greek","domains":["the world-encircling river","all fresh water","the Atlantic"],"summary":"The river that rings the world, and the one Titan who refused to fight — father of three thousand Oceanids and every river on earth.","deeds":["Abstains from the Titanomachy and keeps his domain when the rest are thrown down.","With Tethys fathers the Oceanids and the rivers, including the Tiber's mythic kin.","Receives sacrifice from Roman sailors putting to sea (Aeneid 5)."],"state":"The one Titan whose name naturalised completely into Latin: Oceanus is the Atlantic, the edge of the known world, and crossing it (Caesar to Britain, Claudius after him) was propaganda gold.","temple":"None","festival":"Sailors' offerings","priest":"None","symbols":["crab-claw horns","urn pouring water","sea-dragon"],"epithets":[],"sources":["Hyginus, Fabulae praef.","Virgil, Aeneid 5"],"groups":["cosmogony","sea"]},{"id":"saturn","name":"Saturn","latin":"Saturnus","greek":"Cronus","etruscan":"Satre","tier":"titan","rank":9,"gender":"m","origin":"italic","domains":["sowing and seed-corn","the Golden Age","time","liberation","the public treasury"],"summary":"The Titan who ate his children in Greece and taught farming in Italy — Rome's deposed king of the Golden Age, and the god in whose temple the state kept its money.","deeds":["Castrates his father Caelus with the sickle Terra gives him, and from the severed genitals Venus is born.","Devours each of his children at birth to escape the prophecy, until Ops hands him a swaddled stone instead of Jupiter.","Overthrown by Jupiter in the Titanomachy, he flees to Latium, is sheltered by Janus, and reigns over the Golden Age, teaching men agriculture and law (Aeneid 8.319-325).","His feet were bound in woollen fetters in his own temple all year, and loosed only for the Saturnalia — the god of liberty kept tied up until his festival."],"state":"The aerarium Saturni, the state treasury, lived in his temple along with the standards and the bronze law-tablets; he was the guarantor of public wealth. Sacrifice to him was made Graeco ritu, bare-headed, unlike every other Roman rite. One of Varro's twenty Di Selecti.","temple":"Temple of Saturn, west end of the Forum Romanum, traditionally dedicated 497 BC","festival":"Saturnalia, 17-23 December — slaves dined with masters, gifts (sigillaria) exchanged, gambling made legal, a mock king chosen, the freedman's cap worn by all","priest":"Rites conducted by the pontiffs, Greek rite","symbols":["sickle","scythe","veiled head","woollen fetters"],"epithets":["Saturnus Pater","Sterculius","Stercutus"],"sources":["Virgil, Aeneid 8.319-325","Ovid, Fasti 1.235-254","Cicero, De Natura Deorum 2.64","Macrobius, Saturnalia 1"],"groups":["di_selecti","golden_age"]},{"id":"ops","name":"Ops","latin":"Ops","greek":"Rhea","tier":"titan","rank":6,"gender":"f","origin":"italic","domains":["abundance","harvest wealth","the stored crop"],"summary":"The stored grain of the Roman state made into a goddess — her name is the Latin word for wealth itself (opes).","deeds":["Hides the infant Jupiter on Crete and gives Saturn a swaddled stone to swallow in his place.","Paired in cult with Consus, god of the buried granary — sowing (Consivia) and storing, the two halves of survival.","Her Regia shrine could be entered only by the Vestals and the Pontifex Maximus, and the sacrifice was made seated, touching the earth."],"state":"Her festivals are deliberately interleaved with Consus' and Saturn's — Opiconsivia four days after the August Consualia, Opalia two days after the Saturnalia — mapping the whole agricultural year onto the calendar.","temple":"Shrine in the Regia; temple on the Capitol","festival":"Opiconsivia, 25 August; Opalia, 19 December","priest":"Vestals and the Pontifex Maximus","symbols":["cornucopia","sceptre","corn ears","open hand"],"epithets":["Ops Consivia","Ops Opifera"],"sources":["Varro, De Lingua Latina 6.21","Macrobius, Saturnalia 1.10"],"groups":["golden_age"]},{"id":"hyperion","name":"Hyperion","latin":"Hyperion","greek":"Hyperion","tier":"titan","rank":3,"gender":"m","origin":"greek","domains":["the elder sun","light"],"summary":"The Titan of light, father of Sol, Luna and Aurora — in Latin verse mostly a patronymic for the Sun himself.","deeds":["With Thea he fathers the three luminaries who divide the sky between them."],"state":"No Roman cult; Ovid's Hyperione natus is simply an elevated way of saying 'the Sun'.","temple":"None","festival":"None","priest":"None","symbols":["light"],"epithets":[],"sources":["Ovid, Metamorphoses 4.192"],"groups":[]},{"id":"thea","name":"Thea","latin":"Thea / Thia","greek":"Theia","tier":"titan","rank":2,"gender":"f","origin":"greek","domains":["divine radiance"],"summary":"Mother of Sol, Luna and Aurora; almost invisible in Latin, a transliteration rather than a Roman name.","deeds":["Bears the three luminaries to Hyperion."],"state":"Listed for completeness of the genealogy; she has no Latin identity of her own.","temple":"None","festival":"None","priest":"None","symbols":[],"epithets":[],"sources":["Hyginus, Fabulae praef."],"groups":[]},{"id":"coeus","name":"Coeus","latin":"Coeus / Polus","greek":"Koios","tier":"titan","rank":2,"gender":"m","origin":"greek","domains":["the axis of heaven","intellect"],"summary":"Father of Latona and so grandfather of Apollo and Diana — called Polus in the Latin tradition.","deeds":["With Phoebe fathers Latona and Asteria, and so stands two generations above Augustus' patron gods."],"state":"Hyginus calls him POLUS in the preface and then lists a second 'Coeus' among the Giants — a genuine confusion in the Latin transmission worth knowing about.","temple":"None","festival":"None","priest":"None","symbols":["the celestial pole"],"epithets":["Polus"],"sources":["Hyginus, Fabulae praef."],"groups":[]},{"id":"phoebe","name":"Phoebe","latin":"Phoebe","greek":"Phoibe","tier":"titan","rank":2,"gender":"f","origin":"greek","domains":["prophetic brightness"],"summary":"Grandmother of Apollo and Diana — and a reading trap, since in Latin verse Phoebe almost always means Diana or the Moon.","deeds":["With Coeus bears Latona and Asteria."],"state":"The name collision matters: when a Latin poet writes Phoebe he is nearly always naming the Moon, not the Titaness.","temple":"None","festival":"None","priest":"None","symbols":["moon"],"epithets":[],"sources":["Hyginus, Fabulae praef."],"groups":[]},{"id":"crius","name":"Crius","latin":"Crius","greek":"Krios","tier":"titan","rank":1,"gender":"m","origin":"greek","domains":["the constellations","the ram"],"summary":"A Titan who exists in Latin only as a name in a list — but whose sons Pallas, Astraeus and Perses father Victoria, the Winds and Trivia.","deeds":["With Eurybia fathers Astraeus, Pallas and Perses."],"state":"Essentially absent from Roman cult and poetry; his significance is entirely genealogical.","temple":"None","festival":"None","priest":"None","symbols":[],"epithets":[],"sources":["Hyginus, Fabulae praef."],"groups":[]},{"id":"iapetus","name":"Iapetus","latin":"Iapetus","greek":"Iapetos","tier":"titan","rank":3,"gender":"m","origin":"greek","domains":["mortality","the ancestry of mankind"],"summary":"Father of Prometheus, Epimetheus and Atlas — and so, through Prometheus, ancestor of the human race.","deeds":["With Clymene fathers the four Titans whose choices determine the human condition: foresight, hindsight, endurance and violence."],"state":"Horace's audax Iapeti genus — 'the daring offspring of Iapetus' — is Prometheus, who brought fire and, with it, a new cohort of fevers to the earth (Odes 1.3).","temple":"None","festival":"None","priest":"None","symbols":[],"epithets":[],"sources":["Horace, Odes 1.3.27","Hyginus, Fabulae praef."],"groups":[]},{"id":"tethys","name":"Tethys","latin":"Tethys","greek":"Tethys","tier":"titan","rank":2,"gender":"f","origin":"greek","domains":["the nursing sea","fresh water"],"summary":"Wife of Oceanus and mother of every river and spring — routinely confused by Latin poets with Thetis the Nereid.","deeds":["Bears the three thousand Oceanids and all the world's rivers to Oceanus."],"state":"In Latin poetry her name is usually just a grand word for the sea. Note the trap: Tethys the Titaness is not Thetis, mother of Achilles — and Roman authors themselves slip between them.","temple":"None","festival":"None","priest":"None","symbols":["water","winged brow"],"epithets":[],"sources":["Ovid, Metamorphoses 2.509"],"groups":["sea"]},{"id":"themis","name":"Themis","latin":"Themis","greek":"Themis","tier":"titan","rank":3,"gender":"f","origin":"greek","domains":["divine law","right order","oracles"],"summary":"Divine law personified — she held Delphi before Apollo, and it is she who tells Deucalion how to remake the human race.","deeds":["Held the Delphic oracle before Apollo took it.","After the flood, tells Deucalion and Pyrrha to throw the bones of their great mother behind them — the stones of the earth, which become men and women (Ovid, Met. 1.379ff).","Bears the Horae and, in some accounts, the Parcae to Jupiter."],"state":"No Roman cult of her own. Her Roman functional heir is Iustitia, and Augustan poets exploit the substitution.","temple":"None","festival":"None","priest":"None","symbols":["scales","tripod"],"epithets":[],"sources":["Ovid, Metamorphoses 1.320-415"],"groups":[]},{"id":"mnemosyne","name":"Mnemosyne / Moneta","latin":"Moneta","greek":"Mnemosyne","tier":"titan","rank":4,"gender":"f","origin":"greek","domains":["memory","the mother of the Muses"],"summary":"Memory — and, under her Latin name Moneta, a Titaness whose name ended up stamped on every coin in the empire.","deeds":["Lies with Jupiter for nine consecutive nights and bears the nine Muses.","Hyginus' preface names her among the Titans as MONETA, the Latin equivalence exploited by Livius Andronicus when he turned the Greek Mousa into the Italic Camena."],"state":"The chain Memory → Moneta → Juno Moneta → the mint on the Arx is how the Latin word for 'money' came to exist. Whether the etymology is real or ancient wordplay, Romans believed it.","temple":"Absorbed into the cult of Juno Moneta on the Arx","festival":"1 June (Juno Moneta)","priest":"None","symbols":["memory","the mint"],"epithets":["Moneta"],"sources":["Hyginus, Fabulae praef.","Livius Andronicus, Odusia fr. 1"],"groups":[]},{"id":"prometheus","name":"Prometheus","latin":"Prometheus","greek":"Prometheus","tier":"titan","rank":5,"gender":"m","origin":"greek","domains":["forethought","the making of man","fire"],"summary":"The Titan who moulded humans out of clay and then stole fire for them — in Roman hands, the sculptor rather than the thief.","deeds":["Moulds the first men from clay and water (Ovid, Met. 1.82) — the version Romans preferred.","Steals fire in a hollow fennel stalk and gives it to mankind.","Chained to the Caucasus, his liver eaten daily by an eagle and renewed each night; freed at last by Hercules.","His son Deucalion and Epimetheus' daughter Pyrrha are the only survivors of Jupiter's flood."],"state":"Roman emphasis falls on creation, not rebellion. Horace makes his fire-theft the source of fever and death — a conservative reading in which stolen knowledge costs more than it gives.","temple":"None","festival":"None","priest":"None","symbols":["clay","fennel stalk","eagle","chains"],"epithets":[],"sources":["Ovid, Metamorphoses 1.82-88","Horace, Odes 1.3","Hyginus, Fabulae 142, 144"],"groups":[]},{"id":"epimetheus","name":"Epimetheus","latin":"Epimetheus","greek":"Epimetheus","tier":"titan","rank":2,"gender":"m","origin":"greek","domains":["afterthought"],"summary":"The brother who thinks second — he accepts Pandora and her jar despite Prometheus' warning.","deeds":["Takes Pandora as wife; the jar is opened and every evil escapes into the world, leaving only Hope inside.","Father of Pyrrha, who with Deucalion survives the flood."],"state":"Hyginus (Fabulae 142) is the main Latin source for the Pandora sequence; the story never took root in Roman cult.","temple":"None","festival":"None","priest":"None","symbols":["the jar"],"epithets":[],"sources":["Hyginus, Fabulae 142"],"groups":[]},{"id":"atlas","name":"Atlas","latin":"Atlas","greek":"Atlas","tier":"titan","rank":4,"gender":"m","origin":"greek","domains":["the burden of the sky","astronomy","the far west"],"summary":"Condemned to hold up the sky, and finally turned into the mountain range that still carries his name — grandfather of Mercury.","deeds":["Sentenced by Jupiter after the Titanomachy to hold the vault of heaven on his shoulders forever.","Refuses hospitality to Perseus, who shows him the Gorgon's head; he petrifies into the Atlas mountains, his beard becoming forests and his bones stone (Ovid, Met. 4.628-662).","Father of the Pleiades, the Hyades and Calypso; through his daughter Maia he is Mercury's grandfather."],"state":"The petrifaction is Ovid's own invention. For Romans Atlas marked the western limit of the world, which made him a useful figure for the geography of empire.","temple":"None","festival":"None","priest":"None","symbols":["the celestial globe","mountains"],"epithets":[],"sources":["Ovid, Metamorphoses 4.628-662","Virgil, Aeneid 4.246-251"],"groups":[]},{"id":"pallas_titan","name":"Pallas (the Titan)","latin":"Pallas","greek":"Pallas","tier":"titan","rank":3,"gender":"m","origin":"greek","domains":["warcraft","the campaign season"],"summary":"A Titan of war whose children are Victory, Force, Power and Rivalry — the abstractions Rome most wanted on its side.","deeds":["With Styx fathers Victoria (Nike), Vis, Cratos and Zelus, who take Jupiter's side in the Titanomachy and become his permanent attendants."],"state":"His daughter Victoria became one of Rome's central state goddesses. Beware the triple name collision: this Pallas is neither Pallas Athena/Minerva nor Pallas the son of Evander.","temple":"None","festival":"None","priest":"None","symbols":["spear"],"epithets":[],"sources":["Hyginus, Fabulae praef."],"groups":[]},{"id":"astraeus","name":"Astraeus","latin":"Astraeus","greek":"Astraios","tier":"titan","rank":3,"gender":"m","origin":"greek","domains":["the stars","the winds at dusk"],"summary":"Father of the four Winds and of the stars, by Aurora.","deeds":["With Aurora fathers Aquilo, Auster, Favonius and Volturnus, and the stars of the sky."],"state":"Virgil ignores him and subordinates the Winds instead to Aeolus, their king and jailer — a more Roman arrangement, since it puts the winds under command.","temple":"None","festival":"None","priest":"None","symbols":["stars"],"epithets":[],"sources":["Hyginus, Fabulae praef.","Virgil, Aeneid 1.52-63"],"groups":[]},{"id":"perses","name":"Perses","latin":"Perses","greek":"Perses","tier":"titan","rank":2,"gender":"m","origin":"greek","domains":["destruction"],"summary":"Father, by Asteria, of Hecate — whom Romans call Trivia, goddess of the three-way crossroads.","deeds":["Fathers Hecate/Trivia, the only Titan-descendant honoured equally in heaven, earth and sea."],"state":"His daughter matters far more than he does: Trivia is Virgil's standard name for Hecate, and her crossroads shrines were everywhere in Italy.","temple":"None","festival":"None","priest":"None","symbols":[],"epithets":[],"sources":["Hyginus, Fabulae praef.","Virgil, Aeneid 6.13, 6.35"],"groups":[]},{"id":"latona","name":"Latona","latin":"Latona","greek":"Leto","etruscan":"Letun","tier":"titan","rank":6,"gender":"f","origin":"italic","domains":["motherhood","protection of the young","modesty"],"summary":"Hunted across the whole earth by Juno's jealousy until floating Delos took her in — and then the mother of the two gods Augustus built his regime around.","deeds":["Driven from land to land by Juno and by the serpent Python until only unanchored Delos would receive her; there she bears Apollo and Diana.","Turns the Lycian peasants who muddy her drinking water into frogs (Ovid, Met. 6.313-381).","Her children shoot down all fourteen of Niobe's for boasting that she had borne more."],"state":"Fully naturalised at Rome, with an Etruscan antecedent (Letun) behind the Latin name. She appeared with Apollo and Diana at the Secular Games of 17 BC, which framed the Augustan regime as divinely parented.","temple":"Shrine within the precinct of Apollo in the Campus Martius; honoured on the Palatine with Apollo and Diana","festival":"23 September, with Apollo","priest":"quindecimviri sacris faciundis","symbols":["veil","the Delian palm","twin children"],"epithets":["Latona Mater"],"sources":["Ovid, Metamorphoses 6.313-381","Horace, Carmen Saeculare"],"groups":[]},{"id":"asteria","name":"Asteria","latin":"Asteria","greek":"Asteria","tier":"titan","rank":2,"gender":"f","origin":"greek","domains":["falling stars","nocturnal prophecy"],"summary":"Latona's sister, who escaped Jupiter by turning into a quail and falling into the sea as the island Delos.","deeds":["Flees Jupiter as a quail and becomes the floating island Ortygia/Delos — the only ground that would later shelter her sister."],"state":"Latin poets use Ortygia for the island and rarely name Asteria herself.","temple":"None","festival":"None","priest":"None","symbols":["quail","falling star"],"epithets":["Ortygia"],"sources":["Hyginus, Fabulae 53"],"groups":[]},{"id":"sol","name":"Sol / Sol Invictus","latin":"Sol","greek":"Helios","etruscan":"Usil","tier":"titan","rank":7,"gender":"m","origin":"italic","domains":["the sun","the all-seeing witness","imperial legitimacy"],"summary":"The sun who sees everything and tells — and, by the third century AD, the closest Rome ever came to a state monotheism.","deeds":["Sees Venus and Mars in bed together and reports it to Vulcan, who traps them in a net of unbreakable bronze.","Grants his son Phaethon the sun-chariot for a day; the boy loses control, scorches the earth, and Jupiter strikes him down.","Father of Circe, Pasiphae and Aeetes — which is why Circe's Italian mountain matters to the Aeneid.","Nero's colossal statue beside the Flavian Amphitheatre was reworked into an image of Sol, and gave the Colosseum its name."],"state":"Aurelian, after crushing Palmyra, dedicated a vast Temple of Sol in AD 274 and created a new college of pontifices Solis, raising him nearly to sole state god. Constantine's coinage still read SOLI INVICTO COMITI years after 312. Note the correction: modern scholarship rejects the old idea of two separate sun gods — the archaic Sol Indiges and the late Sol Invictus are one continuous cult.","temple":"Shrine of Sol at the Circus Maximus; Sol Indiges on the Quirinal; Aurelian's Temple of Sol, AD 274","festival":"9 August (Sol Indiges); 28 August (Sol and Luna); Dies Natalis Solis Invicti, 25 December (attested only from the mid-4th century)","priest":"pontifices Solis (from AD 274)","symbols":["radiate crown","quadriga","whip","globe"],"epithets":["Indiges","Invictus","Sol Augustus"],"sources":["Ovid, Metamorphoses 2.1-400","Historia Augusta, Aurelian 25, 39"],"groups":["di_selecti"]},{"id":"luna","name":"Luna","latin":"Luna","greek":"Selene","etruscan":"Losna","tier":"titan","rank":6,"gender":"f","origin":"italic","domains":["the moon","the month","the ordering of time"],"summary":"The moon that set the Roman month — Kalends, Nones and Ides are all her phases, fossilised in the calendar.","deeds":["Loves the shepherd Endymion, laid in eternal sleep so she can visit him each night.","Drives the two-horse biga through the night sky, against Sol's four-horse quadriga.","With Diana and Hecate/Trivia forms the diva triformis, the triple goddess of sky, earth and underworld."],"state":"Varro records that the shrine of Luna Noctiluca on the Palatine shone through the night — noctu lucet templum — while her older temple on the Aventine was credited to Servius Tullius. One of Varro's twenty Di Selecti — proof that the cosmic powers outranked several Olympians in the older Roman scheme.","temple":"Temple on the Aventine (burned in the fire of AD 64); Luna Noctiluca on the Palatine","festival":"31 March; 28 August, with Sol","priest":"None","symbols":["crescent","biga","torch","billowing veil"],"epithets":["Noctiluca","Luna Lucifera"],"sources":["Varro, De Lingua Latina 5.68","Horace, Carmen Saeculare 35-36"],"groups":["di_selecti"]},{"id":"aurora","name":"Aurora","latin":"Aurora","greek":"Eos","etruscan":"Thesan","tier":"titan","rank":5,"gender":"f","origin":"greek","domains":["the dawn","dew","grief"],"summary":"The dawn who won her lover immortality and forgot to ask for youth — so he withered forever and could not die.","deeds":["Begs Jupiter to make Tithonus immortal but omits eternal youth; he shrivels until only his voice is left, and turns into a cicada.","Weeps for her son Memnon, killed by Achilles at Troy; the morning dew is her tears.","Carries off Cephalus, and with Astraeus mothers the Winds and the stars."],"state":"Essentially a poetic rather than a cultic figure at Rome — Latin epic uses her to mark the passage of days. Note a common modern error: Romans identified Mater Matuta with Ino/Leucothea, not with Aurora.","temple":"No state temple","festival":"None","priest":"None","symbols":["saffron robe","rosy fingers","chariot","torch"],"epithets":["Aurora Mater"],"sources":["Virgil, Aeneid 4.584-585","Ovid, Amores 1.13"],"groups":[]},{"id":"astraea","name":"Astraea / Iustitia","latin":"Iustitia","greek":"Astraia","tier":"titan","rank":4,"gender":"f","origin":"greek","domains":["justice","the Golden Age"],"summary":"The star-maiden of justice, last of the immortals to abandon the earth as the Iron Age came in — and the one whose return Augustan poets promised.","deeds":["Lives among men through the Golden Age; as bloodshed spreads she withdraws last of all the gods and becomes the constellation Virgo (Ovid, Met. 1.149-150).","Virgil's Fourth Eclogue announces iam redit et Virgo, redeunt Saturnia regna — the Virgin returns, the reign of Saturn returns."],"state":"Her Latin name is Iustitia, and the promise of her return became the single most powerful image in Augustan Golden-Age propaganda. Later emperors put IVSTITIA on their coins.","temple":"Shrine of Iustitia dedicated by Tiberius, AD 13","festival":"8 January (Iustitia)","priest":"None","symbols":["scales","the constellation Virgo","ear of wheat"],"epithets":["Iustitia Augusta"],"sources":["Ovid, Metamorphoses 1.149-150","Virgil, Eclogue 4.6","Hyginus, Astronomica 2.25"],"groups":["virtues","golden_age"]},{"id":"jupiter","name":"Jupiter","latin":"Iuppiter, Iovis","greek":"Zeus","etruscan":"Tinia","tier":"consentes","rank":10,"gender":"m","origin":"italic","domains":["the sky and thunder","sovereignty","oaths and treaties","the Roman state itself"],"summary":"Best and Greatest — the god who guaranteed every Roman oath, received every triumph, and whose Capitoline temple was the city's constitutional centre.","deeds":["Overthrows Saturn in the Titanomachy and divides the world by lot with Neptune and Pluto: sky, sea and underworld.","Sends the flood that wipes out the human race, sparing only Deucalion and Pyrrha, because he cannot bear what Lycaon has done.","Strikes Aesculapius dead with a thunderbolt for raising the dead — the boundary between mortal and immortal must hold.","When Tarquin cleared the Capitol for his temple, every god consented to be moved except Terminus and Juventas; the augurs read their refusal as the promise that Rome's borders would never recede.","In the Aeneid he alone knows the whole plan: he tells Venus of the empire without end, and finally forces Juno to accept the Trojan settlement in Latium."],"state":"Head of the Capitoline Triad. The flamen Dialis was Rome's senior priest, hedged with taboos so extreme he could not ride a horse, see an army, or spend a night outside the city. Consuls sacrificed to him on entering office; every treaty and every fetial declaration of war was sworn by him; and the triumphing general rode to his temple with his face painted red, dressed as the god.","temple":"Temple of Jupiter Optimus Maximus, Capitoline Hill — vowed by Tarquinius Priscus, dedicated 509 BC, the first year of the Republic. Also Jupiter Stator (vowed by Romulus, built 294 BC) and Jupiter Feretrius, the oldest of all, where the spolia opima were dedicated.","festival":"Ludi Romani, 5-19 September; Epulum Iovis, 13 September and 13 November; the Ides of every month; Vinalia, 23 April and 19 August","priest":"flamen Dialis (flamen maior)","symbols":["eagle","thunderbolt","sceptre","oak"],"epithets":["Optimus Maximus","Capitolinus","Stator","Feretrius","Tonans","Elicius","Victor"],"sources":["Virgil, Aeneid 1.223-296","Livy 1.10, 1.55","Ovid, Fasti 1.201-226"],"groups":["consentes","capitoline_triad","archaic_triad","di_selecti"]},{"id":"juno","name":"Juno","latin":"Iuno","greek":"Hera","etruscan":"Uni","tier":"consentes","rank":9,"gender":"f","origin":"italic","domains":["marriage and childbirth","women","the vital force of the state","warning"],"summary":"Queen of the gods and the most dangerous enemy in Roman literature — she spends twelve books of the Aeneid trying to stop Rome from existing.","deeds":["Hounds Aeneas and the Trojans across the Mediterranean out of hatred fed by the Judgement of Paris and the rape of Ganymede; when the gods will not help her she summons the Fury Allecto instead, and opens the Gates of War with her own hand.","Her sacred geese on the Capitol wake Manlius when the Gauls climb the rock by night in 390 BC, and Rome's citadel holds.","Formally 'called out' of Veii by Camillus in 396 BC and installed on the Aventine as Juno Regina — the enemy's own goddess persuaded to change sides.","Gives Flora's magic flower a purpose: touched by it she conceives Mars without Jupiter, in revenge for Minerva's motherless birth."],"state":"Second of the Capitoline Triad. Her Aventine cult was the collective institution of Roman matrons. The evocatio of an enemy city's Juno became Rome's standard technique for absorbing conquered gods — a religious policy of annexation. Her Capitoline temple housed the mint, and gave the world the word moneta.","temple":"Juno Moneta on the Arx, 344 BC; Juno Regina on the Aventine, 392 BC; Juno Sospita in the Forum Holitorium, 194 BC","festival":"Matronalia, 1 March; Nonae Caprotinae, 7 July; Juno Moneta, 1 June","priest":"flaminica Dialis (wife of the flamen Dialis); rex sacrorum's wife at the Kalends","symbols":["peacock","pomegranate","diadem","goatskin cloak and shield (Sospita)"],"epithets":["Regina","Moneta","Lucina","Sospita","Curitis","Caprotina"],"sources":["Virgil, Aeneid 1.1-33, 7.286-340","Livy 5.21-22, 5.47","Ovid, Fasti 6.183-190"],"groups":["consentes","capitoline_triad","di_selecti"]},{"id":"neptune","name":"Neptune","latin":"Neptunus","greek":"Poseidon","etruscan":"Nethuns","tier":"consentes","rank":8,"gender":"m","origin":"italic","domains":["the sea","springs and fresh water","horses","earthquakes"],"summary":"A god of springs and irrigation who only became a sea-god as Rome acquired a navy — his oldest festival is a rite against drought.","deeds":["Draws the sea in the three-way lot with Jupiter and Pluto.","Built the walls of Troy with Apollo and was cheated of payment — which is why he sends the sea-serpents that strangle Laocoön and his sons.","Despite that grudge, he calms the storm Juno raised against Aeneas with a single rebuke to the winds — Virgil compares him to a statesman quieting a riot, the founding simile of Roman political imagery (Aeneid 1.148-156).","Strikes the ground and produces the first horse — which is why he is Neptunus Equester, though the horse races on his day belong properly to Consus."],"state":"The Neptunalia, with its huts of leafy branches built for shade, is a drought rite — the mark of his origin as a god of fresh water. He rose in importance with Roman sea power; Sextus Pompeius styled himself Neptune's son and wore a sea-blue cloak.","temple":"Temple in the Circus Flaminius, c. 206 BC; Basilica Neptuni built by Agrippa, 25 BC","festival":"Neptunalia, 23 July","priest":"None","symbols":["trident","dolphin","horse"],"epithets":["Neptunus Equester","Neptunus Pater"],"sources":["Virgil, Aeneid 1.124-156, 2.199-227","Varro, De Lingua Latina 6.19"],"groups":["consentes","di_selecti","sea"]},{"id":"minerva","name":"Minerva","latin":"Minerva","greek":"Athena","etruscan":"Menrva","tier":"consentes","rank":9,"gender":"f","origin":"etruscan","domains":["wisdom and strategy","crafts and weaving","schools","medicine"],"summary":"Born fully armed from Jupiter's skull with no mother at all — patron of everyone in Rome who made something with their hands or taught for a living.","deeds":["Springs from Jupiter's head in full armour after he swallows Metis; Vulcan splits the skull with an axe to release her.","Cannot find a single fault in Arachne's tapestry of the gods' crimes — Ovid says neither Pallas nor Envy could fault that work — and tears it up anyway, then strikes the girl and turns her into a spider. The punishment is for what she wove, not for losing.","Guides Perseus against Medusa and afterwards wears the Gorgon's head on her aegis.","Her image, the Palladium, was the secret pledge of Troy's survival; Aeneas carried it to Italy and the Vestals guarded it in Rome. Rome's continued existence was believed to depend on it."],"state":"Third of the Capitoline Triad, and probably the most Etruscan of the three. Her Aventine temple was the headquarters of the guild of writers and actors; the Quinquatrus was the craftsmen's and schoolchildren's holiday, when pupils paid their teachers. Domitian took her as his personal patron.","temple":"Temple on the Aventine, c. 263-241 BC; Minerva Medica; Minerva in the Forum Transitorium, dedicated by Nerva AD 97","festival":"Quinquatrus, 19-23 March; Quinquatrus minusculae, 13 June (the flute-players' festival)","priest":"None (guild colleges)","symbols":["owl","aegis with the Gorgon's head","helmet","spear","olive"],"epithets":["Capitolina","Medica","Chalcidica"],"sources":["Ovid, Metamorphoses 6.1-145","Livy 26.27","Ovid, Fasti 3.809-848"],"groups":["consentes","capitoline_triad","di_selecti"]},{"id":"mars","name":"Mars","latin":"Mars, Mavors","greek":"Ares","etruscan":"Laran / Maris","tier":"consentes","rank":9,"gender":"m","origin":"italic","domains":["war","agriculture and the fields","boundaries","spring","virility"],"summary":"Not the Greeks' despised Ares but the father of the Roman people — a god of the farmed land as much as the battlefield, and the second power in the state.","deeds":["Fathers Romulus and Remus on the Vestal Rhea Silvia, and sends his wolf and his woodpecker to keep the exposed twins alive.","Drops the ancile, a shield of strange shape, from the sky into Numa's hands as a pledge of empire; Numa has eleven copies made so no thief could identify the true one.","In Ovid's version he is conceived by Juno alone, from a flower Flora gives her — a birth designed to answer Minerva's.","Avenges Julius Caesar: Augustus vowed a temple to Mars Ultor before Philippi and made it the ceremonial heart of his new Forum, where the Senate voted on war and boys came of age."],"state":"Second only to Jupiter and the father of the Roman people. The Salii, the leaping priests, danced the shields through the city in March and October to open and close the campaigning season. Before setting out, a general shook the sacred spears in Mars' shrine in the Regia crying Mars vigila — Mars, awake. His month opened the old Roman year.","temple":"Mars Ultor, Forum of Augustus, dedicated 2 BC; Temple of Mars outside the Porta Capena, 388 BC; the ancient altar of Mars on the Campus","festival":"Feriae Marti, 1 March (New Year in the old calendar); Equirria, 27 February and 14 March; Tubilustrium, 23 March; October Horse, 15 October; Armilustrium, 19 October","priest":"flamen Martialis (flamen maior); the Salii","symbols":["spear","shield (ancile)","wolf","woodpecker","laurel"],"epithets":["Ultor","Gradivus","Silvanus","Pater","Invictus"],"sources":["Livy 1.4, 1.20","Ovid, Fasti 3.1-98, 5.545-598","Cato, De Agricultura 141"],"groups":["consentes","archaic_triad","di_selecti"]},{"id":"venus","name":"Venus","latin":"Venus","greek":"Aphrodite","etruscan":"Turan","tier":"consentes","rank":9,"gender":"f","origin":"italic","domains":["love and desire","beauty","gardens","victory","the ancestry of Rome"],"summary":"Born from the sea-foam of a castrated sky-god, and by the end of the Republic the officially recognised ancestress of the ruling family.","deeds":["Born from the foam where Caelus' severed genitals fell into the sea — she is older than the Olympians she sits among.","Wins the Judgement of Paris by bribing him with Helen, and so causes the Trojan War, the fall of Troy, and the flight that ends in Italy.","Bears Aeneas to the mortal Anchises, then shields him through the sack of Troy, wins him Vulcan's armour, and heals his wound at Laurentum — the Aeneid is in part the story of a mother protecting her son.","Caught in bed with Mars by Vulcan's net of invisible bronze and exposed to the laughter of all the gods.","Snatches the soul of the murdered Julius Caesar and sets it in the sky as a comet, so that Augustus would not be the son of a mortal."],"state":"The dynastic ancestress of the gens Iulia and therefore of the emperors. Sulla called himself Felix under her favour, Pompey built her a temple to get around the ban on permanent theatres, and Caesar used Venus Victrix as his watchword at Pharsalus and then built her a temple in his own Forum as Venus Genetrix — the Mother. Venus Verticordia, the heart-turner, was invoked to restore chastity after prodigies.","temple":"Venus Erycina on the Capitol, vowed by Fabius Maximus after Trasimene in 217 and dedicated 215 BC, and outside the Porta Collina, 181 BC; Venus Genetrix in the Forum of Caesar, 46 BC; the Temple of Venus and Roma, dedicated AD 135","festival":"Veneralia, 1 April; Vinalia, 23 April and 19 August","priest":"None","symbols":["dove","myrtle","rose","scallop shell","mirror"],"epithets":["Genetrix","Victrix","Erycina","Verticordia","Felix","Obsequens"],"sources":["Virgil, Aeneid 1.223-304, 8.370-453","Ovid, Metamorphoses 15.843-851","Lucretius, De Rerum Natura 1.1-43"],"groups":["consentes","di_selecti","julian_line"]},{"id":"apollo","name":"Apollo","latin":"Apollo","greek":"Apollo","etruscan":"Aplu","tier":"consentes","rank":8,"gender":"m","origin":"greek","domains":["prophecy","healing and plague","music and poetry","the sun (later)"],"summary":"The only major Greek god Rome never renamed — he arrived as a plague-averter and ended as the personal patron of Augustus.","deeds":["Kills the Python at Delphi and takes the oracle from Themis.","With Diana shoots down all fourteen children of Niobe for her boast against Latona.","Flays Marsyas alive for challenging him to a music contest — the Roman world's favourite image of what happens when talent forgets rank.","His Sibyl's books, bought by Tarquin from the woman who burned six of the nine before he agreed to pay, became Rome's emergency oracle for eight centuries.","Ends the plague of 433 BC, which is why his first Roman temple was built at all."],"state":"Entered Rome not as a god of poetry but as Apollo Medicus, a plague-averter admitted on the authority of the Sibylline Books. After Actium — fought beside a temple of Apollo — Augustus made him his patron, built him a temple on the Palatine next to his own house, moved the Sibylline Books there from the Capitol, and held the Secular Games of 17 BC for Apollo and Diana.","temple":"Apollo Medicus in Circo, vowed 433, dedicated 431 BC — Rome's first and for centuries only Apollo temple; rebuilt as Apollo Sosianus c. 34 BC; Apollo Palatinus dedicated 9 October 28 BC","festival":"Ludi Apollinares, 6-13 July (instituted 212 BC, annual from 208 BC); 23 September","priest":"quindecimviri sacris faciundis (keepers of the Sibylline Books)","symbols":["lyre","bow","laurel","tripod","raven","griffin"],"epithets":["Medicus","Palatinus","Actius","Sosianus"],"sources":["Livy 4.25, 5.13","Virgil, Aeneid 6.9-155","Horace, Carmen Saeculare","Ovid, Metamorphoses 6.382-400"],"groups":["consentes","di_selecti"]},{"id":"diana","name":"Diana","latin":"Diana","greek":"Artemis","etruscan":"Artumes","tier":"consentes","rank":8,"gender":"f","origin":"italic","domains":["the hunt and wild animals","woodland","the moon","childbirth","slaves and the lower orders"],"summary":"Goddess of everything outside the walls — the woods, the wild, the moon, and the slaves who ran to her sanctuary for refuge.","deeds":["Born on Delos with Apollo, and — being born first — helps her mother deliver her twin.","Turns Actaeon into a stag for seeing her bathe, and his own fifty hounds tear him apart before he can say his name.","Demands Iphigenia at Aulis, then snatches her from the altar at the last moment and substitutes a deer.","Rescues the dead Hippolytus, hides him in mist, ages his face beyond recognition and settles him in her grove at Aricia under the new name Virbius.","Sends the nymph Opis to shoot the man who killed Camilla, her votary since infancy."],"state":"Her Aventine temple, credited to Servius Tullius, was the federal sanctuary of the Latin League and the political symbol of Rome's leadership of the Latins. Her sanctuary at Nemi was guarded by the rex Nemorensis — a runaway slave who won the priesthood by killing his predecessor and held it until someone killed him. Her cult was the characteristic refuge of slaves and plebeians.","temple":"Temple on the Aventine, traditionally Servius Tullius; the sanctuary of Diana Nemorensis at Lake Nemi, Aricia","festival":"Nemoralia, 13 August — a torchlit procession to Nemi and a slaves' holiday; 23 December","priest":"rex Nemorensis at Aricia","symbols":["bow and quiver","crescent moon","stag","hunting hounds","torch"],"epithets":["Nemorensis","Aventinensis","Trivia","Lucina","Tifatina"],"sources":["Ovid, Metamorphoses 3.138-252","Virgil, Aeneid 11.532-596","Livy 1.45","Strabo 5.3.12"],"groups":["consentes","di_selecti"]},{"id":"vulcan","name":"Vulcan","latin":"Volcanus, Vulcanus","greek":"Hephaestus","etruscan":"Sethlans / Velchans","tier":"consentes","rank":8,"gender":"m","origin":"italic","domains":["destructive fire","volcanoes","the forge","metalworking"],"summary":"Worshipped mainly so that he would stay away — a god of fire as a thing that burns cities down, with his oldest altar deliberately placed outside the sacred boundary.","deeds":["Forges Jupiter's thunderbolts and the aegis in his workshop under Aetna, with the Cyclopes at the bellows.","Traps Venus and Mars in a net of bronze so fine it is invisible, and invites the gods in to look.","At Venus' request forges the shield of Aeneas, on which he hammers out the whole future history of Rome down to Actium — a shield its bearer carries without understanding (Aeneid 8.626-731).","Flung from heaven by Jupiter and lamed by the fall; in the Roman version he fathers Cacus, the fire-breathing monster of the Aventine."],"state":"The Volcanal, an open-air altar beside the Comitium credited to Romulus, is one of Rome's oldest cult sites. His other temple stood out in the Campus Martius, outside the sacred boundary — Roman religious doctrine held that a god of destructive fire should be kept beyond the walls, though scholars still argue about how far that principle really governed the Volcanal itself. At the Vulcanalia live fish were thrown into bonfires as substitute victims: the small lives given so the great fire would take nothing else.","temple":"The Volcanal in the Comitium (open-air altar); temple in the Campus Martius near the Circus Flaminius","festival":"Vulcanalia, 23 August; Tubilustrium, 23 May","priest":"flamen Volcanalis (flamen minor)","symbols":["hammer","anvil","tongs","workman's cap (pileus)"],"epithets":["Mulciber (the smelter)","Volcanus Quietus"],"sources":["Virgil, Aeneid 8.370-453, 8.626-731","Ovid, Fasti 5.725-728","Varro, De Lingua Latina 6.20"],"groups":["consentes","di_selecti"]},{"id":"vesta","name":"Vesta","latin":"Vesta","greek":"Hestia","tier":"consentes","rank":9,"gender":"f","origin":"italic","domains":["the hearth","the sacred fire","the continuity of the Roman state"],"summary":"The most important cult in Rome and the one with almost no mythology — a round temple with no statue, a fire that must never go out, and six women who kept it for thirty years.","deeds":["Refuses the suits of Apollo and Neptune and swears perpetual virginity, taking the hearth as her portion instead.","Nearly raped in her sleep by Priapus at a country festival, and woken in time by the braying of Silenus' ass — which is why the ass is garlanded at her festival.","Her fire, brought from Troy by Aeneas together with the Penates and the Palladium, is the physical continuity between the burned city and the new one.","When the Gauls sacked Rome in 390 BC the Vestals carried the sacra to Caere on foot, and a plebeian named Albinius put his own family out of his cart to make room for them."],"state":"Six Vestals, chosen between six and ten years old, served thirty years. Letting the fire go out meant a flogging; unchastity meant being buried alive at the Campus Sceleratus. In exchange they were legally independent of any man, could make wills, were sacrosanct in public, and kept the state's most important documents — including the wills of Caesar and Augustus. The fire was ceremonially rekindled each 1 March; its extinction was a national portent. The order lasted until AD 394.","temple":"Aedes Vestae in the Roman Forum — round, with no cult statue, attributed to Numa; with the Atrium Vestae and the Regia","festival":"Vestalia, 7-15 June — the penus opened to matrons, then swept out and the refuse carried to the Tiber on 15 June","priest":"Six Vestal Virgins under the Pontifex Maximus","symbols":["the eternal flame","the hearth","the ass","the Palladium"],"epithets":["Vesta Mater","Vesta Publica Populi Romani Quiritium"],"sources":["Ovid, Fasti 6.249-460","Livy 5.40, 22.57","Plutarch, Numa 9-11"],"groups":["consentes","di_selecti"]},{"id":"mercury","name":"Mercury","latin":"Mercurius","greek":"Hermes","etruscan":"Turms","tier":"consentes","rank":8,"gender":"m","origin":"italic","domains":["commerce and profit","messages","travellers","eloquence","thieves","guiding the dead"],"summary":"The god of the deal — his name comes from merx, merchandise, and his festival was a rite for successful sharp practice.","deeds":["Invents the lyre from a tortoise-shell on the day of his birth, then steals Apollo's cattle and talks his way out of it.","Lulls hundred-eyed Argus to sleep with a story and kills him, freeing Io.","Carries Jupiter's order to Aeneas in Carthage: leave Dido, sail for Italy. The whole plot of the Aeneid turns on this single errand.","Escorts Proserpina up from the underworld, and guides the souls of the dead down."],"state":"A plebeian god of the Aventine, tied to the grain trade coming up the Tiber. His temple was dedicated in 495 BC by a mere centurion, chosen by the people over both consuls — a deliberate insult to the patricians and one of the first acts of the class struggle. At the Mercuralia merchants sprinkled themselves and their stock with water from his spring while praying, quite openly, for profitable deception. He has no flamen, which marks him as a relative latecomer.","temple":"Temple on the Aventine, dedicated 15 May 495 BC","festival":"Mercuralia, 15 May","priest":"None (the collegium mercuriale of traders)","symbols":["caduceus","winged sandals and petasus","purse","cockerel","tortoise"],"epithets":["Mercurius Felix"],"sources":["Virgil, Aeneid 4.219-278","Ovid, Fasti 5.663-692","Livy 2.27"],"groups":["consentes","di_selecti"]},{"id":"ceres","name":"Ceres","latin":"Ceres","greek":"Demeter","etruscan":"Vei","tier":"consentes","rank":8,"gender":"f","origin":"italic","domains":["grain and agriculture","the fertility of the earth","motherhood","plebeian law"],"summary":"The grain goddess who starved the world to get her daughter back — and at Rome, the legal guarantor of the plebeian order.","deeds":["Searches the whole earth by torchlight for Proserpina after Pluto takes her, and blights every field until Jupiter is forced to negotiate the divided year.","Curses the boy Ascalaphus, who reported the eaten pomegranate seeds, into an owl.","Teaches Triptolemus agriculture and sends him out in a dragon-drawn chariot to spread it.","Comes to Rome by Sibylline oracle during the famine of 496 BC, and her temple becomes the first Greek-style building in the city, vowed by a dictator and dedicated by a consul three years later."],"state":"The pivot of plebeian identity. Her Aventine temple housed the plebeian archives and copies of every senatorial decree; the plebeian aediles took their name and their headquarters from it. The persons of the tribunes were sanctified by her, and the property of anyone who harmed a tribune was forfeit to Ceres. Her flamen, the flamen Cerialis, served her jointly with Tellus. At the Cerialia foxes with burning brands tied to their tails were released in the Circus.","temple":"Temple of Ceres, Liber and Libera on the Aventine — vowed 496 BC by the dictator A. Postumius, dedicated 493 BC by the consul Sp. Cassius","festival":"Cerialia, 12-19 April; Sementivae, late January; the fast of Ceres, 4 October (from 191 BC)","priest":"flamen Cerialis (flamen minor), with Greek priestesses from Naples and Velia","symbols":["wheat sheaf","torch","poppy","sow","mural crown"],"epithets":["Ceres Mater","Legifera (law-giver)"],"sources":["Ovid, Fasti 4.393-620","Ovid, Metamorphoses 5.341-571","Livy 2.41, 3.55"],"groups":["consentes","aventine_triad","di_selecti"]},{"id":"janus","name":"Janus","latin":"Ianus","greek":"none — uniquely Roman","etruscan":"Ani (tentative)","tier":"major","rank":8,"gender":"m","origin":"italic","domains":["beginnings and endings","doors and gates","transitions","war and peace"],"summary":"Rome's own invention, with no Greek counterpart at all — the god of the threshold, named first in every prayer to any god.","deeds":["Receives the exiled Saturn in Latium and shares the kingship of the Golden Age with him.","Saves Rome from the Sabines by making a scalding spring erupt in their faces as they force the Janiculum gate.","Gives his name to January, and is credited with teaching men the calendar, coinage and shipbuilding.","His two faces see the way in and the way out at once — Ovid has him explain that he is the doorkeeper of heaven itself, and that no prayer reaches any other god except through him."],"state":"Invoked first in every Roman prayer: Janus primus, Vesta extrema — Janus first, Vesta last. The Gates of War in the Forum stood open the whole time Rome was at war and were shut only when the empire was at peace everywhere. Augustus records in the Res Gestae that they had been closed just twice in the whole span before his birth; he closed them three times himself and made sure everyone knew it. He had no flamen; the rex sacrorum performed his rites, which marks him as older than the priestly system.","temple":"The Ianus Geminus, a bronze double-gated passage in the Forum attributed to Numa; a temple in the Forum Holitorium, 260 BC","festival":"Agonalia, 9 January; invoked at the Kalends of every month; 17 August","priest":"rex sacrorum","symbols":["two faces (bifrons)","key","staff","the arch"],"epithets":["Ianus Pater","Geminus","Patulcius and Clusius (opener and shutter)","Bifrons","Quirinus"],"sources":["Ovid, Fasti 1.63-288","Livy 1.19","Augustus, Res Gestae 13","Macrobius, Saturnalia 1.9"],"groups":["di_selecti","golden_age"]},{"id":"pluto","name":"Pluto / Dis Pater","latin":"Dis Pater, Pluto","greek":"Hades, Plouton","etruscan":"Aita","tier":"chthonic","rank":8,"gender":"m","origin":"italic","domains":["the underworld","the dead","buried wealth and minerals"],"summary":"The rich one — Romans named the lord of the dead for the wealth under the ground before they named him for the dead themselves.","deeds":["Takes the underworld in the three-way lot with Jupiter and Neptune.","Struck by Cupid's arrow at Venus' order, he seizes Proserpina from the meadow at Enna and splits the earth open to carry her down.","Tricks her into eating pomegranate seeds so that she can never wholly leave — and so creates the seasons.","Grants Orpheus his one condition and takes it back the instant he turns; refuses no one who arrives properly, and releases almost no one."],"state":"A wealth-god (dives, whence Dis) before an underworld god. His altar at the Tarentum in the Campus Martius was discovered, so the story goes, when a Sabine named Valesius dug for water to cure his children and struck a buried altar twenty feet down. That altar was the foundation of the Ludi Saeculares — the epoch-marking Secular Games of 249, 146 and 17 BC — held at night with black victims. The mundus pit, the mouth of the underworld in the Forum, was opened three days a year: 24 August, 5 October, 8 November.","temple":"Subterranean altar at the Tarentum in the Campus Martius; no ordinary temple","festival":"Ludi Saeculares (nocturnal rites to Dis and Proserpina); mundus patet 24 Aug, 5 Oct, 8 Nov","priest":"quindecimviri sacris faciundis","symbols":["bident","cypress","key","cornucopia (as wealth)","Cerberus"],"epithets":["Dis Pater","Orcus","Pluto","Summanus (partly)"],"sources":["Ovid, Fasti 4.417-454","Ovid, Metamorphoses 5.341-571","Zosimus 2.1-3","Caesar, Bellum Gallicum 6.18"],"groups":["underworld"]},{"id":"proserpina","name":"Proserpina","latin":"Proserpina","greek":"Persephone","etruscan":"Phersipnai","tier":"chthonic","rank":7,"gender":"f","origin":"italic","domains":["the underworld","seed-corn","the return of spring","curses"],"summary":"Queen of the dead for half the year and the returning spring for the other half — and the goddess Romans named most often when they wanted someone destroyed.","deeds":["Seized at Enna while gathering flowers; the flowers fall from her loosened dress, and Ovid notes that she wept for them as much as for her mother.","Eats seven pomegranate seeds in the garden below; in Ovid's Roman version this splits her year exactly in half, six months above and six below.","Grants Orpheus his single condition — the only time, Ovid says, the queen of the dead was moved.","Releases Alcestis, and judges the dispute between Venus and Psyche over the casket of beauty."],"state":"The goddess of Roman curse tablets. More defixiones — thin lead sheets scratched with curses, folded, pierced with a nail and dropped into a grave or a spring — invoke Proserpina than any other deity. In the Aventine cult she merges with Libera, which gives her a plebeian face alongside the chthonic one.","temple":"Shares the Tarentum altar with Dis Pater; honoured with Ceres on the Aventine","festival":"Ludi Saeculares; expiatory rites of 249 and 207 BC; the Cerialia with her mother","priest":"quindecimviri sacris faciundis","symbols":["pomegranate","torch","sheaf of grain","bat"],"epithets":["Proserpina Regina","Libera (assimilated)"],"sources":["Ovid, Fasti 4.417-620","Ovid, Metamorphoses 5.385-571","Apuleius, Metamorphoses 6"],"groups":["underworld","aventine_triad"]},{"id":"bacchus","name":"Bacchus / Liber Pater","latin":"Liber Pater, Bacchus","greek":"Dionysus","etruscan":"Fufluns","tier":"major","rank":7,"gender":"m","origin":"italic","domains":["wine and the vine","ecstatic release","male fertility","civic freedom"],"summary":"Two gods in one name: the respectable Italic Liber who freed boys into manhood, and the Greek Bacchus whose cult the Senate crushed in 186 BC.","deeds":["Born twice — snatched from the ashes of Semele, whom Juno tricked into asking Jupiter to appear in his true form, and sewn into Jupiter's thigh until term.","Captured by Tyrrhenian pirates who plan to sell him; vines grow up the mast, phantom beasts fill the deck, and the crew leap overboard as dolphins.","Destroys Pentheus of Thebes by driving the women of the city mad, so that his own mother tears him apart believing him a lion.","Gives Midas the golden touch he asked for, and then the means to wash it off.","Finds Ariadne abandoned on Naxos, marries her, and sets her crown in the sky as the Corona Borealis."],"state":"The Bacchanalia scandal of 186 BC produced the Senatus consultum de Bacchanalibus, the harshest religious suppression in Roman history — thousands executed across Italy — because a private, mixed-sex, night-time association with its own oaths looked exactly like a conspiracy. Liber himself stayed respectable: at the Liberalia boys put on the toga virilis, and phallic carts were drawn through the fields for the harvest.","temple":"Aventine Triad temple with Ceres and Libera, 493 BC","festival":"Liberalia, 17 March; the Vinalia with Jupiter and Venus","priest":"Sacerdotes of the Aventine triad; old women (sacerdotes Liberi) sold honey-cakes at the Liberalia","symbols":["thyrsus","ivy","grapes","panther","phallus","kantharos cup"],"epithets":["Liber Pater","Bacchus","Bassareus","Lyaeus"],"sources":["Livy 39.8-19","Ovid, Metamorphoses 3.511-733, 4.1-415","Ovid, Fasti 3.713-790","CIL I2 581"],"groups":["aventine_triad","di_selecti"]},{"id":"libera","name":"Libera","latin":"Libera","greek":"Persephone / Ariadne","tier":"major","rank":5,"gender":"f","origin":"italic","domains":["female fer
